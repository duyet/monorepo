ource": "user-duyet-stack", "target": "user-duyet-active-projects"}}, {"data": {"id": "user-duyet-stack__user-duyet-ai-stance", "source": "user-duyet-stack", "target": "user-duyet-ai-stance"}}, {"data": {"id": "user-duyet-stack__user-duyet-data-clickhouse", "source": "user-duyet-stack", "target": "user-duyet-data-clickhouse"}}, {"data": {"id": "user-duyet-stack__user-duyet-data-spark-airflow", "source": "user-duyet-stack", "target": "user-duyet-data-spark-airflow"}}, {"data": {"id": "user-duyet-stack__user-duyet-homelab", "source": "user-duyet-stack", "target": "user-duyet-homelab"}}, {"data": {"id": "user-duyet-stack__user-duyet-infra-cloudflare", "source": "user-duyet-stack", "target": "user-duyet-infra-cloudflare"}}, {"data": {"id": "user-duyet-stack__user-duyet-infra-kubernetes", "source": "user-duyet-stack", "target": "user-duyet-infra-kubernetes"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-python", "source": "user-duyet-stack", "target": "user-duyet-lang-python"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-rust", "source": "user-duyet-stack", "target": "user-duyet-lang-rust"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-sql", "source": "user-duyet-stack", "target": "user-duyet-lang-sql"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-typescript", "source": "user-duyet-stack", "target": "user-duyet-lang-typescript"}}, {"data": {"id": "user-duyet-stack__user-duyet-local-dev", "source": "user-duyet-stack", "target": "user-duyet-local-dev"}}, {"data": {"id": "user-duyet-stack__user-duyet-profile", "source": "user-duyet-stack", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-active-projects", "source": "user-duyet-web-presence", "target": "user-duyet-active-projects"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-github", "source": "user-duyet-web-presence", "target": "user-duyet-github"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-profile", "source": "user-duyet-web-presence", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-blog", "source": "user-duyet-web-presence", "target": "user-duyet-site-blog"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-homelab", "source": "user-duyet-web-presence", "target": "user-duyet-site-homelab"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-kb", "source": "user-duyet-web-presence", "target": "user-duyet-site-kb"}}], "bodies": {"feedback-cheap-models-subagents": "Default sub-agents to mid/cheap tiers for mechanical work; reserve expensive models for hard reasoning.\n\n**Why:** parallel fan-out multiplies cost.\n**How to apply:** pass explicit cheaper model on dispatch. Related: [[tech-agent-loop-cheap-subagents]], [[feedback-working-style]].", "feedback-concise-english": "Use simple, short English. No filler (\"comprehensive\", \"elaborate\").\n\n**Why:** faster review, clearer agent output.\n**How to apply:** trim adverbs; prefer lists; match [[feedback-semantic-commits]].", "feedback-disambiguate-repo": "Duyet multi-homes work: chmonitor, AnyRouter, AgentState, AnyWorker, OMA, monorepo, kb, homelab.\n\n**How to apply:** if the chat is ambiguous, ask or infer from cwd/path; never assume monorepo. Index: [[user-duyet-active-projects]], [[user-duyet-multi-project]].", "feedback-docs-driven-development": "Pattern:\n\n1. [[feedback-docs-router-tiny]] \u2014 keep CLAUDE.md/AGENTS.md short\n2. [[feedback-docs-kb-is-brain]] \u2014 structured notes are the memory\n3. [[feedback-docs-read-on-entry]] \u2014 index first\n4. [[feedback-docs-write-on-exit]] \u2014 capture before context dies\n\nImplemented by [[project-kb]]. Owner stance: [[user-duyet-ai-stance]].", "feedback-docs-kb-is-brain": "A public/shared kb persists across tools and sessions. This repo is that brain: [[project-kb]].\n\n**How to apply:** atomic notes + `MEMORY.md` index + [[tech-okf-bundle]].", "feedback-docs-read-on-entry": "Trigger: session start / new task \u2192 open MEMORY.md, then only matching notes.\n\n**How to apply:** never bulk-load entire memory/. See [[feedback-docs-write-on-exit]].", "feedback-docs-router-tiny": "Router files rot if they hold feature contracts. Point to notes instead.\n\n**How to apply:** put durable facts in [[project-kb]] notes; keep routers as indexes. See [[feedback-docs-driven-development]].", "feedback-docs-write-on-exit": "Trigger: learned durable public fact \u2192 note or inbox, then lint/sync.\n\n**How to apply:** public-only (AGENTS.md \u00a73). Pair with [[feedback-docs-read-on-entry]].", "feedback-fail-loud": "Surface uncertainty and skipped work. \"Tests pass\" is false if any were skipped.\n\n**How to apply:** list what was not verified. Pair with [[feedback-logic-change-update-tests]].", "feedback-logic-change-update-tests": "If you rename contracts or change behavior tests lock, grep tests and update expected values in the same PR.\n\n**Why:** green \"new code only\" still breaks CI.\n**How to apply:** run related suite before claiming done. See [[feedback-fail-loud]], [[tech-codebase-maintenance-loop]].", "feedback-never-auto-merge-release-please": "Do not arm auto-merge on release-please PRs (`chore(main): release X.Y.Z`, branches `release-please--*`).\n\n**How to apply:** fix/CI babysit only; human merges releases. See [[tech-release-please-basics]], [[project-open-managed-agents]].", "feedback-public-kb-only": "This repo is public. Store durable, generic, public facts only.\n\n**Ban:** credentials, hostnames, IPs, machine names, employer-internal codenames, private topology.\n**Allow:** public `duyet/*` GitHub repos, published blog/CV facts, reusable tech patterns.\nSee AGENTS.md \u00a73. Hub: [[project-kb]].", "feedback-semantic-commits": "Conventional Commits style. Subject: lowercase, short. Body only when needed.\n\n**How to apply:** `feat(scope): \u2026`, `fix(scope): \u2026`, `chore: \u2026`. Related: [[tech-release-please-pr-title]], [[feedback-concise-english]].", "feedback-simple-code": "Ship the smallest correct change. No unused flexibility.\n\n**Why:** less debt, easier agent diffs.\n**How to apply:** delete speculative layers; match [[feedback-surgical-changes]].", "feedback-surgical-changes": "Every changed line must map to the user request. Mention unrelated dead code; don't delete it unless asked.\n\n**How to apply:** read callers first; avoid formatting-only churn. See [[feedback-simple-code]].", "feedback-working-style": "Agent working-style index:\n\n- [[feedback-concise-english]] \u00b7 [[feedback-simple-code]] \u00b7 [[feedback-semantic-commits]]\n- [[feedback-surgical-changes]] \u00b7 [[feedback-fail-loud]]\n- [[feedback-docs-driven-development]] \u00b7 [[feedback-cheap-models-subagents]]\n- [[feedback-logic-change-update-tests]] \u00b7 [[feedback-never-auto-merge-release-please]]\n\n- [[feedback-disambiguate-repo]] \u2014 multi-product sessions\n\nOwner: [[user-duyet-profile]].", "project-agentstate": "github.com/duyet/agentstate \u00b7 https://agentstate.app\n\nFleet **state/coordination** API (not an agent framework \u2014 [[tech-agentstate-not-a-framework]]). Five primitives: [[tech-agentstate-five-primitives]].\n\nProduct version is [[tech-release-please-basics]]: standing `chore(main): release X.Y.Z` PR, human-merge only ([[feedback-never-auto-merge-release-please]]). In 0.x, `feat` bumps minor (`bump-patch-for-minor-pre-major: false`). `/api` reports that semver.\n\nSDKs: npm `@agentstate/sdk`, PyPI `agentstate`. MCP available. MIT, self-hostable.\nPortfolio: [[user-duyet-active-projects]]. Related: [[project-anyworker]], [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "project-anyrouter-openai-compat": "AnyRouter accepts OpenAI Chat Completions-shaped clients (and Anthropic Messages). Integrate by changing base URL + model id.\n\nProduct hub: [[project-anyrouter]]. Gateway lessons: [[tech-llm-gateway-quota-as-retryable]].", "project-anyrouter": "https://anyrouter.dev \u2014 **universal AI model router**: one API, many providers/models, OpenAI Chat Completions + Anthropic Messages compatible.\n\nProduct traits (public): multi-provider routing, BYOK, pricing/latency comparison, Cloudflare-edge deploy.\nPackages mentioned publicly: `@anyr/sdk`, `@anyr/cli`.\n\nAPI shape: [[project-anyrouter-openai-compat]]. Patterns: [[tech-llm-gateway-byok-sibling]], [[tech-llm-gateway-quota-as-retryable]], [[tech-cloudflare-ai-gateway-transparent]], [[tech-workers-cache-enabled]].\nPortfolio: [[user-duyet-active-projects]]. Related products: [[project-agentstate]], [[project-anyworker]].", "project-anyworker-local-agent": "[[project-anyworker]] splits **marketing Worker** (`apps/web`) from **local agent product** (`apps/anyworker` server + GUI).\n\nRelated: [[project-agentstate]], [[user-duyet-ai-stance]].", "project-anyworker": "github.com/duyet/anyworker \u00b7 https://anyworker.dev\n\nOpen \u201cAI that does the work\u201d product. Split: marketing Worker vs local agent+GUI ([[project-anyworker-local-agent]]).\n\npnpm monorepo; TanStack Start web ([[tech-tanstack-start-ssg]]). Related: [[project-agentstate]], [[project-anyrouter]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "project-charts": "github.com/duyet/charts \u2014 public Helm charts, tested with KinD. Related: [[user-duyet-infra-kubernetes]], [[reference-duyet-github]].", "project-chmonitor-advisor": "chmonitor advisor mode is **recommend-only** \u2014 projections, skip indexes, partitions, MVs \u2014 never silent schema mutations.\n\nHub: [[project-clickhouse-monitoring]]. Safety culture: [[feedback-fail-loud]].", "project-clickhouse-monitoring": "github.com/chmonitor/chmonitor \u00b7 https://chmonitor.dev \u00b7 docs.chmonitor.dev\n\n**chmonitor** \u2014 ClickHouse operational advisor + real-time monitoring, MCP, AI chat. Advisor is recommend-only ([[project-chmonitor-advisor]]).\n\nOSS self-host and hosted Cloud from one product family ([[tech-one-codebase-oss-saas]], [[tech-single-source-env]]).\n**Image:** `ghcr.io/chmonitor/chmonitor:latest` (not the stale `ghcr.io/duyet/chmonitor` path).\n**Homelab self-host ops:** [[lessons-chmonitor-homelab-deploy]] (full cluster vs public `dash.chmonitor.dev`; never assign CH `readonly=1` profile to the dashboard user).\nFocus: [[user-duyet-focus-clickhouse]]. Portfolio: [[user-duyet-active-projects]].", "project-duyetbot": "duyetbot maintains [[project-monorepo]] within scope: code, design system, deploy config.\n\nOut of scope without human direction: authored blog posts and curated timeline research facts.\nLoops: [[tech-improvement-loop]], [[tech-agent-loop-cycle]]. Memory model: [[feedback-docs-driven-development]].", "project-homelab": "github.com/duyet/homelab \u2014 public personal homelab configs/experiments.\n\nRelated: [[user-duyet-homelab]], [[project-charts]], [[user-duyet-site-homelab]].\nKeep kb notes generic \u2014 no private inventory.", "project-kb-site": "Public site for [[project-kb]]. Graph + llms.txt endpoints for agents. Pattern: [[feedback-docs-driven-development]]. Link: [[user-duyet-site-kb]].", "project-kb": "github.com/duyet/kb \u2014 this repository. Protocol: AGENTS.md. Index: MEMORY.md. Graph: [[tech-okf-bundle]].\n\nPattern: [[feedback-docs-driven-development]]. Site: [[user-duyet-site-kb]] / [[project-kb-site]]. Scope: [[feedback-public-kb-only]].", "project-llm-timeline": "App in [[project-monorepo]]: https://llm-timeline.duyet.net \u2014 large static timeline (1950\u2013present).\n\nUses [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]]. Curated model data is human-owned research.", "project-monorepo": "github.com/duyet/monorepo \u2014 public web monorepo (blog, CV, timeline apps, shared packages).\n\nStack: Bun, Turborepo, TanStack Start SSG, Cloudflare Pages.\nRelated: [[project-llm-timeline]], [[project-duyetbot]], [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]].", "project-open-managed-agents": "github.com/duyet/oma \u00b7 https://oma.duyet.net \u00b7 docs: https://docs.oma.duyet.net\n\nOpen-source reimplementation of a **Managed Agents**-style API. Meta-harness: platform prepares tools/skills/sandbox/credentials; pluggable harness drives the model loop.\n\nRuns two ways: Cloudflare (Workers + Durable Objects) or self-host Node/`docker compose` \u2014 same business logic.\nInvariants: [[tech-oma-credentials-out-of-sandbox]], [[tech-prompt-cache-byte-sensitive]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "lessons-chmonitor-homelab-deploy": "# Lessons \u2014 chmonitor on homelab k3s\n\n## Two different instances (do not conflate)\n\n| Instance | Purpose | Data |\n|----------|---------|------|\n| **Public Cloud/demo** (`dash.chmonitor.dev`) | SaaS + limited public demo | Limited tables, intentionally constrained |\n| **Homelab self-host** (private Traefik + OAuth) | Full cluster ops UI | All DBs/schemas; expected higher metrics volume |\n\nHomelab is supposed to \u201cshow more performance\u201d \u2014 that is normal, not a bug vs public.\n\n## Image (2026-08)\n\n- **Canonical:** `ghcr.io/chmonitor/chmonitor:latest` (`imagePullPolicy: Always`)\n- **Stale:** `ghcr.io/duyet/chmonitor:latest` \u2014 no longer receives CI builds; redeploy pulls same old digest forever\n- Helm chart repo: `https://charts.chmonitor.dev` (chart `chmonitor`); source repo moved to `chmonitor/chmonitor`\n\n## ClickHouse user for the dashboard\n\n- Use a **dedicated user** with **privilege-based** read-only: `GRANT SELECT, SHOW, dictGet ON *.*` (or narrower), not the server **`readonly` settings profile** (`readonly=1`).\n- chmonitor always sets **`max_execution_time`** as a **session setting** on the client. With `readonly=1` ClickHouse returns:\n\n  ```text\n  Cannot modify 'max_execution_time' setting in readonly mode\n  ```\n\n  \u2192 `/api/healthz` fails \u2192 readiness 503 \u2192 pod never Ready.\n- Prefer a normal/`monitoring` profile + grants. Homelab pattern: user `chmonitor` + role with SELECT/SHOW on all DBs.\n\n## Auth (homelab)\n\n- Behind Traefik **forwardAuth** + oauth2-proxy (GitHub via Dex). See [[tech-forwardauth-preserve-status]].\n- chmonitor-scoped middleware stamps a **shared secret** header (`X-Chm-Proxy-Secret`); app trusts identity headers only when secret matches (`CHM_AUTH_PROVIDER=proxy` or `trusted` depending on image).\n- Unauthenticated external hit \u2192 **302** to the auth portal is expected.\n\n## Ops checklist\n\n1. Confirm image is `ghcr.io/chmonitor/chmonitor:\u2026` and pull/restart after new builds.\n2. Confirm CH user can run `SELECT 1 SETTINGS max_execution_time = 60`.\n3. Confirm `/api/healthz` reports host `up` and tables/overview APIs return full schema count.\n4. Do not use public-demo connection limits as the model for homelab grants.\n\n**Why:** future agents diagnose \u201cchmonitor down\u201d or \u201cempty schemas\u201d without mixing public SaaS and private cluster, and avoid the readonly-profile trap.\n**How to apply:** when redeploying or debugging homelab chmonitor, check image org + CH profile first; grant schema via SQL privileges, not `readonly=1`.", "reference-ai-sdk-uimessage": "Vercel AI SDK `UIMessage` = `{id, role, parts[], metadata?}`. Renderer switches on `part.type` and drops unknowns.\n\nNative tool parts: `dynamic-tool` / `tool-${name}` with `{state, input, output}`.\nSee [[tech-ai-sdk-history-dto-convert]], [[tech-ai-agent-stack]].", "reference-cloudflare-acquires-astro": "Cloudflare acquired The Astro Technology Company (announced 2026-01-16). Astro stays open source.\n\nFlue (`withastro/flue`) is from that team post-acquisition. Related: [[tech-flue-register-in-initializer]], [[user-duyet-infra-cloudflare]].", "reference-duyet-blog": "Themes by volume: ClickHouse \u00b7 Rust \u00b7 AI agents \u00b7 data eng (Airflow, DuckDB) \u00b7 tooling.\n\nSite: [[user-duyet-site-blog]]. Stance: [[user-duyet-ai-stance]]. Focus: [[user-duyet-focus-clickhouse]].", "reference-duyet-github": "Notable public repos (non-exhaustive):\n\n| Area | Repos |\n|------|-------|\n| ClickHouse | [[project-clickhouse-monitoring]], `clickhouse-udf-rs` |\n| LLM / agents | [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]] |\n| Web | [[project-monorepo]], [[project-kb]] |\n| Homelab / infra | [[project-homelab]], [[project-charts]], `gaxy` |\n| Older popular | `bruteforce-database`, `pricetrack` |\n\nHub: [[user-duyet-github]]. Stack: [[user-duyet-stack]].", "tech-pin-github-actions": "Actions run with repo secrets. Prefer `@vX.Y.Z` or commit SHA pins; avoid floating `@v0`.\n\nIncident reference: trivy-action tags force-pushed (2026). Related: [[tech-trivy-two-phase]], [[feedback-public-kb-only]].", "tech-release-please-basics": "release-please maintains a release PR and CHANGELOG from conventional commits. Merging releases tags/publishes.\n\nPrefer release-published workflows over raw tag push to avoid duplicates. Related: [[tech-release-please-pr-title]], [[feedback-never-auto-merge-release-please]].", "tech-release-please-pr-title": "Invalid PR titles are silently dropped from bumps. Guard titles with the same commitlint config as local hooks.\n\nRelated: [[tech-release-please-basics]], [[feedback-semantic-commits]], [[tech-release-please-pre1-minor]].", "tech-release-please-pre1-minor": "In 0.x, `bump-patch-for-minor-pre-major: true` makes plain `feat` \u2192 patch (`feat!:` or BREAKING CHANGE for minor). Set it **false** (keep `bump-minor-pre-major: true`) if 0.x should move `0.1` \u2192 `0.2` on each feature release.\n\nRelated: [[tech-release-please-basics]], [[tech-release-please-pr-title]].", "tech-trivy-two-phase": "Phase 1: scan with exit 0 for artifacts. Phase 2: fail on CRITICAL/HIGH, ideally reusing setup.\n\nRelated: [[tech-pin-github-actions]], [[tech-codebase-maintenance-loop]].", "tech-cloudflare-ai-gateway-transparent": "AI Gateway routes by provider/prefix and forwards model strings. \"Invalid model ID\" is usually upstream or unknown provider prefix.\n\nCustom providers: base URL + slug; model path appended. Related: [[project-anyrouter]], [[tech-llm-gateway-quota-as-retryable]].", "tech-cloudflare-pages-deploy": "Habit: commit \u2192 push \u2192 deploy the changed Pages app \u2192 verify HTTP 200.\n\nHazard: scripts that rename local env files mid-deploy must not run in parallel.\nRelated: [[tech-tanstack-start-ssg]], [[project-monorepo]], [[feedback-semantic-commits]].", "tech-forwardauth-preserve-status": "When Traefik forwardAuth + OAuth2 Proxy sit behind error middleware, ensure 302 challenges are not replaced by generic error pages.\n\nPattern: explicit redirect path for auth challenges. Generic edge auth lesson \u2014 no private hostnames.", "tech-workers-cache-enabled": "Workers Cache sits in front of a Worker. Enable: `cache: { enabled: true }` in wrangler.\n\nSafe default: only responses with explicit public `Cache-Control` are stored. Auth headers auto-bypass.\nSee [[tech-workers-cache-swr]], [[tech-workers-cache-hit-skips-cpu]].", "tech-workers-cache-hit-skips-cpu": "A cache HIT is served from the edge tier without invoking the Worker isolate.\n\nGreat for SSR-as-origin frameworks. Enable carefully with public CC only: [[tech-workers-cache-enabled]].", "tech-workers-cache-swr": "Use `Cache-Control: public, max-age=\u2026, stale-while-revalidate=\u2026` so users rarely wait on origin re-render.\n\nPair with [[tech-workers-cache-enabled]], [[tech-workers-cache-tags]].", "tech-workers-cache-tags": "Set `Cache-Tag` on responses; purge by tag after content updates.\n\nRelated: [[tech-workers-cache-enabled]], [[tech-workers-cache-swr]].", "tech-qdrant-config-at-create": "Don't assume live config edits always apply retroactively. Prefer correct create params; use `update_collection` when supported.\n\nRelated: [[tech-qdrant-hnsw-timeout]].", "tech-qdrant-hnsw-timeout": "High-dimension float32 collections can devolve to expensive scans. Tune HNSW + consider INT8 quantization.\n\nConfig timing: [[tech-qdrant-config-at-create]]. Related: [[tech-rag-metadata-key-drift]].", "tech-agentstate-five-primitives": "[[project-agentstate]] exposes five fleet primitives: **states**, **leases**, **claims**, **capability tokens**, **conversations**.\n\nUse when multi-agent systems need shared state/locking/delegation without reinventing a backend.\nSee also [[tech-agentstate-not-a-framework]]. Related: [[tech-ai-agent-stack]], [[project-anyworker]].", "tech-agentstate-not-a-framework": "AgentState does **not** replace LangGraph/AI SDK/etc. It is the state/coordination layer agents call.\n\nRelated: [[project-agentstate]], [[tech-agentstate-five-primitives]], [[tech-ai-agent-stack]].", "tech-ai-agent-stack": "Common public stack pieces:\n\n| Piece | Role |\n|-------|------|\n| Vercel AI SDK | streaming UI + tools |\n| LangGraph / LangChain | graphs & chains |\n| Cloudflare Agents SDK | Workers + DO agents |\n| MCP | tool servers |\n| Flue / Hermes | agent runtimes |\n\nStance: [[user-duyet-ai-stance]]. Runtimes: [[tech-eve-filesystem-agents]], [[tech-hermes-custom-provider]], [[tech-hermes-steer-mode]], [[tech-hermes-dashboard-auth-gate]]. Projects: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]], [[project-duyetbot]].", "tech-ai-sdk-history-dto-convert": "Map `tool-call`/`args`/`result` \u2192 `dynamic-tool` with `input`/`output` and correct `state`. Map annotations \u2192 `data-*` parts.\n\nKeep one endpoint for multiple clients until legacy dies. Related: [[reference-ai-sdk-uimessage]], [[tech-ai-sdk-uimessage-native-tools]].", "tech-ai-sdk-uimessage-native-tools": "Live streams use native part types; history DTOs often use `tool-call` + `annotations` and disappear on reload.\n\nConvert at the client boundary: [[tech-ai-sdk-history-dto-convert]]. Shape: [[reference-ai-sdk-uimessage]].", "tech-eve-filesystem-agents": "Filesystem-first agents keep prompts, memory, and tool config as files \u2014 greppable and PR-reviewable.\n\nAligns with [[feedback-docs-driven-development]]. Stack map: [[tech-ai-agent-stack]].", "tech-flue-register-in-initializer": "Flue addresses models as `provider/model`. Register custom providers inside `defineAgent` initializer using `ctx.env`.\n\n`process.env` is empty at module load on workerd. Debug with Node target when errors hide. Related: [[reference-cloudflare-acquires-astro]], [[project-anyrouter]].", "tech-hermes-custom-provider": "Hermes-style agents: declare `custom_providers` then select `provider: custom` (or named id). Keep keys in env vars, not notes.\n\nRelated: [[tech-ai-agent-stack]], [[tech-cloudflare-ai-gateway-transparent]].", "tech-hermes-dashboard-auth-gate": "Generic lesson: localhost/insecure allowlists must not outrank real auth on exposed binds.\n\nPrefer explicit bind address + auth plugin order tests. Related: [[feedback-public-kb-only]], [[tech-forwardauth-preserve-status]].", "tech-hermes-steer-mode": "Steer mode: in-flight agent incorporates new user messages into the current task.\n\nRelated: [[tech-hermes-custom-provider]], [[tech-ai-agent-stack]].", "tech-llm-gateway-byok-sibling": "If user keys ride a platform backend path, add an explicit `-byok` (or equivalent) route before disabling that backend.\n\nLearned on multi-provider routers like [[project-anyrouter]]. Related: [[tech-llm-gateway-quota-as-retryable]].", "tech-llm-gateway-quota-as-retryable": "Some upstreams return `budget_exceeded` as HTTP 400. Classify as retryable/failover, not terminal client error.\n\nAlso: zero-byte full timeouts are terminal per backend per request \u2014 don't burn identical retries. See [[project-anyrouter]].", "tech-oma-credentials-out-of-sandbox": "Invariant for managed agent runtimes: tool sandboxes must not see raw credentials; an outbound proxy injects them.\n\nProject: [[project-open-managed-agents]]. Related: [[feedback-public-kb-only]].", "tech-prompt-cache-byte-sensitive": "Prompt caching keys on exact prefix bytes. Unstable timestamps, random IDs, or reordered system text kill hit rates.\n\nRelated: [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "tech-rag-citation-guards": "Don't accept a citation because the URL exists. Require retrieved passage support for the claim.\n\nRelated: [[tech-rag-toc-pollution]], [[feedback-fail-loud]].", "tech-rag-metadata-key-drift": "If ingest writes `source_url` and query filters `url`, retrieval silently degrades.\n\nLock a schema; test filters. Related: [[tech-rag-toc-pollution]], [[tech-qdrant-config-at-create]].", "tech-rag-toc-pollution": "TOC/index pages often dominate vector search without answering the question.\n\nMitigate: exclude TOCs, chunk body-only, or metadata filters. Related: [[tech-rag-citation-guards]], [[tech-rag-metadata-key-drift]].", "tech-npx-scoped-package-bin": "`npx @scope/name` (and `npx --package @scope/name name`) looks up an executable named **`name`** \u2014 the unscoped last path segment. It does not automatically pick `anyr` just because that is the documented command.\n\nIf the package ships several bins (`anyr`, `anyrouter`, `ar`) and none is named `name`, some npx versions fail with `name: not found` (exit 127) or \"could not determine executable to run\". Newer npx may pick the first bin, so the bug can look machine-specific.\n\n**How to apply:** add a bin key that matches the last path segment, pointing at the same file as the documented command. Keep the documented aliases. Prove it with `npx --yes --package <tarball> <last-segment> --help`, not by reading `package.json` alone.", "tech-note-atomic": "Atomic = one concept per note, short body, dense wikilinks.\n\n**How to apply:** if >~25 lines or multiple independent claims, split. Index: MEMORY.md. See [[tech-note-frontmatter]], [[tech-okf-bundle]].", "tech-note-frontmatter": "Required: `name` (== filename), `description`, `type`, `tags`, `created`, `updated`, `timestamp` (ISO 8601).\n\nOptional: `title`, `category`, `aliases`, `related`, `sources`. No nested `metadata:`.\nLint: `kb lint`. Template: memory/_TEMPLATE.md. See [[tech-note-atomic]].", "tech-okf-bundle": "This repo follows an OKF-inspired layout: `memory/` concepts, generated `index.md`/`log.md`, required `timestamp`.\n\nTools: `kb gen` regenerates indexes + viz. Protocol: [[project-kb]], [[feedback-docs-kb-is-brain]].\nSpec pointer: https://github.com/GoogleCloudPlatform/knowledge-catalog", "tech-unit-suffix-vs-scale": "If a formatter shows `min`/`h`/`ms`, it must not convert magnitudes unless the multiplier is explicit.\n\nSmell: values that can never reach \"60 minutes\" if unit is wrong. Related: [[tech-flat-design-semantic-tokens]].", "tech-flat-design-hairline": "Flat/hairline look: borders over drop shadows; lucide (or Phosphor) icons; dark mode supported.\n\nRelated: [[tech-flat-design-semantic-tokens]], [[project-monorepo]], [[project-llm-timeline]].", "tech-flat-design-semantic-tokens": "Prefer semantic tokens (`bg-card`, `text-muted-foreground`) so themes/dark mode stay coherent.\n\nRelated: [[tech-flat-design-hairline]], [[tech-shadcn-base]], [[tech-unit-suffix-vs-scale]].", "tech-kumo-rsc-createcontext": "If a UI kit uses `createContext` at import time, every importer may need `\"use client\"` (RSC).\n\nPrefer kits that stay server-safe or isolate client entrypoints. Related: [[tech-shadcn-base]].", "tech-og-images-build-time": "One registry feeds both image generation (e.g. Satori) and route head links. Avoid dual sources of truth.\n\nRelated: [[tech-og-meta-in-prerender]], [[tech-tanstack-start-ssg]].", "tech-og-meta-in-prerender": "Put OG/Twitter meta into prerendered HTML. Client-only `useEffect` head injection is invisible to most crawlers.\n\nRelated: [[tech-og-images-build-time]], [[tech-tanstack-start-ssg]].", "tech-rust-wasm-when": "Prefer TypeScript for most UI/data shaping. Use Rust\u2192WASM when profiling shows >~1ms hot paths.\n\nCI trap: [[tech-wasm-prerender-ci]]. Language context: [[user-duyet-lang-rust]].", "tech-shadcn-base": "Default component kit for public apps: shadcn/ui with CVA variants. Pair with [[tech-flat-design-semantic-tokens]].\n\nUsed in [[project-anyrouter]], [[project-monorepo]]. RSC pitfall: [[tech-kumo-rsc-createcontext]].", "tech-tanstack-stale-chunks": "After deploy, old tabs may request deleted lazy chunks \u2192 runtime error on `component`.\n\nMitigations: soft reload on chunk load failure; keep critical shells prerendered. See [[tech-tanstack-start-ssg]], [[project-anyrouter]].", "tech-tanstack-start-ssg": "Prerender routes to static HTML so crawlers and edge hosts see real content without relying on client JS alone.\n\nPairs with [[tech-og-meta-in-prerender]], [[tech-tanstack-stale-chunks]], [[tech-cloudflare-pages-deploy]].\nUsed by [[project-monorepo]], [[project-llm-timeline]].", "tech-wasm-prerender-ci": "SSG pipelines that import WASM must build release WASM in CI before prerender. Silent empty pages are worse than hard fail.\n\nRelated: [[tech-rust-wasm-when]], [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]].", "tech-agent-loop-cheap-subagents": "Mechanical PR fixes and checklist reviews \u2192 cheaper models. Hard architecture stays on the main/high tier.\n\nPolicy: [[feedback-cheap-models-subagents]]. Cycle: [[tech-agent-loop-cycle]].", "tech-agent-loop-cycle": "Pattern: recurring cycle scans open PRs/issues, classifies, dispatches workers, merges when safe.\n\nCost control: [[tech-agent-loop-cheap-subagents]]. Related: [[project-duyetbot]], [[feedback-never-auto-merge-release-please]].", "tech-codebase-maintenance-loop": "Priority order often: build > tests > lint > deploy > quality > features.\n\nSafe dead-code removal only with proof. Related: [[tech-improvement-loop]], [[feedback-logic-change-update-tests]], [[project-duyetbot]].", "tech-improvement-loop": "Loop: pick highest priority \u2192 implement \u2192 lint/test/build \u2192 commit \u2192 deploy \u2192 log.\n\nPersona: [[project-duyetbot]]. Deploy: [[tech-cloudflare-pages-deploy]]. Cheap fan-out: [[feedback-cheap-models-subagents]].", "tech-one-codebase-oss-saas": "Pattern: single high-level deployment mode (`oss|cloud`) that resolves auth/storage defaults. Unset/junk \u2192 OSS so open source never degrades.\n\nNever gate core product features behind cloud-only. Example product: [[project-clickhouse-monitoring]]. Env: [[tech-single-source-env]].", "tech-single-source-env": "Dual sources (hand-maintained wrangler vars vs Vite `VITE_*`) drift silently. Canonical names \u2192 derive client + deploy targets.\n\nSecrets never in committed env files. Related: [[tech-one-codebase-oss-saas]], [[feedback-public-kb-only]].", "tech-tmux-pane-labels": "Use tmux `pane-current-command` \u2192 icon mapping so multi-agent sessions are glanceable.\n\nGeneric DX only \u2014 no hostnames. Related: [[user-duyet-local-dev]], [[user-duyet-ai-claude-code]].", "user-duyet-active-projects": "Duyet builds **many products in parallel** (not single-app focus).\n\n| Area | Projects |\n|------|----------|\n| ClickHouse | [[project-clickhouse-monitoring]] |\n| LLM / agents | [[project-anyrouter]] \u00b7 [[project-agentstate]] \u00b7 [[project-anyworker]] \u00b7 [[project-open-managed-agents]] \u00b7 [[project-duyetbot]] |\n| Personal / platform | [[project-monorepo]] \u00b7 [[project-kb]] \u00b7 [[project-llm-timeline]] \u00b7 [[user-duyet-homelab]] \u00b7 [[project-charts]] |\n\nAlso: [[user-duyet-multi-project]], [[feedback-disambiguate-repo]], [[reference-duyet-github]], [[user-duyet-ai-stance]].", "user-duyet-ai-claude-code": "Claude Code is the daily driver after trying many tools. Tools remain disposable \u2014 [[user-duyet-ai-tools-disposable]]. Index: [[user-duyet-ai-stance]].", "user-duyet-ai-stance": "AI practice index:\n\n- [[user-duyet-ai-vibe-codes]] \u2014 agents drive production work\n- [[user-duyet-ai-claude-code]] \u2014 Claude Code as daily driver\n- [[user-duyet-ai-tools-disposable]] \u2014 tools change; don't lock dogma\n- [[tech-ai-agent-stack]] \u2014 SDK ecosystem\n- [[project-duyetbot]] \u2014 autonomous monorepo agent persona\n\nRelated: [[user-duyet-focus-llm-agents]], [[feedback-docs-driven-development]].", "user-duyet-ai-tools-disposable": "Do not enshrine one IDE/agent forever. Prefer portable patterns: [[feedback-docs-driven-development]], [[tech-ai-agent-stack]].", "user-duyet-ai-vibe-codes": "Public practice: vibe-codes for production; agents write more than hand-typed code. See [[user-duyet-ai-stance]], [[feedback-docs-driven-development]].", "user-duyet-data-clickhouse": "Primary analytics engine in public writing and tooling. Products: [[project-clickhouse-monitoring]]. Blog: [[reference-duyet-blog]].", "user-duyet-data-spark-airflow": "Public DE stack also includes Apache Spark and Apache Airflow (blog series). See [[user-duyet-focus-data-engineering]], [[reference-duyet-blog]].", "user-duyet-focus-clickhouse": "ClickHouse is a primary public specialty (blog volume + tooling). Flagship: [[project-clickhouse-monitoring]] / [[project-chmonitor-advisor]]. See [[reference-duyet-blog]], [[user-duyet-stack]], [[user-duyet-active-projects]].", "user-duyet-focus-data-engineering": "Public focus: large-scale data platforms, real-time analytics, Kafka/Spark/Airflow ecosystems.\n\nRelated: [[user-duyet-focus-clickhouse]], [[user-duyet-stack]], [[reference-duyet-blog]].", "user-duyet-focus-llm-agents": "Recurring public themes: coding agents, agent SDKs, RAG, self-improving loops, agent memory.\n\nProducts: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]]. Stance: [[user-duyet-ai-stance]]. Stack: [[tech-ai-agent-stack]]. Pattern: [[feedback-docs-driven-development]].", "user-duyet-github": "https://github.com/duyet \u2014 public repos. Catalog: [[reference-duyet-github]]. Notable: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-clickhouse-monitoring]], [[project-monorepo]], [[project-open-managed-agents]], [[project-kb]], [[project-homelab]].", "user-duyet-handle": "Public handle: **`@duyet`**. GitHub: https://github.com/duyet. Profile hub: [[user-duyet-profile]].", "user-duyet-homelab": "Duyet runs a **personal homelab** for self-host experiments and ops practice.\n\nPublic surface: [[project-homelab]] \u00b7 [[project-charts]] \u00b7 [[user-duyet-site-homelab]].\nStack overlap: [[user-duyet-infra-kubernetes]], [[user-duyet-data-clickhouse]].\n\n**Never store** hosts, IPs, VPN endpoints, or topology here ([[feedback-public-kb-only]]).", "user-duyet-infra-cloudflare": "Cloudflare Workers/Pages host many public apps. Patterns: [[tech-cloudflare-pages-deploy]], [[tech-workers-cache-enabled]], [[project-anyrouter]].", "user-duyet-infra-kubernetes": "Kubernetes appears in public blog series, Helm work, and personal lab practice. See [[project-charts]], [[project-homelab]], [[user-duyet-homelab]], [[user-duyet-stack]].", "user-duyet-lang-python": "Python is a core language for data engineering and agent tooling. See [[user-duyet-stack]], [[user-duyet-focus-data-engineering]].", "user-duyet-lang-rust": "Rust is a primary language on public GitHub (UDFs, data tools, WASM). See [[user-duyet-stack]], [[tech-rust-wasm-when]], [[reference-duyet-github]].", "user-duyet-lang-sql": "SQL is daily for analytics and ClickHouse. See [[user-duyet-focus-clickhouse]], [[user-duyet-data-clickhouse]].", "user-duyet-lang-typescript": "TypeScript/JS for public web apps and Cloudflare Workers. See [[user-duyet-stack]], [[project-monorepo]], [[project-anyrouter]].", "user-duyet-local-dev": "Local tools (public): macOS, Homebrew, `bun`, `uv`, neovim, Obsidian, tmux ([[tech-tmux-pane-labels]]). Prefers [[feedback-semantic-commits]] and [[feedback-concise-english]].", "user-duyet-multi-project": "Default assumption: Duyet is building **several products at once** (gateway, agent infra, ClickHouse tooling, personal sites, homelab).\n\n**How to apply:** disambiguate which repo/product a task is for; don't collapse everything into monorepo. Index: [[user-duyet-active-projects]]. Scope: [[feedback-public-kb-only]].", "user-duyet-profile": "**Duyet Le** (handle `@duyet`) \u2014 senior data engineer and open-source contributor.\n\nHandle: [[user-duyet-handle]]. Active portfolio: [[user-duyet-active-projects]]. Homelab: [[user-duyet-homelab]]. Focus areas: [[user-duyet-focus-data-engineering]], [[user-duyet-focus-clickhouse]], [[user-duyet-focus-llm-agents]].\nStack: [[user-duyet-stack]]. Presence: [[user-duyet-web-presence]]. Style: [[feedback-working-style]].", "user-duyet-site-blog": "https://blog.duyet.net \u2014 digital garden. Themes: [[reference-duyet-blog]]. Feed: https://blog.duyet.net/feed. Index: [[user-duyet-web-presence]].", "user-duyet-site-homelab": "https://homelab.duyet.net \u2014 public overview page for the personal lab.\n\nRelated: [[user-duyet-homelab]], [[user-duyet-web-presence]], [[project-homelab]].", "user-duyet-site-kb": "https://kb.duyet.net renders [[project-kb]]. Implements [[feedback-docs-driven-development]].", "user-duyet-stack": "Stack index (public blog/GitHub). Drill into atoms:\n\n- Languages: [[user-duyet-lang-rust]], [[user-duyet-lang-python]], [[user-duyet-lang-typescript]], [[user-duyet-lang-sql]]\n- Data: [[user-duyet-data-clickhouse]], [[user-duyet-data-spark-airflow]]\n- Infra: [[user-duyet-infra-kubernetes]], [[user-duyet-infra-cloudflare]]\n- AI: [[user-duyet-ai-stance]], [[tech-ai-agent-stack]]\n- Local: [[user-duyet-local-dev]]\n- Homelab: [[user-duyet-homelab]]\n- Products: [[user-duyet-active-projects]]", "user-duyet-web-presence": "Public sites (prefer `/llms.txt` when present):\n\n| Site | URL |\n|------|-----|\n| Profile / blog / CV | https://duyet.net \u00b7 https://blog.duyet.net \u00b7 https://cv.duyet.net (+ `/llms.txt`) |\n| GitHub / X | https://github.com/duyet \u00b7 https://x.com/_duyet |\n| Products | https://llm-timeline.duyet.net \u00b7 https://agents.duyet.net \u00b7 https://kb.duyet.net \u00b7 https://homelab.duyet.net |\n\nAtoms: [[user-duyet-site-blog]], [[user-duyet-github]], [[user-duyet-site-kb]], [[user-duyet-site-homelab]]. Portfolio: [[user-duyet-active-projects]]. Profile: [[user-duyet-profile]]."}, "types": ["feedback", "project", "tech", "reference", "user"], "palette": {"feedback": "#ec4899", "project": "#3b82f6", "tech": "#f59e0b", "reference": "#10b981", "user": "#8b5cf6"}};
(function(){
  const b=window.BUNDLE, byId={}; b.nodes.forEach(n=>byId[n.data.id]=n.data);
  const back={}; b.edges.forEach(e=>{(back[e.data.target]=back[e.data.target]||[]).push(e.data.source)});
  const leg=document.getElementById("legend");
  b.types.forEach(t=>{const s=document.createElement("span");s.innerHTML='<i style="background:'+b.palette[t]+'"></i>'+t;leg.appendChild(s)});
  const cy=cytoscape({container:document.getElementById("graph"),elements:[...b.nodes,...b.edges],style:[
    {selector:"node",style:{"label":"data(label)","background-color":"data(color)","width":"data(size)","height":"data(size)","color":"#334155","font-size":10,"text-valign":"bottom","text-margin-y":4,"text-wrap":"wrap","text-max-width":80}},
    {selector:"node:selected",style:{"border-width":3,"border-color":"#0f172a"}},
    {selector:"edge",style:{"width":1,"line-color":"#cbd5e1","curve-style":"bezier","opacity":.55}}
  ],layout:{name:"cose",animate:false,idealEdgeLength:90,nodeRepulsion:9000,padding:20}});
  function select(id){
    cy.nodes().unselect(); const el=cy.getElementById(id); if(el&&el.length)el.select();
    const n=byId[id]; if(!n) return;
    const bodyMd=b.bodies[id]||"";
    const tags=(n.tags||[]).map(t=>'<span>'+t+'</span>').join("");
    const bl=(back[id]||[]).map(s=>'<li><a data-id="'+s+'">'+((byId[s]||{}).label||s)+'</a></li>').join("");
    document.getElementById("detail").innerHTML=
      '<h1>'+n.label+'</h1>'+
      '<span class="badge" style="background:'+(b.palette[n.type]||'#64748b')+'">'+n.type+'</span>'+
      (n.resource?' <a class="muted" href="'+n.resource+'" target="_blank" rel="noopener">source ↗</a>':'')+
      '<p class="desc">'+(n.description||'')+'</p>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<div class="body">'+marked.parse(bodyMd)+'</div>'+
      (bl?'<div id="backlinks"><h2>Linked from</h2><ul>'+bl+'</ul></div>':'');
    document.querySelectorAll('#backlinks a').forEach(a=>a.onclick=()=>select(a.dataset.id));
  }
  cy.on("tap","node",e=>select(e.target.id()));
  if(b.nodes.length) select(b.nodes[0].data.id);
})();
</script>
