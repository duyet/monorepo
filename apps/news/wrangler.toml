name = "duyet-news"
main = "src/server.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
# Enable versioned preview URLs (<version>-duyet-news.<subdomain>.workers.dev)
# so `wrangler versions upload` yields a shareable preview before prod deploy.
preview_urls = true

[assets]
directory = "dist/client"
# `/` must hit the Worker so the homepage SSR's stories (the static
# index.html shell has no feed). Sitemap/robots are Worker-generated.
run_worker_first = ["/", "/sitemap.xml", "/robots.txt", "/api/*"]
not_found_handling = "single-page-application"

# Hourly ingest is GitHub Actions (`.github/workflows/news-ingest.yml`),
# not Worker `[triggers] crons` (Free 5-cron cap breaks deploy) and not
# Workflow `schedules` (paid Workers plan — wrangler deploy exits 1).
# Manual: Actions workflow_dispatch, admin POST /api/admin/ingest, or
# `wrangler workflows trigger news-ingest`.

[[workflows]]
name = "news-ingest"
binding = "NEWS_INGEST"
class_name = "NewsIngestWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "news"
database_id = "8e692ccf-ec38-4e41-b011-50adbc891322"

[vars]
ANYROUTER_BASE_URL = "https://anyrouter.dev/api/v1"
# Live AnyRouter ids with native (non-BYOK) providers only. #1322 led
# with aisingapore/gemma-sea-lion-v4-27b-it + gemini-3.7/3.6 + qwen3.7
# — all BYOK-only — so a hang/401 on the first id ate the 300s budget
# and never reached a model that can write title_vi. Free instruct
# models first; paid native Gemini after; no BYOK-only ids.
ANYROUTER_MODEL = "google/gemini-2.5-flash-lite,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash,google/gemini-2.5-flash,google/gemini-3.5-flash"
ANYROUTER_TRANSLATE_MODEL = "google/gemini-2.5-flash-lite,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash,google/gemma-4-31b,google/gemini-2.5-flash,google/gemini-3.5-flash"
# Bilingual TL;DR used to fall through to ANYROUTER_MODEL (reasoning-first)
# and time out both attempts, leaving English bullets on the VI homepage.
ANYROUTER_TLDR_MODEL = "google/gemini-2.5-flash-lite,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash,google/gemini-2.5-flash,google/gemini-3.5-flash"
# Derived from VITE_CLERK_PUBLISHABLE_KEY's base64 domain suffix (see
# apps/news/.env.production): pk_live_Y2xlcmsuZHV5ZXQubmV0JA -> clerk.duyet.net
CLERK_ISSUER = "https://clerk.duyet.net"
# @duyetbot posts top stories to this channel; TELEGRAM_BOT_TOKEN is a secret.
TELEGRAM_CHAT_ID = "-1004420104760"

[[send_email]]
name = "EMAIL"

# Workers Cache: safe for this surface — only responses with public
# Cache-Control headers (feed/story/system APIs, static shell) are cached;
# admin/subscribe/suggest/submit/mcp set no-store and Authorization-bearing
# requests auto-bypass.
[cache]
enabled = true

[observability]
enabled = true

[[routes]]
pattern = "news.duyet.net"
custom_domain = true
