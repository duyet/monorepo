name = "duyet-news"
main = "src/server.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
# Enable versioned preview URLs (<version>-duyet-news.<subdomain>.workers.dev)
# so `wrangler versions upload` yields a shareable preview before prod deploy.
preview_urls = true

[assets]
directory = "dist/client"
# `/` must hit the Worker so the homepage SSR's stories (the static
# index.html shell has no feed). Sitemap/robots are Worker-generated.
run_worker_first = ["/", "/sitemap.xml", "/robots.txt", "/api/*"]
not_found_handling = "single-page-application"

# Hourly ingest is a Durable Object alarm (`NewsIngestScheduler`) plus
# GitHub Actions (`.github/workflows/news-ingest.yml`) as a watchdog.
# Do not add Worker `[triggers] crons` (Free 5-cron cap breaks deploy)
# and do not add Workflow `schedules` (paid Workers plan — wrangler
# deploy exits 1). Manual: Actions workflow_dispatch, admin
# POST /api/admin/ingest, or `wrangler workflows trigger news-ingest`.

[[workflows]]
name = "news-ingest"
binding = "NEWS_INGEST"
class_name = "NewsIngestWorkflow"

# Not a cron trigger. Hourly `alarm()` starts NewsIngestWorkflow without
# counting against the account's 5 Worker cron slots.
[durable_objects]
bindings = [
  { name = "NEWS_INGEST_SCHEDULER", class_name = "NewsIngestScheduler" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NewsIngestScheduler"]

[[d1_databases]]
binding = "DB"
database_name = "news"
database_id = "8e692ccf-ec38-4e41-b011-50adbc891322"

[vars]
ANYROUTER_BASE_URL = "https://anyrouter.dev/api/v1"
# Live model chains: score/TL;DR lead with anyrouter/auto (AnyRouter's
# health-aware router over top stable platform models) and fall back to
# cheap native ids (non-BYOK). Translate still leads with Gemma 4
# (completes a 3-item JSON batch fast) and keeps anyrouter/auto mid-chain.
# stealth/ox-alpha was delisted (404s) — do not restore it. No BYOK-only
# ids (SEA-LION, gemini-3.6/3.7, qwen3.7) — a hang/401 on the first id
# used to eat the whole budget before reaching a model that can write
# title_vi.
ANYROUTER_MODEL = "anyrouter/auto,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash"
ANYROUTER_TRANSLATE_MODEL = "google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash,anyrouter/auto,google/gemma-4-31b"
# Bilingual TL;DR used to fall through to a reasoning-first chain and time
# out both attempts, leaving English bullets on the VI homepage.
ANYROUTER_TLDR_MODEL = "anyrouter/auto,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash"
# Derived from VITE_CLERK_PUBLISHABLE_KEY's base64 domain suffix (see
# apps/news/.env.production): pk_live_Y2xlcmsuZHV5ZXQubmV0JA -> clerk.duyet.net
CLERK_ISSUER = "https://clerk.duyet.net"
# @duyetbot posts top stories to this channel; TELEGRAM_BOT_TOKEN is a secret.
TELEGRAM_CHAT_ID = "-1004420104760"

[[send_email]]
name = "EMAIL"

# Workers Cache: safe for this surface — only responses with public
# Cache-Control headers (feed/story/system APIs, static shell) are cached;
# admin/subscribe/suggest/submit/mcp set no-store and Authorization-bearing
# requests auto-bypass. Public GET /api/public is Cache-Control: public.
[cache]
enabled = true

[observability]
enabled = true

[[routes]]
pattern = "news.duyet.net"
custom_domain = true
