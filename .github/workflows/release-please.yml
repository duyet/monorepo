name: Release Please

# release-please watches conventional commits landing on main and maintains
# standing release PRs (humans merge them; this workflow never auto-merges):
#   - monorepo (root): "chore(main): release monorepo X.Y.Z" → CHANGELOG.md, tag vX.Y.Z
#   - crates/duyet CLI: "chore(main): release duyet X.Y.Z" → crates/duyet/CHANGELOG.md, tag duyet-vX.Y.Z
# CLI commits under crates/duyet are exclude-paths on the root package.
# Each package needs a distinct `component` (see release-please-config.json):
# the root package.json name is "duyet", which is also the CLI component, so
# without an explicit root component both releases share the branch
# release-please--branches--main--components--duyet and race each other — the
# second ref update fails and the root changelog/version bump is silently lost.
# Config + manifest live under .github/ to keep the repo root clean. Pre-1.0 bump
# rules (see release-please-config.json): a plain feat bumps the PATCH; only a
# breaking change (feat! / BREAKING CHANGE) cuts a new minor. bootstrap-sha pins
# the changelog baseline so the first duyet release only spans commits after setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
