name: News Ingest

# Watchdog for the news.duyet.net ingest workflow. Primary hourly cadence
# is a Durable Object alarm on duyet-news (not a Worker cron — Free plan
# is at the 5-trigger cap). GitHub scheduled workflows on this repo skip
# for hours at a time (2026-08-27: 3/24 hourly runs; same pattern on the
# kb-submodule-sync hourly job), so this file fires four independent cron
# expressions per hour. POSTs coalesce in NewsIngestScheduler if a run
# started in the last 45 minutes.
on:
  schedule:
    - cron: "5 * * * *"
    - cron: "20 * * * *"
    - cron: "35 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger news-ingest workflow
        run: |
          url="https://news.duyet.net/api/admin/ingest"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            url="${url}?force=1"
          fi
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
            "$url" \
            -H "Authorization: Bearer ${{ secrets.NEWS_ADMIN_TOKEN }}")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            cat /tmp/resp.json
          else
            echo "ingest failed (HTTP $code); body suppressed"
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Trigger failed with HTTP $code" >&2
            exit 1
          fi
