name: Data Sync (LLM Timeline)

on:
  schedule:
    # Daily at 6am UTC to keep model data fresh
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (preview without writing)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Sync LLM model data from Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/sync-data.ts reaches llm-timeline/lib/{normalizers,csv}.ts, which
      # import the wasm-pack bundle from @duyet/wasm/pkg and shell out to the
      # duyet-cli release binary. Both are gitignored, so neither exists after a
      # fresh checkout and every sync died on ERR_MODULE_NOT_FOUND. Same shape
      # and action pins as checks.yml; kept in step because the sync script runs
      # directly through tsx, not through turbo, so no cache split is needed.
      - name: Setup Rust toolchain (wasm32 + native)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-checks-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-checks-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0

      - name: Build WASM packages
        run: pnpm run wasm:build

      - name: Build duyet-cli
        run: pnpm run rust:build

      - name: Sync data (dry run)
        if: ${{ inputs.dry_run == true }}
        working-directory: apps/llm-timeline
        run: pnpm exec tsx scripts/sync-data.ts --dry-run --verbose

      - name: Sync data
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/llm-timeline
        run: pnpm exec tsx scripts/sync-data.ts

      - name: Commit and push data sync
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.DUYETBOT_GITHUB_TOKEN != '' && secrets.DUYETBOT_GITHUB_TOKEN || github.token }}
        run: |
          git add apps/llm-timeline/lib/data.ts

          if git diff --cached --quiet; then
            echo "No LLM timeline data changes detected."
            exit 0
          fi

          git config user.name "duyetbot"
          git config user.email "duyetbot@users.noreply.github.com"
          git commit -m "chore(llm-timeline): sync model data from Google Sheets + Epoch AI" \
            -m "Co-Authored-By: duyet <me@duyet.net>" \
            -m "Co-Authored-By: duyetbot <duyetbot@users.noreply.github.com>"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
