name: Deploy Preview to Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - '.github/workflows/cf-deploy-preview.yml'
      - 'scripts/cf-pages-apps.ts'
      - 'scripts/cf-deploy-matrix.ts'

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Set deployment matrix
        id: set-matrix
        run: |
          node --experimental-strip-types scripts/cf-deploy-matrix.ts \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec turbo check-types

  unittest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test
        env:
          NODE_ENV: test
          CI: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  deploy-preview:
    name: Deploy ${{ matrix.app }}
    needs: [detect-changes, typecheck, unittest, lint]
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER') }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          # apps/kb/kb content submodule must be present for the kb build
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @duyet/libs' markdownToHtml imports the WASM markdown converter, and
      # any app pulling in @duyet/libs fails to build without it — not just
      # blog. Build it for every app in the matrix.
      - name: Setup Rust toolchain (WASM markdown)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0

      - name: Build WASM packages (markdown converter)
        run: pnpm run wasm:build:release

      - name: Build app
        id: build
        run: |
          cd apps/${{ matrix.app }}
          pnpm run build
        env:
          NODE_ENV: production
          VITE_DUYET_HOME_URL: https://duyet.net
          VITE_DUYET_BLOG_URL: https://blog.duyet.net
          VITE_DUYET_CV_URL: https://cv.duyet.net
          VITE_DUYET_INSIGHTS_URL: https://insights.duyet.net
          VITE_DUYET_PHOTOS_URL: https://photos.duyet.net
          VITE_DUYET_HOMELAB_URL: https://homelab.duyet.net
          VITE_DUYET_LLM_TIMELINE_URL: https://llm-timeline.duyet.net
          VITE_DUYET_AGENTS_URL: https://agents.duyet.net
          VITE_DUYET_AGENTS_API_URL: /
          VITE_DUYET_AI_URL: https://ai.duyet.net
          VITE_DUYET_AI_PERCENTAGE_URL: https://ai-percentage.duyet.net
          # Clerk Authentication (blog app)
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Burns only: staging MOTHERDUCK_TOKEN refreshes data. If empty,
          # fetch-burns-data.ts keeps committed public/token-data.json.
          MOTHERDUCK_TOKEN: ${{ matrix.app == 'burns' && secrets.MOTHERDUCK_TOKEN || '' }}

      - name: Save build failure status
        if: failure() && steps.build.outcome == 'failure'
        run: |
          mkdir -p /tmp/deployments
          echo "build_failed" > /tmp/deployments/${{ matrix.app }}.txt

      - name: Deploy to Cloudflare Pages (Preview)
        id: deploy
        if: success()
        run: |
          cd apps/${{ matrix.app }}

          OUTPUT_DIR=$(grep 'pages_build_output_dir' wrangler.toml 2>/dev/null | sed 's/.*=[[:space:]]*"\([^"]*\)".*/\1/' || true)
          if [ -z "$OUTPUT_DIR" ]; then
            if [ -d "dist/client" ]; then
              OUTPUT_DIR="dist/client"
            else
              OUTPUT_DIR="dist"
            fi
          fi

          # Skip deploy if no static output directory exists
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "No '$OUTPUT_DIR' directory found — Vite build may have failed."
            echo "Skipping Cloudflare Pages deploy for ${{ matrix.app }}."
            echo "url=skipped" >> $GITHUB_OUTPUT
            echo "branch=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get branch name, sanitize for CF Pages (replace / with -)
          BRANCH="${{ github.head_ref }}"
          BRANCH_SLUG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)

          # Deploy to preview branch
          OUTPUT=$(pnpm dlx wrangler@4.20.0 pages deploy "$OUTPUT_DIR" \
            --project-name=${{ matrix.project }} \
            --branch="$BRANCH_SLUG" \
            --commit-dirty=true 2>&1)

          echo "$OUTPUT"

          # Extract the deployment URL
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9-]+\.'"${{ matrix.project }}"'\.pages\.dev' | head -1)

          if [ -z "$URL" ]; then
            URL="https://${BRANCH_SLUG}.${{ matrix.project }}.pages.dev"
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_SLUG" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save deployment info
        if: success() && steps.deploy.outputs.url != ''
        run: |
          mkdir -p /tmp/deployments
          echo "${{ steps.deploy.outputs.url }}" > /tmp/deployments/${{ matrix.app }}.txt

      - name: Upload deployment artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-${{ matrix.app }}
          path: /tmp/deployments/${{ matrix.app }}.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Health check
        if: success() && steps.deploy.outputs.url != '' && steps.deploy.outputs.url != 'skipped'
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          echo "Checking $DEPLOY_URL..."
          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -s -f -o /dev/null "$DEPLOY_URL"; then
              echo "✅ Health check passed for $DEPLOY_URL"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts failed, waiting 10s..."
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "⚠️ Health check timed out for $DEPLOY_URL (may still be deploying)"

  comment-pr:
    name: Comment deployment URLs
    needs: [detect-changes, deploy-preview]
    if: always() && needs.detect-changes.outputs.matrix != '{"include":[]}' && needs.deploy-preview.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download all deployment artifacts
        uses: actions/download-artifact@v8
        with:
          path: deployments
          pattern: deployment-*
          merge-multiple: true

      - name: Build comment body
        id: comment
        run: |
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OVERALL="${{ needs.deploy-preview.result }}"

          COMMENT="## 🚀 Preview Deployments\n\n"

          if [[ "$OVERALL" == "failure" ]]; then
            COMMENT+="⚠️ One or more deployments failed. [View build logs]($ACTIONS_URL)\n\n"
          fi

          COMMENT+="| App | Status | Preview URL |\n"
          COMMENT+="|-----|--------|-------------|\n"

          # Parse matrix to know which apps were in scope
          MATRIX='${{ needs.detect-changes.outputs.matrix }}'
          APPS=$(echo "$MATRIX" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for item in data.get('include', []):
              print(item['app'])
          ")

          for APP in $APPS; do
            FILE="deployments/${APP}.txt"
            if [ -f "$FILE" ]; then
              CONTENT=$(cat "$FILE")
              if [[ "$CONTENT" == "build_failed" ]]; then
                COMMENT+="| **$APP** | ❌ Build failed | [View logs]($ACTIONS_URL) |\n"
              elif [[ "$CONTENT" == "skipped" ]]; then
                COMMENT+="| **$APP** | ⏭ Skipped (SSR) | — |\n"
              elif [[ "$CONTENT" == http* ]]; then
                COMMENT+="| **$APP** | ✅ Deployed | [$CONTENT]($CONTENT) |\n"
              else
                COMMENT+="| **$APP** | ⚠️ Unknown | [View logs]($ACTIONS_URL) |\n"
              fi
            else
              COMMENT+="| **$APP** | ❌ Build failed | [View logs]($ACTIONS_URL) |\n"
            fi
          done

          COMMENT+="\n---\n"
          COMMENT+="_Commit: \`${{ github.event.pull_request.head.sha }}\` · [GitHub Actions]($ACTIONS_URL)_"

          echo -e "$COMMENT" > comment.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: Preview Deployments

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md
          edit-mode: replace
