<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI News</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="brand" href="https://news.duyet.net" rel="noreferrer">
          <span class="mark" aria-hidden="true"></span>
          AI News
        </a>
        <p class="lede" id="lede">Hôm nay AI có gì mới?</p>
        <time class="date" id="date"></time>
      </header>

      <section class="tldr" aria-labelledby="tldr-heading">
        <div class="tldr-head">
          <h1 id="tldr-heading">AI;DR</h1>
          <span class="muted" id="tldr-meta"></span>
        </div>
        <ul class="bullets" id="bullets">
          <li class="skeleton"></li>
          <li class="skeleton"></li>
          <li class="skeleton"></li>
          <li class="skeleton"></li>
        </ul>
      </section>

      <section class="stories" aria-labelledby="stories-heading">
        <h2 id="stories-heading">Top stories</h2>
        <div class="cards" id="cards"></div>
      </section>

      <footer class="foot">
        <a href="https://news.duyet.net" rel="noreferrer">news.duyet.net</a>
        <span class="muted" id="status"></span>
      </footer>
    </div>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
