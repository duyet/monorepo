#detail .body pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:6px;overflow:auto}
#detail .body code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:13px}
#detail .body pre code{background:none;padding:0}
#detail .body table{border-collapse:collapse;margin:8px 0}

#detail .body a{color:#2563eb}
#detail h2{font-size:13px;margin-top:18px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
#backlinks ul{padding-left:18px;margin:4px 0}
#backlinks a{color:#2563eb;cursor:pointer}
.hint{position:absolute;bottom:10px;left:12px;color:#94a3b8;font-size:12px}
</style>
</head>

"source": "user-duyet-site-kb", "target": "feedback-docs-driven-development"}}, {"data": {"id": "user-duyet-site-kb__project-kb", "source": "user-duyet-site-kb", "target": "project-kb"}}, {"data": {"id": "user-duyet-stack__tech-ai-agent-stack", "source": "user-duyet-stack", "target": "tech-ai-agent-stack"}}, {"data": {"id": "user-duyet-stack__user-duyet-active-projects", "source": "user-duyet-stack", "target": "user-duyet-active-projects"}}, {"data": {"id": "user-duyet-stack__user-duyet-ai-stance", "source": "user-duyet-stack", "target": "user-duyet-ai-stance"}}, {"data": {"id": "user-duyet-stack__user-duyet-data-clickhouse", "source": "user-duyet-stack", "target": "user-duyet-data-clickhouse"}}, {"data": {"id": "user-duyet-stack__user-duyet-data-spark-airflow", "source": "user-duyet-stack", "target": "user-duyet-data-spark-airflow"}}, {"data": {"id": "user-duyet-stack__user-duyet-homelab", "source": "user-duyet-stack", "target": "user-duyet-homelab"}}, {"data": {"id": "user-duyet-stack__user-duyet-infra-cloudflare", "source": "user-duyet-stack", "target": "user-duyet-infra-cloudflare"}}, {"data": {"id": "user-duyet-stack__user-duyet-infra-kubernetes", "source": "user-duyet-stack", "target": "user-duyet-infra-kubernetes"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-python", "source": "user-duyet-stack", "target": "user-duyet-lang-python"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-rust", "source": "user-duyet-stack", "target": "user-duyet-lang-rust"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-sql", "source": "user-duyet-stack", "target": "user-duyet-lang-sql"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-typescript", "source": "user-duyet-stack", "target": "user-duyet-lang-typescript"}}, {"data": {"id": "user-duyet-stack__user-duyet-local-dev", "source": "user-duyet-stack", "target": "user-duyet-local-dev"}}, {"data": {"id": "user-duyet-stack__user-duyet-profile", "source": "user-duyet-stack", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-active-projects", "source": "user-duyet-web-presence", "target": "user-duyet-active-projects"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-github", "source": "user-duyet-web-presence", "target": "user-duyet-github"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-profile", "source": "user-duyet-web-presence", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-blog", "source": "user-duyet-web-presence", "target": "user-duyet-site-blog"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-homelab", "source": "user-duyet-web-presence", "target": "user-duyet-site-homelab"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-kb", "source": "user-duyet-web-presence", "target": "user-duyet-site-kb"}}], "bodies": {"feedback-cheap-models-subagents": "Default sub-agents to mid/cheap tiers for mechanical work; reserve expensive models for hard reasoning.\n\n**Why:** parallel fan-out multiplies cost.\n**How to apply:** pass explicit cheaper model on dispatch. Related: [[tech-agent-loop-cheap-subagents]], [[feedback-working-style]].", "feedback-commit-push-deploy": "When the work is done (tests pass, change is meant to go live), **commit, push, and deploy** in the same turn. The user says this as `cp and deploy`. Do not stop after the edit, and do not ask whether to ship.\n\n**Why:** Deploy is the default end of the loop, not a follow-up question.\n\n**How to apply:** conventional commit ([[feedback-semantic-commits]]), push, and land it on `main` so CI deploys. For this monorepo that is a PR merged to `main`, then the Cloudflare Pages workflow (`cf-deploy.yml`). Confirm the deploy run, or run `pnpm run cf:deploy -- <app> --prod` when CI will not pick it up. Ask only if the user forbade git, or the change is clearly a local experiment.", "feedback-concise-english": "Use simple, short English. No filler (\"comprehensive\", \"elaborate\").\n\n**Why:** faster review, clearer agent output.\n**How to apply:** trim adverbs; prefer lists; match [[feedback-semantic-commits]].", "feedback-disambiguate-repo": "Duyet multi-homes work: chmonitor, AnyRouter, AgentState, AnyWorker, OMA, monorepo, kb, homelab.\n\n**How to apply:** if the chat is ambiguous, ask or infer from cwd/path; never assume monorepo. Index: [[user-duyet-active-projects]], [[user-duyet-multi-project]].", "feedback-docs-driven-development": "Pattern:\n\n1. [[feedback-docs-router-tiny]] \u2014 keep CLAUDE.md/AGENTS.md short\n2. [[feedback-docs-kb-is-brain]] \u2014 structured notes are the memory\n3. [[feedback-docs-read-on-entry]] \u2014 index first\n4. [[feedback-docs-write-on-exit]] \u2014 capture before context dies\n\nImplemented by [[project-kb]]. Owner stance: [[user-duyet-ai-stance]].", "feedback-docs-kb-is-brain": "A public/shared kb persists across tools and sessions. This repo is that brain: [[project-kb]].\n\n**How to apply:** atomic notes + `MEMORY.md` index + [[tech-okf-bundle]].", "feedback-docs-read-on-entry": "Trigger: session start / new task \u2192 open MEMORY.md, then only matching notes.\n\n**How to apply:** never bulk-load entire memory/. See [[feedback-docs-write-on-exit]].", "feedback-docs-router-tiny": "Router files rot if they hold feature contracts. Point to notes instead.\n\n**How to apply:** put durable facts in [[project-kb]] notes; keep routers as indexes. See [[feedback-docs-driven-development]].", "feedback-docs-write-on-exit": "Trigger: learned a durable public fact \u2192 update the existing note or append inbox, then lint/sync. Do this during the task, not only on the way out.\n\n**How to apply:** public-only (AGENTS.md \u00a73). Prefer updating an existing `memory/` note over a new file. Pair with [[feedback-docs-read-on-entry]].", "feedback-fail-loud": "Surface uncertainty and skipped work. \"Tests pass\" is false if any were skipped.\n\n**How to apply:** list what was not verified. Pair with [[feedback-logic-change-update-tests]].", "feedback-issue-research-pr": "The contract that makes agent-written PRs reviewable, stated once and enforced\neverywhere (human, desk, and sub-agent alike):\n\n1. **Issue** \u2014 one problem, with an observable symptom and its evidence (a log\n   line, an `rg` hit, a failing check). No \"improve X\" without a symptom.\n2. **Research** \u2014 before any code, the issue answers: **where** (exact files and\n   the line you start at), **what** (the behaviour after, in one sentence a\n   reviewer could disagree with), **verify** (the test name, CI check, or command\n   with expected output), and **not already done** (issues, PRs, `git log`).\n3. **PR** \u2014 one concern, no drive-by renames or dependency bumps, description\n   states the issue, the verify path, and the blast radius.\n\n**Why:** \"there is no verify path\" is itself the finding \u2014 an agent that cannot\nname the check will ship a plausible diff that nothing proves, and the reviewer\npays for it. Naming *where* is what keeps parallel agents from colliding on the\nsame file, and naming *what* is what turns a review from \"is this right?\" into\n\"is this what we asked for?\".\n\n**How to apply:**\n\n- **Research-only is a valid outcome.** A vague issue, a product decision, or a\n  finding whose right output is knowledge gets a note, and the cycle stops. Do\n  not open a weak PR to look productive, and do not guess a product decision on\n  a timer.\n- **`needs-design` is a hard stop** for every agent, unattended ones included. It\n  means a human owes a decision.\n- Skip a step if you must \u2014 just never skip it *silently*, and record why in the\n  issue.\n\nSee [[tech-improvement-loop]], [[feedback-docs-driven-development]].", "feedback-logic-change-update-tests": "If you rename contracts or change behavior tests lock, grep tests and update expected values in the same PR.\n\n**Why:** green \"new code only\" still breaks CI.\n**How to apply:** run related suite before claiming done. See [[feedback-fail-loud]], [[tech-codebase-maintenance-loop]].", "feedback-main-ci-green-fast": "On chmonitor (and similar repos): after a merge or feature batch, **check `main` CI** (`gh run list --branch main`). Required jobs (`unit-tests`, `dashboard`) must stay green. Fix red `main` before starting unrelated work.\n\n**How to apply:**\n- Do not add tests that re-query live ClickHouse when a pure unit test suffices.\n- Do not put extra system-table scans on every Insights/cron sweep if a dedicated page already owns that query \u2014 extract, share SQL, run in `Promise.all`, fail closed without blocking other collectors.\n- Watch Worker/dashboard build time; a type error that only shows in `tsc --noEmit` is a required-check fail \u2014 reproduce locally before push.\n- Cancelled runs on older SHAs after a fast merge train are expected; judge green on the **tip** SHA.\n\n**Why:** stacked auto-merges cancel mid-SHA CI; tip health and hot-path query cost are what users feel.", "feedback-never-auto-merge-release-please": "Do not auto-merge release PRs. Skip:\n\n- release-please: branch starts with `release-please--`, or title starts with `chore(release)` / `chore(<scope>): release` / `chore: release`\n- changeset Version Packages: branch starts with `changeset-release/`, or title is `Version Packages` / `chore: version packages`\n\nOrdinary `feat` / `fix` / `ci` PRs may still automerge.\n\n**How to apply:** fix/CI babysit only; human merges releases. Generic automerge should skip those branch/title patterns from the default branch so a PR cannot rewrite the skip table. See [[tech-release-please-basics]], [[project-open-managed-agents]].", "feedback-pstack-verification": "Verification is the highest-leverage skill: the agent drives the real app, captures proof, and keeps going until the change is true. Treat it as infra, not optional markdown.\n\n**Why:** Without a closed loop, a human is the bottleneck. Volume only helps if quality stays high.\n\n**How to apply:**\n- Generate `.cursor/skills/verify-<app>/` with `/create-verification-skill` (CLI lever + Feature Map + one proven drive).\n- Prefer tools over prose (\"Build the Lever\"): composable CLI, `--dry-run` on destructive commands, JSON output, rich `--help`.\n- Parallelize with Cursor cloud agents, not git worktrees.\n- Ship prompts: `/poteto-mode` plus the repo's verify skill (screenshots, video, or transcripts as proof).\n- Refresh the skill as the app changes (`/maintain-verification-skill` on ship, not a new clock wake unless asked).", "feedback-public-kb-only": "This repo is public. Store durable, generic, public facts only.\n\n**Ban:** credentials, hostnames, IPs, machine names, employer-internal codenames, private topology.\n**Allow:** public `duyet/*` GitHub repos, published blog/CV facts, reusable tech patterns.\nSee AGENTS.md \u00a73. Hub: [[project-kb]].", "feedback-semantic-commits": "Conventional Commits style. Subject: lowercase, short. Body only when needed.\n\n**How to apply:** `feat(scope): \u2026`, `fix(scope): \u2026`, `chore: \u2026`. Related: [[tech-release-please-pr-title]], [[feedback-concise-english]].", "feedback-simple-code": "Ship the smallest correct change. No unused flexibility.\n\n**Why:** less debt, easier agent diffs.\n**How to apply:** delete speculative layers; match [[feedback-surgical-changes]].", "feedback-surgical-changes": "Every changed line must map to the user request. Mention unrelated dead code; don't delete it unless asked.\n\n**How to apply:** read callers first; avoid formatting-only churn. See [[feedback-simple-code]].", "feedback-tailscale-serve-local-vite": "When the user asks for Tailscale, tailnet, or remote access to a running local Vite/TanStack app, expose it with **Tailscale Serve** (tailnet only).\n\n**Why:** Direct HTTP on the Vite port is often blocked; Serve terminates HTTPS on the MagicDNS name.\n\n**How to apply:**\n1. Vite `server.host` listens on every interface. `allowedHosts` includes the Tailscale MagicDNS suffix plus the node's name from `tailscale status`.\n2. Do **not** `tailscale serve reset` (it wipes other proxies).\n3. Do **not** enable Funnel unless the user asks for the public internet.\n4. Add a mapping: `tailscale serve --bg --https=<httpsPort> --yes <vitePort>` on a free HTTPS port (check `tailscale serve status` first).\n5. Reply with the `https://<magicdns>:<httpsPort>/` URL from `tailscale serve status`.", "feedback-verify-ui-in-browser": "Render the page in a real browser and measure computed styles/geometry before\ncalling UI work done. Assert the *why* in tests, not the markup.\n\n**Why:** on a UI audit, three defects passed code review, a green test suite,\nand a clean read of the diff \u2014 all only visible in the rendered page:\n- a container reused two classes (`.wrap .topbar-in`), silently inheriting\n  72px padding and inflating a nav bar from 52px to 113px\n- a `<button>` missing its class fell back to the UA default grey, so the\n  primary CTA was unstyled\n- a control built in JS with one class instead of two got 18px instead of a\n  40px hit area\nAlso: a slow/mocked `fetch` in the test harness is what proved a double click\nfired two mutating POSTs. `color-mix`, `overflow-x`, and focus rings look right\nin source and fail silently.\n\n**How to apply:** open the page, then read back `getBoundingClientRect()` and\n`getComputedStyle()` for hit areas, background, and contrast; compute WCAG ratios\nin-page rather than eyeballing greys; test at ~360px for overflow; mock `fetch`\nand count *requests*, not UI states. Fix the defect's cause in CSS, not its\nsymptom in one call site, so every instance is covered.", "feedback-working-style": "Agent working-style index:\n\n- [[feedback-concise-english]] \u00b7 [[feedback-simple-code]] \u00b7 [[feedback-semantic-commits]]\n- [[feedback-surgical-changes]] \u00b7 [[feedback-fail-loud]] \u00b7 [[feedback-commit-push-deploy]]\n- [[feedback-docs-driven-development]] \u00b7 [[feedback-cheap-models-subagents]]\n- [[feedback-logic-change-update-tests]] \u00b7 [[feedback-never-auto-merge-release-please]]\n- [[feedback-main-ci-green-fast]] \u2014 keep main CI green and hot paths cheap\n\n- [[feedback-disambiguate-repo]] \u2014 multi-product sessions\n\nOwner: [[user-duyet-profile]].", "project-agentstate": "github.com/duyet/agentstate \u00b7 https://agentstate.app\n\nFleet **state/coordination** API (not an agent framework \u2014 [[tech-agentstate-not-a-framework]]). Five primitives: [[tech-agentstate-five-primitives]].\n\nProduct version is [[tech-release-please-basics]]: standing `chore(main): release X.Y.Z` PR, human-merge only ([[feedback-never-auto-merge-release-please]]). In 0.x, `feat` bumps minor (`bump-patch-for-minor-pre-major: false`). `/api` reports that semver.\n\nSDKs: npm `@agentstate/sdk`, PyPI `agentstate`. MCP available. MIT, self-hostable.\nPortfolio: [[user-duyet-active-projects]]. Related: [[project-anyworker]], [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "project-aidr-cf-cli": "aidr (`apps/web`, Worker `aidr`) uses the `cf` CLI (1.0.0-beta.5) for D1 and Worker secrets.\n\n- D1 database id: `0c8f3efe-0427-4268-8d9f-bb1a4bcbe427`. Commands take the id, not the name `aidr`.\n- Migrations: `cf d1 migrations apply 0c8f3efe-0427-4268-8d9f-bb1a4bcbe427 --dir migrations`\n- Query: `cf d1 query <id> --sql \"...\"`\n- Secrets: `cf workers secrets bulk --worker aidr --file <json array of {name,text,type}>`\n- Deploy stays `wrangler deploy --config dist/server/wrangler.json`. `cf migrate` does not carry the `news-ingest` Workflow or the `NewsIngestScheduler` Durable Object.\n\n**Why:** the hourly ingest depends on those bindings.\n**How to apply:** do not replace `wrangler.toml` with `cloudflare.config.ts` until `cf migrate` keeps Workflows and Durable Objects.", "project-anyrouter-catalog-one-id": "A public catalog id is the product slug (`owner/model`), not a host SKU. Date tags, `vision-exp`, `fast`, quantization suffixes, and casing variants belong on `upstreams[].model_name` or `aliases:` \u2014 never as sibling listing rows.\n\nExample (2026-08-28): DeepSeek V4 Flash lists as **`deepseek/deepseek-v4-flash`**. Former rows `deepseek/DeepSeek-V4-Flash`, `deepseek/deepseek-v4-flash-0731-fast`, and `deepseek/deepseek-v4-flash-vision-exp` resolve as aliases.\n\n**Why:** callers and `/models` should see one model, not three host spellings.\n**How to apply:** one lowercase `owner/model` listing id; keep working upstreams on that row; alias old ids; remove sibling YAML so it cannot occupy the id. Prefer unlist/alias over deleting history ([[project-anyrouter-unlist-broken-models]]). Do not invent ids. Do not add image/video generation endpoints.\n\nHub: [[project-anyrouter]].", "project-anyrouter-cli-native": "Public AnyRouter CLI is a **native Rust** binary, not the old Node package as the primary path.\n\n- Install: `curl -fsSL https://anyrouter.dev/setup.sh | bash`\n- First run: `anyr auth login` then `anyr claude`. Claude is the default agent; there is no post-login model/agent wizard.\n- Commands: `anyr` (prose) / `ar` (alias). Omit `--model` to use the documented `anyrouter/auto` preset (gateway failover, not a catalog SKU). Pin with `anyr claude --model owner/model` (same for `opencode` / `codex`).\n- Catalog ids are `owner/model` (e.g. `stealth/ox-alpha`). Model page: `https://anyrouter.dev/model/<owner>/<model>`.\n- Source, issues, and binaries: [anyrouter-dev/cli](https://github.com/anyrouter-dev/cli). Product/catalog issues stay on [[project-anyrouter]] (`duyet/anyrouter`).\n- Smoke: `anyr claude --model owner/model` (example: `stealth/ox-alpha[1m]`).\n- `setup.sh` (stable) probes GitHub `/releases/latest/download/anyr-<os>-<arch>`, then falls back to the newest release that actually has binaries (often a prerelease). A bare `/releases/latest/download/...` URL can still 404 when the latest stable tag has no assets.\n- `anyr update` must not call the GitHub Releases API unauthenticated (shared IPs get 403). Use a token or the public HTML listing.\n\nHub: [[project-anyrouter]].", "project-anyrouter-codexbar-declined": "`steipete/CodexBar` closed both AnyRouter provider PRs unmerged on 2026-07-17 \u2014 #2171 (duyetbot) and #2218 (joeVenner). The integration code was called clean; the block is **endorsement**: *\"Shipping a provider in CodexBar is an implicit endorsement, so for aggregator/relay services I hold a higher bar than code quality.\"*\n\nThree gates were named, and only the first is really blocking:\n\n1. **Identifiable operator** \u2014 hard gate, still open. *\"I can't point users at a service whose operator I can't identify.\"*\n2. **Authorized upstream access** \u2014 wants a public statement of reseller/API agreements.\n3. **Track record** \u2014 the service was very new.\n\n**Why:** the code was never the problem. Reopening the PR before gate 1 closes earns a third decline on identical grounds.\n\n**How to apply:** gate 1 needs a real legal person, not a copy edit \u2014 no entity is named in `src/app/terms.tsx` (`operator is established`, `AnyRouter and its operators`) and `src/app/contact.tsx` records the choice outright: *\"the company does not publish one.\"* Never publish an entity name before it exists; an unnamed operator is an absence of information, a wrong entity is a false legal claim. Tracked in [duyet/anyrouter#3650](https://github.com/duyet/anyrouter/issues/3650).\n\nGates 2 and 3 are largely satisfiable from work already done: the 2026-08-26 Terms added a provider allowlist for donated keys, Polar is merchant of record, and inception was 2026-04-11. The public `/brand` page ships `anyrouter-logo-currentcolor.svg` (correct for a menu-bar app) and accent `#F38020` \u2014 the declined PR had a stale `#f6821f`.\n\nFrame any re-proposal **BYOK-first**: the integration only reads *your own key's* credit balance over one read-only endpoint, so the shared pool is outside its surface.\n\n**Status 2026-09-27:** re-proposed as steipete/CodexBar#4055, rebuilt on the current plugin architecture (see [[tech-codexbar-new-provider-is-a-plugin]]) \u2014 25 lines of Swift plus a `.ts`, down from ~690 lines of bespoke Swift. Local gates green: 855 tests/113 suites, swiftformat, swiftlint, site locales, doc links, generated manifests. CI sits at `action_required` because a fork PR needs maintainer approval, so it has not run upstream yet. **The PR states plainly that gate 1 is still open and asks what form of disclosure would satisfy it** rather than papering over it.\n\nHub: [[project-anyrouter]].", "project-anyrouter-openai-compat": "AnyRouter accepts OpenAI Chat Completions-shaped clients (and Anthropic Messages). Integrate by changing base URL + model id.\n\nScope: text and embeddings. Vision / OCR on **input** is kept. Image and video **generation** were dropped. `POST /api/v1/images/generations` returns `410` `endpoint_gone`.\n\nProduct hub: [[project-anyrouter]]. Gateway lessons: [[tech-llm-gateway-quota-as-retryable]].", "project-anyrouter-os": "AnyRouter OS: public Cloudflare-OS workshop. Repo: duyet/anyrouter-os.\n\nSibling of the gateway ([[project-anyrouter]]), not a replacement for the API.\n\nThe OS repo has issues disabled. File product bugs on duyet/anyrouter with title prefix `[os]`, mention the OS repo in the body, and reuse existing labels only (`follow-up`, `bug`, `frontend`, `consistency`, `documentation`).\n\nPortfolio: [[user-duyet-active-projects]]. Infra: [[user-duyet-infra-cloudflare]].\n\n**Why:** QA cannot open issues on the OS repo; the gateway repo is the shared board.\n**How to apply:** Search duyet/anyrouter for existing `[os]` titles first; comment on near-dupes; do not invent labels.", "project-anyrouter-playground-mcp": "AnyRouter playground (`https://anyrouter.dev/playground`) attaches remote HTTP MCP servers. A new conversation already has **AnyRouter MCP enabled**.\n\n- Default endpoint (from live docs, do not invent): `https://anyrouter.dev/api/v1/mcp`\n- Transport: remote HTTP / Streamable HTTP. No stdio.\n- Users can disable the default (row stays listed) and add more HTTPS MCP servers.\n- Intended auth: a signed-in Clerk session is enough (`POST /api/v1/mcp` kind `session`). Pasted `sk-ar-v1-*` / `ak_*` is an optional override. Signed-out 401 still asks to sign in or add a key. Live 2026-08-27 after #2772 a signed-in Clerk session attaches AnyRouter MCP (tools/list + initialize 200; no red key line). Do not invent tools, auth, or prices.\n\nHub: [[project-anyrouter]]. Chrome: [[project-anyrouter-ui-chrome]].\n\n**Why:** playground chat needs catalog/keys/credits tools without leaving the conversation.\n**How to apply:** default-on the documented URL; never invent a second MCP endpoint or tool list.", "project-anyrouter-ui-chrome": "AnyRouter public UI uses one viewport token system: 320 / 375 / 768 / 1024 / 1280. Mobile-first. No `overflow-x` on the page.\n\n- Tap targets: 44px. Marketing CTAs keep visible labels (do not go icon-only). Vietnamese copy is fine.\n- Color: semantic tokens only (`background`, `foreground`, `border`, `muted`). No raw hex that breaks dark. Test light and dark. Avoid a white flash.\n- Skeletons match the final layout. Do not block first paint on a hung Clerk FAPI.\n- Playground compact chrome is one 44px row at 375; extra actions go in More.\n- Tab, chip, and segmented lists: `h-auto min-h-11`, `overflow-y-hidden`, `scrollbar-width: none`. Horizontal overflow only when chips cannot fit; hide scrollbar chrome.\n- Dashboard sidebar overlays below `lg` and must not crush content. No extra polling. No layout shift from late font/nav.\n- `/models` listing header: H1 and Learn more / Providers / Apps share one row from `md` (title left, links right); stack below `md`. Same gutter as the explorer. Compact link hits 44px. No extra max-width on that hero.\n\nHub: [[project-anyrouter]]. Tokens: [[tech-flat-design-semantic-tokens]]. Components: [[tech-shadcn-base]].\n\n**Why:** live QA found icon-only CTAs, stacked playground chrome, and a sidebar that squeezed content on phones.\n**How to apply:** design and test at those five widths; keep labels; overflow into More instead of a second toolbar.", "project-anyrouter-uniform-reasoning": "Open ticket for [[project-anyrouter]], measured on the full catalog\n(`GET /api/v1/models?all=1`, 206 listings, 2026-09-27). AnyRouter is one\ngateway over many upstreams, so it should expose **one** reasoning contract\ninstead of whatever each upstream happens to accept.\n\nEvidence:\n\n- 123 listings carry `reasoning` in `capabilities`, but only **12** list any\n  reasoning request field in `supported_parameters`.\n- Those 12 disagree with each other: `inclusionai/ling-3.0-flash-fin` and\n  `nex-agi/nex-n2.5-*` list only `reasoning`; `z-ai/glm-4.5` and\n  `z-ai/glm-5.2` list only `reasoning_effort`; only `z-ai/glm-5.3-flash` and\n  `stealth/space-bunny-alpha` list all three.\n- **No listing ever publishes the accepted effort values.** A client cannot\n  tell whether `xhigh` is legal on a given route.\n- All 9 `anyrouter/*` presets advertise only\n  `[max_tokens, temperature, top_p, stop, stream]` \u2014 no reasoning and no\n  `tools` \u2014 even though `auto`/`hermes`/`cowork` route to reasoning models\n  and the preset descriptions tell callers to pass `tools`.\n- 101 of 206 listings have `top_provider.max_completion_tokens: null`, so the\n  documented clamp (\"A max_tokens set higher is clamped down silently\") is\n  undiscoverable. `anyrouter/decision` is one of them.\n\nAsks:\n\n1. One reasoning surface for the whole API: the same request field\n   (`reasoning` + `reasoning_effort`) accepted on every model, forwarded to\n   whichever route serves the request.\n2. Publish the accepted effort values per model, or adopt a single ladder\n   (`low`/`medium`/`high`) and document it once.\n3. Include reasoning and `tools` in the presets' `supported_parameters`.\n4. Fill `top_provider.max_completion_tokens` (or add an explicit\n   `max_output_tokens`) so the clamp is discoverable.\n\n## The contract is already documented \u2014 chat is effort-only\n\n`/api-reference/models` states it outright, and it settles the toggle question\nthat no amount of probing could:\n\n> \"AnyRouter does not infer universal toggle, token-budget, or\n> interleaved-thinking support from a model name or description. Toggle and\n> budget controls remain endpoint-specific (`reasoning.enabled` /\n> `reasoning.max_tokens` on Responses, `thinking` on Messages).\"\n\nThe architecture doc in the gateway repo\n(`docs/kb/architecture/reasoning-metadata-and-preset-contract.md`) adds: for\n`anyrouter/*` presets, \"Chat uses flat `reasoning_effort`; Responses uses nested\n`reasoning.effort` plus endpoint-specific `reasoning.enabled`; Messages uses\n`thinking`; `none` remains a disable sentinel on the flat Chat/converted-Messages\npath.\" So on chat there is **one** control plus an off sentinel, and a\n`toggle`/`budget_tokens` entry in any catalog for this API is wrong.\n\nProbes agree (2026-09-27, `POST /api/v1/chat/completions`, `reasoning` object\nforms `effort` / `enabled` / `max_tokens` / `exclude`):\n\n| route | `reasoning: {\u2026}` | `reasoning_effort: none` |\n| --- | --- | --- |\n| `deepseek/deepseek-v4.1-flash` | 400 `Validation: Unsupported parameter(s): 'reasoning'` | 200, `reasoning_tokens: 0` |\n| `openai/gpt-oss-20b` | 400 `property 'reasoning' is unsupported` | 400 (upstream allowlist is low/medium/high only) |\n| `nvidia/nemotron-3-ultra-550b-a55b` | 200; `enabled:false` \u2192 0, `exclude:true` ignored | 200, 0 |\n| `anyrouter/free` | 200; `enabled:false` \u2192 0 | 200, 0 |\n\nThe nemotron routes accept the object form only because they are served by an\nOpenRouter-compatible pool that passes it through \u2014 exactly the\n\"provider support remains route-specific\" caveat in the host's own doc. It is\nnot a gateway contract, so catalogs must not publish a toggle on it.\n\n## Measured: the gateway forwards the field and never validates it\n\nReading `error.metadata.upstream_message`, the **serving upstream's** 400\ndecides which rungs are legal:\n\n| upstream | its own allowlist |\n| --- | --- |\n| `openrouter-pool` | `max`, `xhigh`, `high`, `medium`, `low`, `minimal`, `none` |\n| `huggingface-pool` | `low`, `medium`, `high` \u2014 rejects `xhigh` |\n| `nvidia-byok` (`deepseek-v4.1-flash`) | rejects `minimal` and `medium` |\n| `z-ai-coding-byok` | no validation, accepts any value |\n| `hermes-agent` | `low`, `medium`, `high`, `xhigh` |\n\nThe accepted set is **per model id, not per backend**: `nvidia-byok` serves\nboth `deepseek-v4.1-flash` (rejects `minimal`/`medium`) and\n`muse-glimmer-30b` (accepts both). A published `low`/`medium`/`high` contract\nreturns a hard 400 on `deepseek-v4.1-flash`.\n\nHonored effect, same multi-step prompt, mean `reasoning_tokens` (2026-09-27):\n\n| route | `none` | `low` | `medium` | `high` | `max` |\n| --- | --- | --- | --- | --- | --- |\n| `openai/gpt-oss-20b` (700) | rejected | 273 | 629 | 698 | rejected |\n| `deepseek-v4.1-flash` (1500, n=3) | 0 | 718 | rejected | 1182 | 1410 |\n| `nemotron-3-super-120b-a12b` (1500, n=3) | 0 | 663 | \u2014 | 916 | 722 |\n| `nemotron-3-ultra-550b-a55b` (1500, n=3) | 0 | 615 | \u2014 | 471 | 287 |\n| `anyrouter/free` (700) | 0 | 535 | 580 | 626 | \u2014 |\n| `minimax/m3` (700) | 0 / 349 | 611 | 551 | 846 | \u2014 |\n\n`none` is a real off position everywhere it is accepted. `nemotron-3-ultra`\nis the counter-example to \"deeper value = more tokens\": its ladder came out\ninverted, so accept-without-honored-effect is the honest reading for that\nroute \u2014 publish the peer's rungs, not a wider set.\n\nPresets resolve the member per request, so their ladder is not separable:\n`cowork`/`hermes` served `poolside/laguna-s-2.1` (`none` = 0, every graded\nvalue pinned at the whole budget), `auto` served `nvidia/nemotron-3-ultra-550b-a55b`\n(`low` = 3000), `latest` served `meta/muse-glimmer-30b` (no reasoning tokens\nreported at all), `free` served `dots-studio/dots-3-note-preview`.\n\nAccount-dependent gotchas when re-probing: `minimax/m3` ran out of upstream\ncredit partway through the day (402 \u2192 502, not a rejected rung), and\n`z-ai/glm-4.7-flash` is intermittent (502 from `z-ai-coding-byok`). Eight ids\nare BYOK-only and cannot be exercised with a plain key at all: 404\n`Model \u2026 is a Bring Your Own Key (BYOK) only model` or `No upstream available\nfor model \u2026` on every value, including a nonsense one.\n\n**`none` is not uniformly an off switch.** Two routes show why one measurement\nis not enough:\n\n- `minimax/m3`, five runs of `none` at max_tokens=1200: the two the route\n  served returned **0 and 787** reasoning tokens. Same value, same route, so\n  the sentinel can be ignored there and no catalog should promise it.\n- `anyrouter/hermes` answers `none` with 400 `Reasoning is mandatory for this\n  endpoint and cannot be disabled.` while `low`/`medium`/`high` each return 0\n  tokens on the member it does serve \u2014 publishing the off switch on that preset\n  would advertise a 400.\n- By contrast `anyrouter/auto`, `cowork` and `free` return 0 on every served run\n  of `none` (5/5, 3/3, 4/4) and spend the whole budget on any graded value,\n  because the router picks the member per request: a preset can promise the off\n  and nothing deeper.\n\n**Why:** without this, every client maintains its own per-model reasoning\ntable and guesses, and a uniform contract silently breaks on the routes whose\nupstream is narrower.\n**How to apply:** no public tracker exists for AnyRouter (closed service, no\nGitHub repo, issues disabled here), so this note is the ticket of record. Ask\n#2 (publish the accepted values per listing) is the one that unblocks\nfull-fidelity per-model data; until then publish the route's measured set,\ncite the measurement in the entry, drop every `toggle` and `budget_tokens`,\nand use `none` as the off position, and only where it reproduces. Shipped that way\nin the models.dev catalog (PR anomalyco/models.dev#8023, merged after the\nautomated review came back clean): per-model ladders, no toggles, no cost tiers\n(this API publishes flat rates), no per-token price for the `anyrouter/*`\npresets because they bill the route they resolve, and `[]` for the five entries\nwhere nothing could be verified \u2014 `m3`, `kimi-k2.6`, `grok-build-0.1`,\n`hermes`, `latest`. See\n[[project-anyrouter-openai-compat]].", "project-anyrouter-unlist-broken-models": "When a model or upstream on AnyRouter is not working, disable or unlist it from `/models` and the catalog. Do not leave a dead row. Prefer unlist/disable over deleting request history. Do not invent new model ids.\n\nThis is standing ops, not a one-off: smoke fails, quarantined upstreams, invalid ids, and unstable models all get unlisted so the catalog stays stable.\n\nHub: [[project-anyrouter]]. API scope: [[project-anyrouter-openai-compat]].\n\n**Why:** a listed model that 502s or 410s is worse than a missing row.\n**How to apply:** flip the catalog flag / unlist; keep historical generations. Use latest smoke results, not a guessed id list.", "project-anyrouter": "https://anyrouter.dev \u2014 **universal AI model router**: one API, many providers/models, OpenAI Chat Completions + Anthropic Messages compatible.\n\nPublic surfaces: marketing `anyrouter.dev` \u00b7 dashboard `dash.anyrouter.dev` \u00b7 docs `docs.anyrouter.dev` \u00b7 workshop OS [[project-anyrouter-os]] (`os.anyrouter.dev`).\nAPI base: `https://anyrouter.dev/api/v1`. Packages: `@anyr/sdk`. CLI: native `anyr` ([[project-anyrouter-cli-native]]).\n\nAPI shape: [[project-anyrouter-openai-compat]]. Patterns: [[tech-llm-gateway-byok-sibling]], [[tech-llm-gateway-quota-as-retryable]], [[tech-cloudflare-ai-gateway-transparent]], [[tech-workers-cache-enabled]].\nPortfolio: [[user-duyet-active-projects]]. Related products: [[project-anyrouter-os]], [[project-agentstate]], [[project-anyworker]].\nPlayground MCP: [[project-anyrouter-playground-mcp]].", "project-anyworker-local-agent": "[[project-anyworker]] splits **marketing Worker** (`apps/web`) from **local agent product** (`apps/anyworker` server + GUI).\n\nRelated: [[project-agentstate]], [[user-duyet-ai-stance]].", "project-anyworker": "github.com/duyet/anyworker \u00b7 https://anyworker.dev\n\nOpen \u201cAI that does the work\u201d product. Split: marketing Worker vs local agent+GUI ([[project-anyworker-local-agent]]).\n\npnpm monorepo; TanStack Start web ([[tech-tanstack-start-ssg]]). Related: [[project-agentstate]], [[project-anyrouter]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "project-charts": "github.com/duyet/charts \u2014 public Helm charts, tested with KinD. Related: [[user-duyet-infra-kubernetes]], [[reference-duyet-github]].", "project-chmonitor-advisor": "chmonitor advisor mode is **recommend-only** \u2014 projections, skip indexes, partitions, MVs \u2014 never silent schema mutations.\n\nHub: [[project-clickhouse-monitoring]]. Safety culture: [[feedback-fail-loud]].", "project-chmonitor-cli-local-connections": "`chm` keeps a **local named connection store** (not dashboard hosts).\n\n- `chm add <url>` (alias `connect`) saves ClickHouse HTTP `http(s)://[user:pass@]host:8123[/db]` or `postgres://` / `postgresql://`\n- `chm ls` lists name, engine (`clickhouse` | `postgres`), host, current; `--json` supported\n- `chm use <name>` sets `current_connection` in user `config.toml`\n- `chm rm <name>` removes a saved connection\n- Secrets go through the credentials helper (keyring / `0600` plaintext); never printed in `ls` or JSON\n- Live TUI opens against the active local HTTP connection\n- Dashboard `chm hosts` is unchanged (`/api/v1/hosts`)\n\nHub: [[project-clickhouse-monitoring]].", "project-chmonitor-desk-jobs": "chmonitor's unattended maintenance is the **herdr-desk** Herdr plugin, config\nonly in `.herdr-desk.json` plus repo-owned playbooks in `docs/herdr-desk/`.\n\n| Job | Cron | Owns |\n|---|---|---|\n| `desk:github-issues` | `0,30 * * * *` | triage, research, dispatch children |\n| `local:babysit` | `10,40 * * * *` | red required CI, review, auto-merge, worktrees |\n| `local:prod` | `20,50 * * * *` | live deploy verification, agent probe, usage, revert |\n| `local:improve` | `17 2 * * *` | desk health, doc/skill drift, dead code, slowdowns |\n\n**Why:** one job doing all four duties made every duty compete for the same five\nchild slots, so a busy issue queue silently starved PR maintenance. Separate\njobs give each duty its own budget and its own manager.\n\n**How to apply:**\n\n- **Stagger the minutes** so two jobs never contend for one slot, and give each\n  job its own `agentName` \u2014 the agent name *is* the session identity, so a\n  shared name means two prompts racing for one pane.\n- **`name` in the desk config must equal the repo folder name.** A stale\n  `\"name\": \"chmonitor\"` in the herdr-desk repo registered a second chmonitor job\n  on a different cron; the loser recorded a prompt failure.\n- Required CI is `unit-tests` + `dashboard`. `e2e-test`, `e2e-test-tsr`,\n  `component-test`, `codecov/patch`, `promptfoo` and `Claude Issues` are\n  informational. Release-please PRs are human-only, never auto-merge.\n- Production deploys itself on push to `main`; `local:prod` is the second pair of\n  eyes and may only verify or restore service, never ship.\n- Proof a branch landed before deleting its worktree: `git diff <branch>\n  origin/main -- <touched files>`, **not** `git branch --merged` \u2014 squash merges\n  change the sha, so a fully merged branch still reads \"ahead N\".\n\nLessons: [[tech-silent-scheduler-failure]], [[feedback-issue-research-pr]].", "project-chmonitor-hide-menu-item": "Sidebar leaf items (with an href) can be hidden **in the menu**, without opening Settings first.\n\n- Hover reveals **Hide** (EyeOff) next to **Pin**. Click does not navigate.\n- Persist via `hiddenMenuHrefs` / Custom workspace (`hideMenuHref` / `showMenuHref`).\n- Toast: `{title} hidden from the menu` / `Bring it back in Settings \u2192 Workspace \u2192 Navigation.` Actions: **Undo** and **Open Navigation**.\n- Settings gear / \u2318, still open General; the toast opens the **navigation** tab.\n- Footer About is not hideable. Engine filter still applies ([[project-chmonitor-menu-engine-filter]]).\n\nHub: [[project-clickhouse-monitoring]].\n\n**Why:** hide/show used to live only in Settings \u2192 Workspace \u2192 Navigation.\n**How to apply:** add hide only on leaves with href; restore path is always Settings \u2192 Workspace \u2192 Navigation; do not invent a second hide store.", "project-chmonitor-licenses": "Public paid path for [[project-clickhouse-monitoring]] is **self-hosted host-count licenses** (yearly or lifetime), honor system \u2014 not hosted SaaS seats. Replicas in the same shard are **not counted**.\n\nCloud demo remains `dash.chmonitor.dev`. OSS self-host stays the default for enterprises (IP allowlists, no metadata leaving the VPC).\n\n**Why:** agents should not design \u201cSaaS seats\u201d as the paid SKU.\n**How to apply:** talk about host-count licenses + trust model; replicas are free.", "project-chmonitor-menu-engine-filter": "Dashboard nav (sidebar, command palette, Settings > Navigation) filters by the **active host engine**.\n\n- No `engines` tag \u2192 ClickHouse family (`clickhouse` + `clickhouse-cloud`). Hidden on Postgres.\n- `engines: ['postgres']` \u2192 Postgres-only.\n\nSettings > Navigation uses the same filter as the live sidebar (`useActiveHostEngine`). Do not hardcode ClickHouse when building the customize tree. Do not add `engines: ['postgres']` to ClickHouse tools just to show a heading.\n\nHub: [[project-clickhouse-monitoring]]. Tools group: [[project-chmonitor-tools-sidebar]].\n\n**Why:** a Postgres host must not customize or see ClickHouse-only pages (Queries, Cluster, Tools).\n**How to apply:** leave CH-only items untagged; thread the active host engine into every nav surface.", "project-chmonitor-tools-sidebar": "Dashboard sidebar **Tools** is last in the MAIN section (after PeerDB, before Others). Interactive-utility group:\n\n- SQL Console (`/sql`)\n- Data Explorer (`/explorer`)\n- Explain (`/explain`)\n- Advisor (`/advisor`) \u2014 recommend-only ([[project-chmonitor-advisor]])\n- Chart Builder (`/dashboard`)\n- Schema Compare (`/schema-diff`)\n- Settings Diff (`/settings-diff`)\n\nAI Agent stays its own top-level group. Queries, Cluster, and other monitors stay put. DBA / Engineer / SRE workspace presets include Tools.\n\nTools is ClickHouse-family only \u2014 a Postgres host must not see it ([[project-chmonitor-menu-engine-filter]]).\n\nHub: [[project-clickhouse-monitoring]].\n\n**Why:** tool pages were scattered under Tables, Queries, Operations, and System.\n**How to apply:** put new interactive utilities in Tools; keep Tools last in MAIN (not in Others); do not move monitoring views there.", "project-chmonitor-ttl-partitions": "System view **TTL & Partitions** (`/ttl-partition-health`) shows:\n\n- Inventory table: full_table, engine, partition_key, ttl_expression, partitions, active_parts, parts_per_partition, bytes_on_disk\n- Charts: part health and parts per table\n\nThis is a System monitor, not a Tools utility ([[project-chmonitor-tools-sidebar]]).\n\n`system.tables` has no `ttl` column. Inventory SQL must never select `system.tables.ttl` \u2014 that 500s and the UI shows a silent Retry.\n\nHub: [[project-clickhouse-monitoring]].\n\n**Why:** inventory failed live when the query invented a column; charts still worked.\n**How to apply:** keep inventory and charts as separate queries; fail loud on inventory errors; do not select `system.tables.ttl`.", "project-chmonitor-verify-skill": "chmonitor ships `.cursor/skills/verify-chmonitor` (CLI lever + Feature Map + one proven drive). Primary surface is the standalone `chm` / `chmonitor` binary from this checkout, not the hosted dashboard.\n\n**Why:** Hosted dashboard `GET /api/healthz` is cluster-gated and can hang for minutes. That is not the identity prove.\n\n**How to apply:**\n- Launch this checkout's CLI, then `doctor.sh` (identity-only by default). Opt in to dashboard HTTP with `--http` / a short timeout.\n- Canonical prove: `drive.sh local-connections` \u2014 `chm add` / `ls` / `use` / `rm` against isolated `--config` (no operator keyring).\n- Later ships: `/poteto-mode` plus this skill. Refresh the skill when shipping, not on a weekday cron. Cloud agents only; no git worktrees.\n\nHub: [[project-clickhouse-monitoring]]. Generic loop: [[feedback-pstack-verification]]. Local store: [[project-chmonitor-cli-local-connections]].", "project-clickhouse-monitoring": "github.com/chmonitor/chmonitor \u00b7 https://chmonitor.dev \u00b7 docs.chmonitor.dev\n\n**chmonitor** \u2014 ClickHouse operational advisor + real-time monitoring, MCP, AI chat. Advisor is recommend-only ([[project-chmonitor-advisor]]).\n\nOSS self-host and hosted Cloud from one product family ([[tech-one-codebase-oss-saas]], [[tech-single-source-env]]). Paid SKU: [[project-chmonitor-licenses]].\n**Image:** `ghcr.io/chmonitor/chmonitor:latest` (not the stale `ghcr.io/duyet/chmonitor` path).\n**Homelab self-host ops:** [[lessons-chmonitor-homelab-deploy]] (full cluster vs public `dash.chmonitor.dev`; never assign CH `readonly=1` profile to the dashboard user).\nLocal CLI store: [[project-chmonitor-cli-local-connections]]. Verify skill: [[project-chmonitor-verify-skill]].\nSidebar **Tools** group: [[project-chmonitor-tools-sidebar]]. Engine filter: [[project-chmonitor-menu-engine-filter]]. TTL & Partitions: [[project-chmonitor-ttl-partitions]].\nFocus: [[user-duyet-focus-clickhouse]]. Portfolio: [[user-duyet-active-projects]].", "project-codex-claude-plugins-verify-skill": "duyet/codex-claude-plugins ships `.cursor/skills/verify-marketplace` (CLI lever + Feature Map + one proven drive). Surface is marketplace JSON and plugin manifests, not a hosted web app.\n\n**Why:** Agents need a closed loop before Grok/logo/harness ships. `main` had no `.cursor/skills/verify-*` until PR 86.\n\n**How to apply:**\n- Use `control-marketplace.mjs` (`doctor`, `info`, `list`, `check-install`, `validate`; `--json`; `--dry-run` on `install-antigravity` and `cleanup`). Controller v1.1.0 after #88.\n- Proven drives: `marketplace-catalog` (Claude), `codex-install` (Codex), `grok-build-and-bot` (Grok; skip fails).\n- Grok Build / Grok Bot are first-class after #87 (harnesses) and squash-merged #88 (verify treats those slots as real; prove pass on master `a2c28a3`).\n- Later ships: `/poteto-mode` plus this skill. Refresh on ship, not weekday cron. Cloud agents only; no git worktrees.\n\nGeneric loop: [[feedback-pstack-verification]].", "project-duyetbot": "duyetbot is the manager. It assigns work to dedicated product bots (AnyRouter, chmonitor, live QA), keeps a running summary, and writes durable public facts to [[project-kb]].\n\nIt also maintains [[project-monorepo]] within scope: code, design system, deploy config. Out of scope without human direction: authored blog posts and curated timeline research facts.\n\nShared brain: `~/kb` (same tree as `apps/kb/kb`). Protocol: [[feedback-docs-driven-development]], [[feedback-docs-write-on-exit]].", "project-homelab": "github.com/duyet/homelab \u2014 public personal homelab configs/experiments.\n\nRelated: [[user-duyet-homelab]], [[project-charts]], [[user-duyet-site-homelab]].\nKeep kb notes generic \u2014 no private inventory.", "project-kb-site": "Public site for [[project-kb]]. Graph + llms.txt endpoints for agents. Pattern: [[feedback-docs-driven-development]]. Link: [[user-duyet-site-kb]].\n\nContent lives in the [[project-kb]] git repo (`~/kb`). The renderer is `apps/kb` in [[project-monorepo]]. Locally `apps/kb/kb` is a symlink to `~/kb`. CI uses the `apps/kb/kb` git submodule (`git@github.com:duyet/kb.git`, branch `main`).", "project-kb": "github.com/duyet/kb \u2014 this repository. Protocol: AGENTS.md. Index: MEMORY.md. Graph: [[tech-okf-bundle]].\n\nPattern: [[feedback-docs-driven-development]]. Site: [[user-duyet-site-kb]] / [[project-kb-site]]. Scope: [[feedback-public-kb-only]].", "project-llm-timeline": "App in [[project-monorepo]]: https://llm-timeline.duyet.net \u2014 large static timeline (1950\u2013present).\n\nUses [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]]. Curated model data is human-owned research.", "project-monorepo": "github.com/duyet/monorepo \u2014 public web monorepo (blog, CV, timeline apps, kb site, news, shared packages).\n\nStack: Bun, Turborepo, TanStack Start SSG, Cloudflare Pages / Workers.\n`apps/kb` is the renderer for [[project-kb]] / [[project-kb-site]].\n`apps/news` is [[project-news]] (news.duyet.net).\n`apps/news-tab` is the unpacked Chrome new-tab client for that feed (Load unpacked; not on Pages/Workers). Separate release-please component (#1406): own changelog, 0.1.x, `news-tab-v*` tags \u2014 not folded into the root `duyet` release. Leave its release-please PR unmerged ([[feedback-never-auto-merge-release-please]]).\nRelated: [[project-llm-timeline]], [[project-duyetbot]], [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]].", "project-news": "https://news.duyet.net \u2014 feed + ranking app in [[project-monorepo]] (`apps/news`). Cloudflare Worker deploy. Admin ingest is token-gated (`/api/admin/*`); do not put the token in kb.\n\nPublic third-party digest (shipped 2026-08-28, #1396): `GET /api/public` returns compact JSON (`tldr` bilingual bullets + up to 8 top `stories`, `updatedAt`). No auth. CORS allows `chrome-extension://\u2026`, localhost, and `https://*.duyet.net`. Intended for the in-repo Chrome new-tab client (`apps/news-tab` in [[project-monorepo]]; Load unpacked from `manifest.json`). Homepage `/api/feed` stays the large no-CORS SPA payload.\n\nHomepage AI;DR (shipped 2026-08-28, #1397): each bullet shows a compact story thumb on the right (layout A: number + copy left, 40\u201348px thumb right). Thumb is the linked story `image_url`; missing/broken images use the site mark. `TldrBullet.image_url` is attached at read time on `/api/feed` and `/api/public`, not stored on the snapshot. QA-only `?aidr=b|c` flips layout; default is A.\n\nHomepage AI;DR copy (shipped 2026-08-28, #1399): digest prompt targets ~2 sentences / 180\u2013240 chars; homepage clamps to 3 lines with ellipsis and highlights named entities (same topic colors as the feed). Existing snapshots stay one-liners until the next finished ingest writes longer copy. `/api/public` already clips `text` at 400 chars.\n\nHourly ingest (shipped 2026-08-28, #1400 + #1402 + #1405): primary cadence is a Durable Object alarm, not a Worker cron (account is at the 5-trigger cap; [[tech-cloudflare-cron-triggers-five-per-account]], [[tech-durable-object-alarms-not-cron]]). GitHub Actions is a watchdog with four independent crons per hour. Triggers coalesce if a run started in the last 45 minutes; manual `workflow_dispatch` POSTs `?force=1` to bypass coalesce. #1405 intended `open-run` to upsert `workflow_runs` immediately and set `GET /api/system` to `Cache-Control: no-store` (no-store is live). Recert lastRun by a force POST, not an invented schedule fire. First public hit or admin ingest POST arms the alarm.\n\n#1415 (2026-08-29): persist `workflow_runs` with D1 `.run()` / `batch()`, not `INSERT RETURNING` + `.first()` ([[tech-d1-insert-returning-not-a-write]]). Gate 2xx on the same lastRun SELECT `/api/system` uses. Recert lastRun by a force POST after deploy; do not invent a schedule fire.\n\nnews-tab releases (shipped 2026-08-28, #1406): `apps/news-tab` is its own release-please component \u2014 changelog, 0.1.x line, `news-tab-v*` tags \u2014 not folded into the root `duyet` release. Leave its release-please PR for human merge ([[feedback-never-auto-merge-release-please]]).\n\nChrome new-tab install (shipped 2026-08-29, #1421 + #1423): public zip at https://news.duyet.net/news-tab.zip (packed at news build from `apps/news-tab`; nested `news-tab/manifest.json`). Guide at https://news.duyet.net/extension (\"Tab Chrome\" in the primary menu). Chrome cannot Load unpacked a `.zip` \u2014 unzip first, then pick the `news-tab` folder. Not on Chrome Web Store. `chrome://extensions` is linked; HTTPS pages may block that navigation so the guide also says to paste the URL.\n\nProduct hub: [[project-monorepo]]. Portfolio: [[user-duyet-web-presence]].", "project-oma-console-analytics": "Console **Analytics** (`/analytics`, chord `g y`) is a dedicated spend and delegation page for a workspace. First slice of the analytics issue \u2014 no new backend.\n\nIt reads `GET /v1/usage?group_by=agent&days=N` (range chips `1d | 7d | 30d`, default `7d`) and `GET /v1/agents` multiagent rosters. KPI strip covers estimated spend, tokens, sessions, and agents with usage. Token mix is **by kind** (input, output, cache, reasoning), not by model. Cost-by-agent uses the same Sonnet-class rates as agent stats (top 10 + Others). Daily trend charts sandbox-active seconds. Declared delegation shows a ranked roster plus a compact SVG node-link on desktop.\n\nMarketing copy on https://oma.duyet.net/features/ names Console Analytics under multi-agent delegation. Docs concepts page documents the same surface. Signed-out `/analytics` stays behind the Console login gate.\n\n**Why:** Operators with many agents need one screen for \u201cwho spends?\u201d and \u201cwho can call whom?\u201d without a new analytics API.\n\n**How to apply:** Recert signed-in `/analytics` with range chips and empty-tenant honesty. Do not invent by-model charts or a dedicated `/v1/analytics` until usage events carry model ids. Full issue remains open for later slices.\n\nHub: [[project-open-managed-agents]].", "project-oma-console-artifacts": "In [[project-open-managed-agents]], Console session detail has an **Artifacts** Inspector tab (alongside Overview / Usage / Tools / Sandbox / Files). Shipped in duyet/oma #442.\n\nDerivation is client-side from the streamed event array plus the session outputs listing \u2014 no extra store or polling:\n\n| Source | What surfaces |\n|---|---|\n| `write` / `edit` / `output_file` tool_use | Path + content |\n| `agent.tool_result` image/document blocks | data URLs / file ids / media_type |\n| `user.message` attachments | Same set as the chat transcript |\n| Session outputs listing | Listing-only rows need \u2265 1 KB and a previewable type |\n\nGrid/list views, source + extension filters, image lightbox, PDF iframe, text via `CodeBlock`, download for inline writes and `GET /v1/sessions/:id/outputs/:filename`. Declared deliverables via opt-in `output_file` are covered in [[project-oma-output-file-opt-in]] (#341 contract still separate).\n\n**Why:** Operators need to browse agent-produced files without scrolling the event log.\n**How to apply:** QA on a signed-in session detail \u2192 Artifacts tab. Do not invent auth secrets for verify; gate checks can assert redirect to `/login`.", "project-oma-console-daily-summary": "Console agent detail gains a **Daily summary** tab for schedule firings only (not all-sessions observability). It rolls up `agent_schedule_runs` (`ok` / `error` / `skipped_concurrency`) over chips `1 | 7 | 30` UTC days with counts, tokens, and cost. Per-schedule history stays in its existing modal.\n\nFirst slice of the daily-summaries issue \u2014 deployments rollup is still open.\n\n**Why:** Operators need an agent-level view of what cron firings did without replaying the event log.\n\n**How to apply:** Recert signed-in agent detail \u2192 Daily summary with range chips and empty honesty. Do not treat this tab as all-sessions monitoring.\n\nShipped in duyet/oma #449. Hub: [[project-open-managed-agents]].", "project-oma-console-hitl-approvals": "In [[project-open-managed-agents]] Console, `always_ask` tool calls are approved from an `ApprovalCard` pinned above the session composer. Deny / Approve POST `user.tool_confirmation`. \"Don't ask again this session\" writes an `oma.hitl.allow:<session>` policy.\n\nAlso shipped in the same slice: compact session cards and a notice bell for pending approvals \u2014 usable on phone without Web Push.\n\n**Why:** Operators could not approve HITL from mobile; Console never POSTed tool confirmation.\n**How to apply:** Recert signed-in session with a pending always_ask tool; expect ApprovalCard + notice. Out of scope: agent `default_tool_policy`, timeout auto-deny, CLI HITL.", "project-oma-console-monitor": "Console AgentDetail shows a derived **health strip** (status, last/next run, uptime, success rate, avg duration, cost/run) from existing schedules, sessions, stats, and analytics. No dedicated `/v1/agents/:id/health` route yet.\n\n**Monitor** (`/agents/:id/monitor`) sits between Schedules and Observability. It is the live `agent.status` progress feed: current or last session, step bar, amber `blocked_on`, heartbeat log, lag at 2\u00d7 the 5-minute default. Eyes-only \u2014 Interrupt is out of this slice. Upgrade log is an honest empty placeholder.\n\nDashboard **Active sessions** deep-links to that agent's Monitor when exactly one running session has an agent id.\n\nLanded in #444 as the first slice of the monitoring UX (#345 still open). Signed-out `/monitor` stays behind the Console login gate.\n\n**Why:** Operators of scheduled or long-running agents need a glanceable alive/progress surface without new control-plane endpoints.\n\n**How to apply:** Point operators and recert at AgentDetail header + Monitor tab, not Observability. Do not invent heartbeat_missed / self_upgrade notify until a dispatcher exists.\n\nHub: [[project-open-managed-agents]].", "project-oma-console-session-inject": "In [[project-open-managed-agents]], operators can intervene in a **running session** via a session-scoped injection overlay (Console Inspector **Inject** tab).\n\n- **Write:** `POST /v1/sessions/:id/injections` (canonical). `PATCH /v1/sessions/:id/tools` is a thin tool-toggle alias.\n- **Read:** `GET /v1/sessions/:id/injections` returns the overlay (never tokens).\n- **Storage:** `session.metadata._oma_injections` (stripped from public GET metadata). Not copied onto the agent; new sessions do not inherit.\n- **Timing:** prompt append + tool overrides apply on the **next turn**; MCP mounts + credential binds on the **next proxy/outbound call**.\n- **Credentials:** `credential_id` only, must already be in the session\u2019s `vault_ids` (422 otherwise). Overlay/events/UI never carry tokens.\n- **Audit:** `session.config_updated` is non-replayed (prompt body omitted; credential detail is host + id).\n\nFirst slice of the broader Inject issue; tablet/mobile sheet, env/package injection, and undo stack are out of scope.\n\n**Why:** Live ops without restarting or mutating the agent record.\n**How to apply:** Prefer the Inject API/overlay for session-scoped changes; do not put tokens in metadata or expect agent inheritance. Drive verify with `console-inject`.", "project-oma-home-session": "Product shape shipped in duyet/oma #464 (issues #460\u2013#463): **Agent** is the noun. Each Agent may have one **home session** (metadata `home: true`, title `Home`) \u2014 a Bot-like durable inbox. Extra sessions stay ephemeral.\n\n**API:** `POST /v1/sessions/home` get-or-create; `GET /v1/sessions/home?agent_id=` returns **200** `{ session: null | Session, runtime, created: false }` even when no inbox exists (not 404 \u2014 so Console can paint presence); `POST /v1/sessions` with `metadata.home: true` reuses the same row. Responses include paired **runtime** presence (`online` | `offline` | `provisioning`; ~90s stale \u2192 offline). Console Overview + AgentHealthStrip prefer the home payload runtime and show inbox / **Open home** accordingly (#467/#468).\n\n**Runtime vs sandbox:** Home runtime = long-lived bridge/herdr (OpenShell optional). Session sandboxes stay ephemeral. CLI relay bootstraps only \u2014 not an always-on shared VM.\n\n**Surfaces:** Landing H1 \u201cYour Agent has a computer \u2014 and a durable inbox\u201d; Console Overview home strip + open sessions; AgentHealthStrip presence + inbox link; Agent detail **Open home**. Design RFCs live in repo `docs/home-session.md` (not Starlight `apps/docs`).\n\n**Why:** Matches Grok Bot-like pinned inbox without turning every turn into a shared VM.\n**How to apply:** Drive landing-home via verify-oma; signed-in Console Overview/home strip needs a real operator session \u2014 no invented secrets. Hub: [[project-open-managed-agents]].", "project-oma-node-model-card-credentials": "Self-hosted Node (`apps/main-node`) session turns resolve the tenant **Model Card** first: wire model, API key, base URL, provider, and custom headers. Shared across model construction, tools, and harness auth. OpenAI-compatible cards (e.g. DeepSeek gateways) work without a global `ANTHROPIC_API_KEY`. Deployment-wide / AnyRouter credentials remain the fallback.\n\n**Why:** Without this, valid tenant cards still failed before the first model request on self-hosted Node with no global provider key.\n\n**How to apply:** For Node self-host regressions on model routing, check Model Card resolution order before blaming env keys. Shipped in #470 (closes #469).", "project-oma-output-file-opt-in": "In [[project-open-managed-agents]], `output_file` is **not** a default-on write to `/mnt/session/outputs/`. It is an **opt-in** tool (same `configs` gate as `browser` / `run_dynamic_worker`) that marks a file as a session deliverable.\n\nEnable via agent toolset config, e.g. `agent_toolset_20260401` with `{ \"name\": \"output_file\", \"enabled\": true }`. Declared files emit `agent.output_declared` into the session event log and surface in the Console Artifacts tab.\n\nMarketing copy on https://oma.duyet.net names this under Building Blocks \u2192 Artifacts.\n\n**Why:** Operators want intentional keep-this artifacts, not every sandbox write.\n**How to apply:** Do not assume `output_file` is always present; check agent configs. Console session Inspector **Artifacts** tab (duyet/oma #442) aggregates writes, tool-result media, uploads, session outputs, and declared deliverables from the event log \u2014 no extra store.", "project-oma-session-env-secret-persist": "`POST /v1/sessions` accepts `env_secret` (and inline `github_repository.authorization_token`) and persists each value through `sessionSecrets.put`, keyed by the minted resource id (identity-matched, not list-order zip).\n\n- Fail closed with 500 when secret payloads are present but the store is unwired (no silent drop).\n- Wired on Cloudflare route services and self-host Node (`KvSessionSecretRepo` over the existing SQL-backed KV).\n- Session DELETE cascades `deleteAllForSession` (idempotent with the CF lifecycle path).\n- API responses must not contain plaintext secret values.\n\nLanded in #445 (closes audit #426). Restores documented `env_secret` behavior after a storage refactor dropped the create-path writer.\n\n**Why:** Sandbox consumers (`resource-mounter`, github-creds, runtimes bundle) read the secret store; an empty store meant secrets never reached the sandbox despite 201 creates.\n\n**How to apply:** Keep create-path `sessionSecrets.put` wired on both CF and Node. Prefer identity match over zip-by-index when attaching values to minted resources. Do not invent or log secrets.\n\nHub: [[project-open-managed-agents]].", "project-oma-timing-safe-secrets": "`checkInternalSecret` (gates `/v1/internal/*` on the main worker) compares `x-internal-secret` with shared `timingSafeEqualStr`, same helper as the trusted-proxy guard.\n\n- Helper lives in `packages/auth/src/timing-safe-equal.ts`, exported from `@duyet/oma-auth` and subpath `@duyet/oma-auth/timing-safe-equal`.\n- Prefer the subpath import in the main worker so the auth barrel (`createAuthMiddleware`) stays out of that bundle.\n- Responses unchanged: 503 when secret unset, 401 when header missing/wrong.\n\nLanded in #443 (closes audit #427). Out of scope then: other `x-internal-secret` compares under `apps/integrations`.\n\n**Why:** Keep secret gates consistent and defense-in-depth; avoid `!==` on shared secrets.\n\n**How to apply:** Reuse `timingSafeEqualStr` for new secret compares; import via the timing-safe-equal subpath on the main worker. Do not invent or log secrets.\n\nHub: [[project-open-managed-agents]].", "project-oma-vault-tenant-scope": "`oma-vault` parses `OMA_TENANT` as a `TenantScope`. Unset, empty, and `*` remain wildcard so a single-operator install still boots. When credentials contain more than one distinct `tenant_id`, a wildcard scope refuses to start. Same-host credential matches no longer return another tenant's token.\n\nCompose and Helm default `OMA_TENANT` to empty (not `*`). Out of scope: per-request tenant attribution via per-session ports or sandbox tags.\n\n**Why:** Prior default `*` plus host-only matching let two tenants that both register `api.github.com` steal each other's token.\n\n**How to apply:** Multi-tenant self-host must set a concrete `OMA_TENANT`. Do not ship chart/compose defaults as `*`. Recert vault matching only within the configured tenant.\n\nShipped in duyet/oma #450 (closes #428). Hub: [[project-open-managed-agents]].", "project-oma-verify-skill": "duyet/oma ships `.cursor/skills/verify-oma` (CLI lever `control-oma.mjs` + Feature Map under `features/`). Added in #430 with the marketing/Console `cn` migrate.\n\n**Why:** Later ships should drive landing + Console as a user, with screenshots/JSON proof, not only typecheck.\n\n**How to apply:**\n- First prove path already landed with the skill: `control-oma launch web` \u2192 `doctor` \u2192 `drive landing-home` \u2192 `landing-check`; Console login drive for `#auth-email` / Sign in.\n- Later ships: `/poteto-mode` plus this skill. Refresh on ship, not a weekday cron. Cloud agents only; no git worktrees. No invented env or secrets.\n\nHub: [[project-open-managed-agents]]. Generic loop: [[feedback-pstack-verification]].", "project-open-managed-agents": "github.com/duyet/oma \u00b7 https://oma.duyet.net \u00b7 docs: https://docs.oma.duyet.net\n\nOpen-source reimplementation of a **Managed Agents**-style API. Meta-harness: platform prepares tools/skills/sandbox/credentials; pluggable harness drives the model loop.\n\nRuns two ways: Cloudflare (Workers + Durable Objects) or self-host Node/`docker compose` \u2014 same business logic.\nInvariants: [[tech-oma-credentials-out-of-sandbox]], [[tech-prompt-cache-byte-sensitive]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].\n\nEnv-fallback Claude routing: [[tech-oma-bare-claude-gateway-rewrite]].\nBridge git HTTPS with a GitHub CLI credential uses [[tech-gh-token-git-host-alias]].\nConsole live progress: [[project-oma-console-monitor]].\nConsole declared deliverables: [[project-oma-output-file-opt-in]].\nHITL approvals: [[project-oma-console-hitl-approvals]].\nSession env secrets: [[project-oma-session-env-secret-persist]].\nHome session / home runtime: [[project-oma-home-session]].\nNode Model Card credentials: [[project-oma-node-model-card-credentials]].", "project-templatebot-pay-to-install": "On templatebot, **Sale** listings gate install behind checkout. Free listings stay one-click. Platform fee is **5%** of list price (`PLATFORM_FEE_BPS = 500`); Dodo processor estimate is separate; seller net = price \u2212 Dodo \u2212 platform.\n\nAfter pay, fulfilment mints an unguessable `unlock_token`, emails the install link (Resend when configured), and `/unlock/{token}` shows install to that buyer. Unpaid Sale must not expose Add to Grok Bot, Open in Grok, View/Copy x.ai, or x.ai/grokbot URLs in HTML/JSON; marketplace share (`?bot=` / `/bot/{id}`) stays public. Buy is the only primary CTA until unlock.\n\n**Why:** Unpaid buyers must not get install paths. Paid buyers need a durable delivery path without relying on a signed-in session alone. Owners need the fee split visible on submit, dashboard, earnings, and pricing.\n\n**How to apply:**\n- Omit install URLs from HTML, preview, list payloads, `getTemplate`, `clickAndRedirect`, and `/llms.txt` unless the viewer is the owner, has a completed purchase, or holds a valid unlock token.\n- Buyers start Dodo checkout (`createBuyCheckout`); demo/unsigned users get a visible alert instead of an install control.\n- Product page: left card is the bot (no install until paid); right panel is Unlock this bot (Buy). After unlock, Add is on the left card and Buy is gone.\n- Show shared owner fee breakdown (buyer pays / Dodo / platform 5% / you keep) on submit, dashboard, earnings, and pricing.\n- Keep `/terms`, `/pricing`, FAQ, and `/llms.txt` aligned with pay-to-unlock, email + unlock URL delivery, and the 5% split.\n- Prove with `.cursor/skills/verify-templatebot` feature `pay-to-install.md` and local D1 fixture `features/fixtures/paid-demo.sql` (Night Counsel). Leave Renovate Dependency Dashboard #6 alone.", "project-templatebot-verify-skill": "templatebot ships `.cursor/skills/verify-templatebot` (CLI lever + Feature Map + one proven drive). Primary surface is the local Vite/Cloudflare marketplace driven over Chrome DevTools Protocol via `control-templatebot.mjs`.\n\n**Why:** `main` had no Playwright/Cypress suite and no verify skill. Agents need a composable launch/doctor/drive loop before feature ships.\n\n**How to apply:**\n- Use `control-templatebot.mjs` (`launch` / `doctor` / `goto` / drive / `cleanup`; `--json`, `--dry-run` on launch/stop/cleanup).\n- Feature map covers browse (incl. `browse-page` 30-per-page from D1 on `/` and `/templates`; `browse-marquee` above the footer; coat-blend card surfaces via `surface-bot-card` / `botCardTint` in light+dark), preview (incl. `preview-scroll`), submit (incl. resubmit / history / X collect; post-submit Leaderboard vs Paid Template equal choices), leaderboard, dashboard, unlisted `/data` analytics (`features/data.md`), PostHog official JS funnel (`VITE_POSTHOG_PROJECT_TOKEN` env-only), pay-to-install (Sale; email + `/unlock/{token}`; `paid-demo.sql` / Night Counsel), MCP publish (`features/mcp-publish.md`), and live X embeds with corner clip (`features/on-x-posts.md` `on-x-embed-corners`: `#15202b` fill + 12px `--background` radial `::after` caps). Viewport presets: mobile 375\u00d7812 / desktop 1280\u00d7800.\n- Proven drive: browse \u2192 Harvey search \u2192 Harvey Specter preview \u2192 `Close --exact`, then assert `scrollY` holds (no jump-to-top).\n- `Close` needs `--exact` (Harvey card name includes `disclose`). Hero Browse is role button; clear search via `goto /templates`.\n- Live paywall copy is `Checkout unlocks the install link` (not `unlock the install link`); `/unlock/{token}` sets `tb_unlock` so unpaid recipes must run first; `/privacy` shares terms email+unlock copy (`docs-terms`).\n- Local vite skip HTTP\u2192HTTPS redirect on loopback so doctor sees real HTML.\n- Later ships: `/poteto-mode` plus this skill. Refresh with `/maintain-verification-skill` on ship. Cloud agents only; no git worktrees.\n\nGeneric loop: [[feedback-pstack-verification]].\n\n**2026-09-03:** Squash-merged [#65](https://github.com/duyet/templatebot/pull/65) (`fd72151`) after [#45](https://github.com/duyet/templatebot/pull/45) `/data` ship \u2014 Feature Map now covers unlisted `/data`, PostHog funnel, multi-bot X collect on main.\n**2026-09-03:** Squash-merged [#83](https://github.com/duyet/templatebot/pull/83) (`827735a`, closes #79) \u2014 Collecting N of M / skip-or-claim already-listed; then [#80](https://github.com/duyet/templatebot/pull/80) (`4bed5db`, closes #73) master-detail picker; [#85](https://github.com/duyet/templatebot/pull/85)/[#86](https://github.com/duyet/templatebot/pull/86) folded verify map (Publish N bots, Skip rows, marquee above FOOTER not H1).\n**2026-09-03:** Squash-merged [#76](https://github.com/duyet/templatebot/pull/76) (`4aeac0a`, closes #70) \u2014 `/on-x` and homepage On X use official live X/Twitter embeds (`widgets.js`), not homemade URL cards.\n**2026-09-03:** Squash-merged [#82](https://github.com/duyet/templatebot/pull/82) (`e1db213`, closes #74/#75) \u2014 Deploy applies remote D1 migrations before wrangler deploy; submit/`/data`/MCP hide SQLITE dumps; Feature Map notes migrate-on-deploy + SQLITE-hide.\n\n**2026-09-03:** Squash-merged [#62](https://github.com/duyet/templatebot/pull/62) (`bcbb2f4`) \u2014 indexed Top 5 Grok Bots roundup from kloss_xyz (`/blog/26-grok-bots`); Feature Map `kloss-26-grok-bots.md` shipped in the same PR.\n**2026-09-03:** Squash-merged [#81](https://github.com/duyet/templatebot/pull/81) (`8cc9481`, closes #69) \u2014 `/api` and `/mcp` are interactive product pages (try-it route/tool cards, copy curl, live 401 / discovery JSON); Feature Map `docs-api-mcp.md` shipped in the same PR.\n**2026-09-03:** Squash-merged [#88](https://github.com/duyet/templatebot/pull/88) (maintain-verification after live drive on default VM; folds #82 migrate-on-deploy / SQLITE-hide plus post-#78 footer marquee map honesty).\n**2026-09-03:** Squash-merged [#103](https://github.com/duyet/templatebot/pull/103) (`cfcffff`, maintain-verify after #101) \u2014 browse paging recipes proven live: verification-only `features/fixtures/browse-page.sql` (31 rows), Next/Previous are links when enabled, page-2 proof via count line / `page=2` (not Harvey text/marquee), out-of-range clamps to last page, invalid `page` omits param.\n**2026-09-03:** Squash-merged [#101](https://github.com/duyet/templatebot/pull/101) (`438429a`) \u2014 public `/` and `/templates` page at 30 from D1 (`LIMIT`/`OFFSET` + count); Feature Map `browse-page` shipped in the same PR.\n**2026-09-04:** Squash-merged [#107](https://github.com/duyet/templatebot/pull/107) (`a0cdd78`) \u2014 clip X embed rounded-corner canvas leak; Feature Map `on-x-embed-corners` shipped in the same PR.\n**2026-09-04:** Squash-merged [#108](https://github.com/duyet/templatebot/pull/108) (`80a4c81`, maintain-verify after #104) \u2014 preview dialog locked to `sm:max-w-xl` (576px / ~351px inset at 375); chrome nav MCP leftover corrected to API; demo Buy empty-Dodo alert aligned with pay-to-install.", "lessons-chmonitor-homelab-deploy": "# Lessons \u2014 chmonitor on homelab k3s\n\n## Two different instances (do not conflate)\n\n| Instance | Purpose | Data |\n|----------|---------|------|\n| **Public Cloud/demo** (`dash.chmonitor.dev`) | SaaS + limited public demo | Limited tables, intentionally constrained |\n| **Homelab self-host** (private Traefik + OAuth) | Full cluster ops UI | All DBs/schemas; expected higher metrics volume |\n\nHomelab is supposed to \u201cshow more performance\u201d \u2014 that is normal, not a bug vs public.\n\n## Image (2026-08)\n\n- **Canonical:** `ghcr.io/chmonitor/chmonitor:latest` (`imagePullPolicy: Always`)\n- **Stale:** `ghcr.io/duyet/chmonitor:latest` \u2014 no longer receives CI builds; redeploy pulls same old digest forever\n- Helm chart repo: `https://charts.chmonitor.dev` (chart `chmonitor`); source repo moved to `chmonitor/chmonitor`\n\n## ClickHouse user for the dashboard\n\n- Use a **dedicated user** with **privilege-based** read-only: `GRANT SELECT, SHOW, dictGet ON *.*` (or narrower), not the server **`readonly` settings profile** (`readonly=1`).\n- chmonitor always sets **`max_execution_time`** as a **session setting** on the client. With `readonly=1` ClickHouse returns:\n\n  ```text\n  Cannot modify 'max_execution_time' setting in readonly mode\n  ```\n\n  \u2192 `/api/healthz` fails \u2192 readiness 503 \u2192 pod never Ready.\n- Prefer a normal/`monitoring` profile + grants. Homelab pattern: user `chmonitor` + role with SELECT/SHOW on all DBs.\n\n## Auth (homelab)\n\n- Behind Traefik **forwardAuth** + oauth2-proxy (GitHub via Dex). See [[tech-forwardauth-preserve-status]].\n- chmonitor-scoped middleware stamps a **shared secret** header (`X-Chm-Proxy-Secret`); app trusts identity headers only when secret matches (`CHM_AUTH_PROVIDER=proxy` or `trusted` depending on image).\n- Unauthenticated external hit \u2192 **302** to the auth portal is expected.\n\n## Ops checklist\n\n1. Confirm image is `ghcr.io/chmonitor/chmonitor:\u2026` and pull/restart after new builds.\n2. Confirm CH user can run `SELECT 1 SETTINGS max_execution_time = 60`.\n3. Confirm `/api/healthz` reports host `up` and tables/overview APIs return full schema count.\n4. Do not use public-demo connection limits as the model for homelab grants.\n\n**Why:** future agents diagnose \u201cchmonitor down\u201d or \u201cempty schemas\u201d without mixing public SaaS and private cluster, and avoid the readonly-profile trap.\n**How to apply:** when redeploying or debugging homelab chmonitor, check image org + CH profile first; grant schema via SQL privileges, not `readonly=1`.", "reference-ai-sdk-uimessage": "Vercel AI SDK `UIMessage` = `{id, role, parts[], metadata?}`. Renderer switches on `part.type` and drops unknowns.\n\nNative tool parts: `dynamic-tool` / `tool-${name}` with `{state, input, output}`.\nSee [[tech-ai-sdk-history-dto-convert]], [[tech-ai-agent-stack]].", "reference-cloudflare-acquires-astro": "Cloudflare acquired The Astro Technology Company (announced 2026-01-16). Astro stays open source.\n\nFlue (`withastro/flue`) is from that team post-acquisition. Related: [[tech-flue-register-in-initializer]], [[user-duyet-infra-cloudflare]].", "reference-duyet-blog": "Themes by volume: ClickHouse \u00b7 Rust \u00b7 AI agents \u00b7 data eng (Airflow, DuckDB) \u00b7 tooling.\n\nSite: [[user-duyet-site-blog]]. Stance: [[user-duyet-ai-stance]]. Focus: [[user-duyet-focus-clickhouse]].", "reference-duyet-github": "Notable public repos (non-exhaustive):\n\n| Area | Repos |\n|------|-------|\n| ClickHouse | [[project-clickhouse-monitoring]], `clickhouse-udf-rs` |\n| LLM / agents | [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]] |\n| Web | [[project-monorepo]], [[project-kb]] |\n| Homelab / infra | [[project-homelab]], [[project-charts]], `gaxy` |\n| Older popular | `bruteforce-database`, `pricetrack` |\n\nHub: [[user-duyet-github]]. Stack: [[user-duyet-stack]].", "reference-gh-actions-concurrency-pending-cancel": "`cancel-in-progress: false` does **not** mean \"no run is ever cancelled\". GitHub\nkeeps one *running* plus one *pending* run per concurrency group, and **a third\narrival cancels the pending one**. Merge three PRs in a minute and the first two\n`master` runs are dropped before they start.\n\nThe workflow comment usually only describes the half that is prevented (\"a running\nbuild is not killed mid-push\") and calls the limit \"at most one run + one pending\nrun per ref\" without mentioning the eviction. It reads like a guarantee.\n\n**Why it bites harder than it looks:** if the build matrix is filtered with\n`dorny/paths-filter` and only push-to-main runs publish (`push:\n${{ github.event_name != 'pull_request' }}`), then the surviving newer run does\n**not** rebuild the earlier merge's images. The PR proved the image builds and\nnothing ever pushed it. Published tags silently lag the branch, and every check\nin the repo is green. Observed 2026-09-28 in duyet/docker-images: `minio_latest`\non master said alpine 3.24 while the registry still served 3.20.10, digest\nunchanged from the day before.\n\n**How to apply:**\n\n- Never accept \"the cancelled run has a newer green replacement\" as a dismissal\n  unless the replacement's path filter provably covers the same images.\n- After a burst of merges, verify the **published** manifest, not the workflow\n  status: read the digest, `created` timestamp, and inherited build history\n  (`ADD alpine-minirootfs-<ver>-\u2026` in the amd64 config blob names the actual base)\n  for every image the merges touched.\n- Remediate by re-running the cancelled run, but only once the group has a free\n  pending slot \u2014 rerunning while a run is pending evicts that one and jus
