t moves\n  the gap.\n- Durable fixes: drop the concurrency limit for push events, make the push run\n  cumulative, or assert the published base in CI. Cause fix plus a detection\n  check; either alone leaves the other hole.\n- Related: [[reference-herdr-child-dispatch-verify]].", "reference-herdr-child-dispatch-verify": "A `herdr agent prompt` carrying a long brief (~150+ lines) can be delivered to an\nopencode child's TUI as a **bracketed paste that is never submitted**. The\ncomposer sits there showing `[Pasted ~158 lines]`, the agent stays `idle`, and\n`agent prompt` still returns `{\"type\":\"agent_prompted\"}` with no error.\n\nShort prompts of the same shape submit normally. Observed 2026-09-28 managing\ndocker-images worktree children.\n\nThe failure is silent because **`idle` is ambiguous**: it is the state of a child\nthat was never addressed *and* of one that is thinking, or done, or waiting its\nturn. A manager's notes saying \"Dispatched\" plus a live worktree plus an idle\nagent all look identical to a healthy run.\n\n**Why:** a whole run can be lost without a single error. In that run the entire\ntick reduced to one changed line, so the loss was total and the checklist still\nread \"Dispatched\" with every box unticked.\n\n**How to apply:**\n\n- Put the brief in a file in the run directory (`brief-<child>.md` next to\n  `queue.md`); prompt with one or two sentences plus the absolute path. Short\n  prompts don't stall, and a file brief makes a re-prompt one line.\n- After prompting, confirm the lifecycle actually moved:\n  `herdr agent get <name>` must show `working` and a bumped `revision` within\n  seconds. Unchanged `revision` means the prompt did not land.\n- `herdr pane read <pane> --source visible` shows an unsent paste immediately.\n- Clear a stuck composer with `herdr agent send-keys <agent> ctrl+u` before\n  re-prompting, so the next submit does not concatenate with the dead paste.\n- Related: a server restart can kill a child's shell tool mid-turn. Its staged\n  work survives \u2014 check `git status` in its worktree before assuming a loss, then\n  re-prompt; staged work only needs `git commit` and a push.", "reference-machine-duet-ubuntu": "# Dev machine: `duet-ubuntu`\n\nPrimary Linux workstation. Confirmed 2026-09-27.\n\n## Machine\n\n- hostname `duet-ubuntu` (FQDN same), user `duyet`\n- Ubuntu 24.04.4 LTS, kernel 6.8.0-138, x86_64\n- uptime at capture: 3 weeks\n\n## Herdr\n\nTerminal multiplexer; agents run in panes. Every control command requires\n`HERDR_ENV=1` or it must be refused. `herdr` v0.9.0.\n\n- Workspaces are labelled per repo; the repo path is the workspace\n  `worktree.checkout_path`, so a repo can be found by path rather than label.\n- `herdr plugin action invoke <plugin>.<action>` resolves the **focused**\n  workspace, not the caller's cwd. A `status`-style action invoked from repo A\n  can therefore report repo B.\n\n## Local repos\n\n| Repo | Path |\n|---|---|\n| aidr | `/home/duyet/project/aidr` |\n| herdr-desk | `/home/duyet/project/herdr-desk` |\n| chmonitor | `/home/duyet/project/chmonitor` |\n| monorepo | `/home/duyet/project/monorepo` |\n| anyrouter | `/home/duyet/project/anyrouter-dev/anyrouter` |\n\nHerdr worktrees live under `/home/duyet/.herdr/worktrees/<repo>/<branch>`.\n\n## Stale credentials (as of 2026-09-27)\n\nEvery one of these was valid once and now fails; do not trust them without\nre-probing:\n\n- `CLOUDFLARE_API_TOKEN` \u2014 Cloudflare `1000 Invalid API Token`. Blocks local\n  `pnpm sync-env --workers` and `wrangler deploy`. **GitHub Actions still\n  deploys fine**, so the copy in repo secrets is good \u2014 only the local one is\n  dead. Symptom: `wrangler whoami` \u2192 `9109 Invalid access token`.\n- `CLERK_SECRET_KEY` (in `aidr/.env.local`) \u2014 was `401` from `api.clerk.com`\n  after being rotated.\n- `NEWS_ADMIN_TOKEN` (in `aidr/.env.local`) \u2014 no longer matches the Worker's\n  copy, so `POST /api/admin/clerk-sync` returns `{\"error\":\"unauthorized\"}`.\n- `TELEGRAM_BOT_TOKEN` (in `aidr/.env.local`) \u2014 well-formed but revoked;\n  `getMe` returns `401`.\n\nLesson: on this box, verify a credential against its provider before assuming a\ncommand failed for another reason. See `aidr`'s `.cursor/skills/aidr-ops`\n(`preflight`) which automates exactly these checks.\n\n## Secrets tooling\n\n- `scripts/sync-env.ts` spawns wrangler with `env: process.env`, so a token that\n  lives only in `.env.local` never reaches it. Unfixed upstream.\n- `herdr-desk` gained a host-level `notify.json`\n  (`~/.config/herdr/plugins/herdr-desk/`) for Telegram, deliberately outside\n  any repo so tokens are never committed.", "tech-automation-gate-vacuous": "A CI job that runs a per-package orchestrator (`turbo run lint`,\n`nx run-many -t lint`) lints **only the packages that define that script**. If\nnone do, the job passes on an empty task list and reports success over thousands\nof files. It is green, fast, and worthless.\n\nPaired failure: the local pre-push hook runs a *stricter* command than CI\n(`biome check` = lint + format + assist, vs CI's `biome lint`, which never\nreports `assist/source/organizeImports`). Drift then lands through any green PR\nuntil the hook rejects **every** push, including unrelated ones \u2014 so everyone\nstarts using `--no-verify` and the gate is fully disarmed.\n\n**Why:** the two gates are written independently and never compared, so the\nstricter one becomes the thing everyone bypasses, and the looser one provides\nfalse assurance. Neither is a bug in either command; the bug is the divergence.\n\n**How to apply:**\n\n- Audit every \"green\" gate by asking *what does it actually execute?* Check that\n  the task exists in at least one package, or that it is not a per-package\n  orchestrator.\n- **Run the identical command locally and in CI.** One command, two places.\n  When they must differ, make CI the superset and say why in a comment.\n- The moment a hook needs `--no-verify` to be productive, the hook is wrong.\n  Treat the first `--no-verify` as a defect report, not a convenience.\n- Before \"fixing\" a newly-armed gate that flags a wall of unrelated files,\n  autofix in a dedicated change \u2014 do not widen the ignore list.\n- Check a stricter tool covers what CI runs before assuming CI is green: a\n  formatter/import-order rule that only `check` reports is invisible to `lint`.\n\nSee also [[feedback-main-ci-green-fast]], [[feedback-fail-loud]].", "tech-cli-report-assemble-from-root": "`scripts/cli-build-report.sh --assemble` reads matrix JSON from the **workspace download dir** (CI: `cli-report-metrics` at the repo root).\n\n- Resolve `--assemble` / `--report` / `--out` from the repo root\n- Only `cd rust/` for the crate build path\n- Relative `--assemble cli-report-metrics` (same as the workflow) must work from root\n- `cd rust/` first makes the assemble step miss the artifacts (`no metrics json`) even when all matrix builds uploaded\n\nRelated: [[tech-pin-github-actions]], [[project-chmonitor-cli-local-connections]].", "tech-codexbar-new-provider-is-a-plugin": "A **new** CodexBar provider is a declarative `PluginProviderSpec` plus one bundled TypeScript plugin. It is not bespoke Swift. Simple API-key providers were migrated during the 0.68 cycle (`refactor(plugins): add declarative API-key provider builders`, `migrate simple API-key providers`).\n\nThe whole provider is: `case <id>` in `UsageProvider`; a `<Name>ProviderDescriptor.swift` declaring `id: .<id>,` with `public static let spec = PluginProviderSpec(` **and** `apiKeyField: .init(`; `<id>.ts` + its transpiled `<id>.js`; the icon SVG. That is roughly 25 lines of Swift.\n\n**Why:** `Scripts/regenerate-provider-manifests.sh` reads the enum order plus the descriptor's shape and generates the descriptor manifest, the implementation manifest, `ProviderInstanceIDAliases.generated.swift`, and `docs/provider-ids.md`. Having both `spec` and `apiKeyField` makes the script emit `PluginAPIKeyProviderImplementation(spec: X.spec)`, so **no `ProviderImplementation` file is needed at all**.\n\n**How to apply:**\n- Run `Scripts/regenerate-plugin-js.sh` and `Scripts/regenerate-provider-manifests.sh`; both have a `check` mode that CI enforces.\n- In a plugin `.ts`, `catch (error) { void error; ... }` \u2014 sucrase rewrites the optional catch binding and oxlint's `no-unused-vars` then fails on the result. Annotate parameters; the `.ts` is type-checked.\n- `ctx.format.usd()` is native en_US currency formatting, so money rows are exact \u2014 write literal expectations in tests.\n- Adding a provider also needs: `BurnProviderChoice` (asserted exhaustive), the `balanceOnly`/fingerprint constants in `ProviderArchitectureGatekeeperTests`, the advertised provider count (87 -> 88) across 7 files including 23 site locales, a `docs/index.html` provider card, and a re-rendered `docs/social.png`.\n- The `plugin-provider-specs.json` golden covers a **curated** 31-provider list, not every provider, so a new provider need not be added.\n- CI runs `ubuntu-24.04` with **Swift 6.3.3**; `CodexBarPluginTests` (`TestsPlugin`) and `CodexBarLinuxTests` run there, but `Tests/CodexBarTests` is macOS-only.\n\nGatekeeper fingerprints can be recomputed off-macOS: `ProviderDescriptorRegistry` lives in `CodexBarCore`, so a throwaway test in `TestsPlugin` can run the test's own hash over the registry and print the new constants. Verified: the untouched `debugLogUnavailableMessage` fingerprint reproduced its committed value exactly.\n\nDecline history: [[project-anyrouter-codexbar-declined]].", "tech-helm-vendored-deps-gitignore": "Helm repos that vendor dependencies must commit `charts/*.tgz` per chart. A\nbare `charts/` line in `.gitignore` matches **every** chart's dependency dir\n(chart repos rarely have a top-level `charts/` dir), so `helm dependency\nbuild` works locally but tarballs are silently never committed. Committed\n`Chart.lock` + missing `charts/` is the tell. Published packages look fine\nwhen CI builds deps before packaging \u2014 only source clones break.\n\n**Why:** `helm template`/`lint`/`install` fail out of the box (\"found in\nChart.yaml, but missing in charts/ directory\") with no visible cause.\n\n**How to apply:** anchor the ignore (e.g. `/charts/`) or delete it; commit\nvendored tarballs via `helm dependency build` and verify with a fresh-clone\n`helm template`. Vendor rather than drop declarations when templates\nreference default endpoints like `{{ .Release.Name }}-<dep>`. Related:\n[[project-charts]], [[feedback-fail-loud]].", "tech-pin-github-actions": "Actions run with repo secrets. Prefer `@vX.Y.Z` or commit SHA pins; avoid floating `@v0`.\n\nIncident reference: trivy-action tags force-pushed (2026). Related: [[tech-trivy-two-phase]], [[feedback-public-kb-only]].", "tech-release-please-basics": "release-please maintains a release PR and CHANGELOG from conventional commits. Merging releases tags/publishes.\n\nPrefer release-published workflows over raw tag push to avoid duplicates. Related: [[tech-release-please-pr-title]], [[feedback-never-auto-merge-release-please]].", "tech-release-please-pr-title": "Invalid PR titles are silently dropped from bumps. Guard titles with the same commitlint config as local hooks.\n\nRelated: [[tech-release-please-basics]], [[feedback-semantic-commits]], [[tech-release-please-pre1-minor]].", "tech-release-please-pre1-minor": "In 0.x, `bump-patch-for-minor-pre-major: true` makes plain `feat` \u2192 patch (`feat!:` or BREAKING CHANGE for minor). Set it **false** (keep `bump-minor-pre-major: true`) if 0.x should move `0.1` \u2192 `0.2` on each feature release.\n\nRelated: [[tech-release-please-basics]], [[tech-release-please-pr-title]].", "tech-squash-merge-hides-branch-cleanup": "Merged-branch cleanup based on `git cherry` or patch-id silently fails in a repo\nthat squash-merges, because a squash rewrites every patch-id. Landed branches\nthen look unmerged forever and are never cleaned up.\n\n**Why:** release-please plus squash PR titles means the PR title is the release\ncommit, so squash is the norm rather than the exception. In `duyet/herdr-desk`\nthis left three dead branches looking live, and made `git log main..branch`\nreport six already-landed commits as pending.\n\n**How to apply:** treat the forge as the authority, not patch-id. A branch is\nspent only when it has at least one **merged** PR *and* no open PR. The \"at\nleast one\" clause is the load-bearing part: an empty PR list means *unknown*,\nnot *all merged*, and treating it as merged deletes in-flight work that was\npushed but not yet proposed \u2014 which in a shared working tree can be another\nagent's branch. Keep `git cherry` only as a backstop for forge lag.\n\nSkip the base branch, forge-managed release branches, and any branch pattern\ncreated at runtime. Pair it with a scheduled workflow, dry-run by default.\n\nA diff against the base is still the tie-breaker when a squash makes hashes\ndiverge: if moving from `main` to the branch is mostly deletions, the branch is\nbehind, not ahead.", "tech-trivy-two-phase": "Phase 1: scan with exit 0 for artifacts. Phase 2: fail on CRITICAL/HIGH, ideally reusing setup.\n\nRelated: [[tech-pin-github-actions]], [[tech-codebase-maintenance-loop]].", "tech-access-missing-app-fails-open": "Cloudflare Access enforcement lives in the **Access application**, not in the client.\nIf the application is missing \u2014 deleted, or never recreated after an account move \u2014\nthe hostname is served **without any check at all**.\n\n**Why it hides:** well-behaved clients keep sending `CF-Access-Client-Id` /\n`CF-Access-Client-Secret`. Requests succeed, dashboards look normal, no error is\nlogged anywhere. The credentials are present; nothing is verifying them. An origin\nwhose only remaining defence is its own application password is now on the open\ninternet.\n\n**Detection** \u2014 one unauthenticated request:\n\n```\ncurl -sI https://<host>/     # expect 302 -> <team>.cloudflareaccess.com, or 403\n```\n\nA `200` means there is no Access app in front. Service tokens are account-scoped, so\nafter an account migration the old token id is meaningless on the new account even\nthough clients still transmit it.\n\n**Verify both directions.** Proving the gate blocks anonymous traffic says nothing\nabout whether it still admits the legitimate client. Check the pair:\n\n| Request | Expected |\n|---|---|\n| no credentials | `302` / `403` |\n| app credentials, no Access headers | `302` / `403` |\n| app credentials **+** Access headers | `200` |\n\n**Ordering when rotating Access credentials:** create them \u2192 propagate to every client\n(Worker vars, secrets, `.env`) \u2192 **then** create or update the Access application.\nReversed, every client is locked out for the length of the gap. That matters most\nwhere the client fails open by design (backup/telemetry sinks that swallow errors):\nthe data silently stops arriving instead of raising anything.\n\n**A wildcard app covers subdomains, but a more specific app wins.** Before relying on\n`*.example.com` to protect a new hostname, confirm no narrower app exists for it.\n\nRelated trap: a token that lacks read scope on `access/identity_providers` or on the\n`access/apps/{id}/policies` sub-resource returns an **empty list rather than 403**, so\n\"no identity providers configured\" and \"cannot see them\" are indistinguishable.\nPolicies are readable inline from the `access/apps` list response. And Access's\nbuilt-in email one-time-PIN needs **no** identity provider object at all, so an empty\nprovider list does not mean login is broken.", "tech-cloudflare-ai-gateway-transparent": "AI Gateway routes by provider/prefix and forwards model strings. \"Invalid model ID\" is usually upstream or unknown provider prefix.\n\nCustom providers: base URL + slug; model path appended. Related: [[project-anyrouter]], [[tech-llm-gateway-quota-as-retryable]].", "tech-cloudflare-cron-triggers-five-per-account": "Cloudflare caps Worker `[triggers] crons` at **5 per account**, not per Worker. Shared accounts fill the slots fast. Deploy error is `10072 \u2014 You have exceeded the limit of 5 cron triggers`.\n\nOmitting the `triggers` block does **not** clear an existing cron. Emit `\"triggers\": { \"crons\": [] }` (or PUT `[]` to the schedules API) to release a slot. Workflow binding `schedules` are a different product and paid-only ([[tech-workflows-binding-schedules]]). Durable Object `alarm()` is another Free-safe scheduler and does not use a cron slot ([[tech-durable-object-alarms-not-cron]]).", "tech-cloudflare-email-transactional-not-bulk": "Cloudflare Email Sending (Workers `send_email` binding or REST) is **transactional** \u2014 receipts, password resets, one-off lifecycle mail. Marketing and multi-thousand blasts are out of scope.\n\nBulk sends hit `E_RATE_LIMIT_EXCEEDED` / `E_DAILY_LIMIT_EXCEEDED` (or silent rejects) after a small successful prefix. Check `GET /accounts/{id}/email/sending/limits` before a large send. Use a dedicated ESP for campaigns.\n\nDocs: [Email Service](https://developers.cloudflare.com/email-service/). Related: [[tech-cloudflare-workflows-reset-on-code-update]].", "tech-cloudflare-pages-deploy": "Habit: commit \u2192 push \u2192 deploy the changed Pages app \u2192 verify HTTP 200.\n\nHazard: scripts that rename local env files mid-deploy must not run in parallel.\nRelated: [[tech-tanstack-start-ssg]], [[project-monorepo]], [[feedback-semantic-commits]].", "tech-cloudflare-workflows-reset-on-code-update": "A Cloudflare Workflow instance is a Durable Object. Deploying new code for the **host Worker** resets that DO. The instance fails with `Durable Object reset because its code was updated`.\n\nList or wait for instances (`wrangler workflows instances list`) before deploying the host. Do not treat a new instance as a clean retry of side effects already written by the old run.\n\nRelated: [[tech-workflows-binding-schedules]], [[tech-cloudflare-cron-triggers-five-per-account]].", "tech-d1-insert-returning-not-a-write": "Cloudflare D1 treats `INSERT`/`UPDATE` as writes. `stmt.first()` is a read helper and comes back empty for those statements even with `RETURNING`. A persist path that gates success on the RETURNING row will fail-closed after the write never looks persisted.\n\nWrite with `D1PreparedStatement.run()` (or `D1Database.batch()` of prepared statements), then confirm with a later `SELECT`. Do not widen `batch()` on a local D1 wrapper to a broader union \u2014 `Env.DB.batch` is `D1PreparedStatement[]` only and a wider type makes the binding unassignable.\n\nDocs: [D1 Database API](https://developers.cloudflare.com/d1/worker-api/d1-database/).", "tech-durable-object-alarms-not-cron": "Cloudflare Durable Object `alarm()` wakes a DO at a chosen time. Alarms are **not** Worker `[triggers] crons` and do **not** count toward the account-wide 5-cron cap ([[tech-cloudflare-cron-triggers-five-per-account]]).\n\nWorkflow binding `schedules` are a different product and paid-only ([[tech-workflows-binding-schedules]]). On a Free plan, a DO alarm (or an external GitHub Actions POST) can start periodic work without a sixth Worker cron or a paid Workflow schedule.\n\nDocs: [Durable Object Alarms](https://developers.cloudflare.com/durable-objects/api/alarms/).", "tech-forwardauth-preserve-status": "When Traefik forwardAuth + OAuth2 Proxy sit behind error middleware, ensure 302 challenges are not replaced by generic error pages.\n\nPattern: explicit redirect path for auth challenges. Generic edge auth lesson \u2014 no private hostnames.", "tech-workers-cache-enabled": "Workers Cache sits in front of a Worker. Enable: `cache: { enabled: true }` in wrangler.\n\nSafe default: only responses with explicit public `Cache-Control` are stored. Auth headers auto-bypass.\nSee [[tech-workers-cache-swr]], [[tech-workers-cache-hit-skips-cpu]].", "tech-workers-cache-hit-skips-cpu": "A cache HIT is served from the edge tier without invoking the Worker isolate.\n\nGreat for SSR-as-origin frameworks. Enable carefully with public CC only: [[tech-workers-cache-enabled]].", "tech-workers-cache-swr": "Use `Cache-Control: public, max-age=\u2026, stale-while-revalidate=\u2026` so users rarely wait on origin re-render.\n\nPair with [[tech-workers-cache-enabled]], [[tech-workers-cache-tags]].", "tech-workers-cache-tags": "Set `Cache-Tag` on responses; purge by tag after content updates.\n\nRelated: [[tech-workers-cache-enabled]], [[tech-workers-cache-swr]].", "tech-workflows-binding-schedules": "Cloudflare Workflows accept `schedules` on the binding. Each tick starts a Workflow instance. That does **not** use Worker `[triggers] crons` (Free accounts cap those).\n\n`schedules` itself is paid-only. On a Free plan, `wrangler deploy` can upload the Worker then exit 1 attaching the schedule. The Worker may stay live; CI still goes red.\n\nOn Free: trigger the Workflow from a Durable Object alarm ([[tech-durable-object-alarms-not-cron]]), GitHub Actions, or another external cron \u2014 not from `workflows[].schedules` and not from Worker crons. Docs: [Trigger Workflows](https://developers.cloudflare.com/workflows/build/trigger-workflows/). Related: [[tech-cloudflare-pages-deploy]], [[project-news]].", "tech-zone-account-transfer-breaks-worker-routes": "Moving a zone to another Cloudflare account (including a Registrar inter-account\ntransfer) copies **DNS records** but **not** Worker routes or Workers Custom Domains.\n\n**Failure mode:** every proxied hostname returns `403` / **Error 1000 \"DNS points to\nprohibited IP.\"** The copied proxied A records point at Cloudflare anycast IPs. On the\nold zone those were never used as an origin because Worker routes intercepted first;\non the new zone, with no routes, Cloudflare tries to reach that \"origin\", sees its own\nIP, and refuses. **Routes are what make those placeholder A records harmless.**\n\nChecklist when moving a Workers-backed zone:\n\n| Item | Carries over? |\n|---|---|\n| DNS records (A/CNAME/MX/TXT) | yes |\n| Worker routes | **no \u2014 recreate** |\n| Workers Custom Domains | **no** |\n| Custom rulesets (transform/cache rules) | **no** |\n| Email Routing rules | **no** \u2014 and destination addresses must be re-verified first, else `2054` |\n| Zone id | **changes** \u2014 re-point every hardcoded reference and re-issue zone-scoped API tokens |\n\nGotchas:\n\n- An **apex** declared `custom_domain: true` is not matched by a `*.example.com/*`\n  route. Creating the Custom Domain fails while leftover apex A records exist\n  (`already has externally managed DNS records`); delete them first.\n- Records that are **CNAMEs to a third party** (e.g. an auth provider's satellite\n  domain) can silently disappear into a `*` wildcard A record \u2014 every name still\n  resolves, so nothing looks broken while the integration is down. Diff the old and\n  new zone by querying **each nameserver set directly** with `dig @<ns>`, not by\n  checking whether a name resolves.\n- Registrar transfers lock the registration for **30 days** \u2014 no rollback in that\n  window at any price.\n- A tunnel is **not** transferable: create a new one on the destination account and\n  repoint the connector. Its ingress is readable from the API when the tunnel is\n  remotely managed, so it can be replicated exactly without any node access.\n- Verify resource ids (D1/KV/secrets-store) against the **live destination account**\n  before substituting them; a recorded config file is a record of intent, not proof.", "tech-qdrant-config-at-create": "Don't assume live config edits always apply retroactively. Prefer correct create params; use `update_collection` when supported.\n\nRelated: [[tech-qdrant-hnsw-timeout]].", "tech-qdrant-hnsw-timeout": "High-dimension float32 collections can devolve to expensive scans. Tune HNSW + consider INT8 quantization.\n\nConfig timing: [[tech-qdrant-config-at-create]]. Related: [[tech-rag-metadata-key-drift]].", "tech-debian-13-apt-node-20": "Debian 13 `apt` `nodejs` is **20.x**. Wrangler 4 refuses to start below **22.0.0**. Do not replace the apt package \u2014 other Debian `node-*` packages depend on it.\n\nTo make Node 22 the system default:\n\n1. Extract the official `node-v22.*-linux-x64.tar.gz` from nodejs.org into `/usr/local` (`--strip-components=1`). `/usr/local/bin` is already first on the default PATH.\n2. `dpkg-divert --local --divert /usr/bin/node.distrib --rename /usr/bin/node` then `ln -sfn /usr/local/bin/node /usr/bin/node`. Cron/systemd `PATH=/usr/bin:/bin` and `#!/usr/bin/node` then get 22. Debian 20 stays at `/usr/bin/node.distrib`.\n3. Prefer the `.tar.gz` if `xz-utils` is missing. Verify `SHASUMS256.txt`.\n\nAfter this, `node -v` and `/usr/bin/node -v` are 22; `npm`/`npx` come from `/usr/local/bin`.", "tech-disk-swap-not-extra-ram": "Swap is spill, not capacity. Pages come back 100\u20131000\u00d7 slower than RAM. A large **disk** swapfile lets the kernel thrash (SSD busy, allocators stall, NIC/watchdog look dead) instead of killing a fat process.\n\nOn a small always-on Linux box (k8s + DB + agents):\n\n- Prefer **2\u20134 GiB zram** (compressed, memory-speed) for short spikes.\n- Do **not** add a swapfile \u2265 RAM on the same NVMe as the OS/DB.\n- Pair with `earlyoom` / kubelet eviction that fire **while swap still exists**. Huge swap delays that signal.\n\nMore swap is useful for hibernate or parking idle desktops. It is a trap when the working set already exceeds RAM and the host must stay reachable.\n\nRelated: [[user-duyet-homelab]] (keep topology out of kb \u2014 [[feedback-public-kb-only]]).", "tech-agentstate-five-primitives": "[[project-agentstate]] exposes five fleet primitives: **states**, **leases**, **claims**, **capability tokens**, **conversations**.\n\nUse when multi-agent systems need shared state/locking/delegation without reinventing a backend.\nSee also [[tech-agentstate-not-a-framework]]. Related: [[tech-ai-agent-stack]], [[project-anyworker]].", "tech-agentstate-not-a-framework": "AgentState does **not** replace LangGraph/AI SDK/etc. It is the state/coordination layer agents call.\n\nRelated: [[project-agentstate]], [[tech-agentstate-five-primitives]], [[tech-ai-agent-stack]].", "tech-ai-agent-stack": "Common public stack pieces:\n\n| Piece | Role |\n|-------|------|\n| Vercel AI SDK | streaming UI + tools |\n| LangGraph / LangChain | graphs & chains |\n| Cloudflare Agents SDK | Workers + DO agents |\n| MCP | tool servers |\n| Flue / Hermes | agent runtimes |\n\nStance: [[user-duyet-ai-stance]]. Runtimes: [[tech-eve-filesystem-agents]], [[tech-hermes-custom-provider]], [[tech-hermes-steer-mode]], [[tech-hermes-dashboard-auth-gate]]. Projects: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]], [[project-duyetbot]].", "tech-ai-sdk-history-dto-convert": "Map `tool-call`/`args`/`result` \u2192 `dynamic-tool` with `input`/`output` and correct `state`. Map annotations \u2192 `data-*` parts.\n\nKeep one endpoint for multiple clients until legacy dies. Related: [[reference-ai-sdk-uimessage]], [[tech-ai-sdk-uimessage-native-tools]].", "tech-ai-sdk-uimessage-native-tools": "Live streams use native part types; history DTOs often use `tool-call` + `annotations` and disappear on reload.\n\nConvert at the client boundary: [[tech-ai-sdk-history-dto-convert]]. Shape: [[reference-ai-sdk-uimessage]].", "tech-eve-filesystem-agents": "Vercel [Eve](https://eve.dev/) authors an agent as files under `agent/`:\n\n| Path | Role |\n|------|------|\n| `instructions.md` | always-on system prompt |\n| `tools/<name>.ts` | tool name = filename |\n| `connections/<name>.ts` | MCP / OpenAPI |\n| `skills/`, `schedules/`, `subagents/` | optional slots |\n\nIdentity comes from the path, not a `name` field. Aligns with [[feedback-docs-driven-development]]. Runtime host: [[tech-eve-runtime-vercel-nitro]].", "tech-eve-runtime-vercel-nitro": "Eve's durable loop (sessions, pause/resume, sandbox) deploys to **Vercel Workflow** or a **self-hosted Nitro Node** server (`eve build` \u2192 `.output/`).\n\nIt does not run inside a thin Cloudflare Worker that only serves static assets plus one `POST /api/chat`. `withEve()` for Next.js expects that Eve service (local eve-dev, Vercel service, or `EVE_NEXT_PRODUCTION_ORIGIN`).\n\nAuthoring files can still follow [[tech-eve-filesystem-agents]] on another host; the durable Eve runtime is a separate deploy choice.", "tech-flue-register-in-initializer": "Flue addresses models as `provider/model`. Register custom providers inside `defineAgent` initializer using `ctx.env`.\n\n`process.env` is empty at module load on workerd. Debug with Node target when errors hide. Related: [[reference-cloudflare-acquires-astro]], [[project-anyrouter]].", "tech-gh-token-git-host-alias": "GitHub CLI (`gh`) credentials are registered for `api.github.com`. Git HTTPS remotes use `github.com` and `gist.github.com`. An exact-host vault lookup therefore misses git clones when the session only holds a `gh` token.\n\n**Why:** `git` and `gh` are different capability specs. Adding `github.com` to the `gh` spec still loses to an exact `git` match.\n\n**How to apply:** At lookup time, alias `github.com` / `gist.github.com` to `api.github.com` so the platform still resolves the token. Prefer exact-host credentials when both exist. Keep the token in memory; do not write it to disk, child env, or git config. Own-TLS clients (`gh`, `curl https://\u2026`) still need a CA/MITM or a per-tool hook.\n\nShipped for OMA's local bridge in duyet/oma #441. Hub: [[project-open-managed-agents]]. Invariant: [[tech-oma-credentials-out-of-sandbox]].", "tech-hermes-custom-provider": "Hermes-style agents: declare `custom_providers` then select `provider: custom` (or named id). Keep keys in env vars, not notes.\n\nRelated: [[tech-ai-agent-stack]], [[tech-cloudflare-ai-gateway-transparent]].", "tech-hermes-dashboard-auth-gate": "Generic lesson: localhost/insecure allowlists must not outrank real auth on exposed binds.\n\nPrefer explicit bind address + auth plugin order tests. Related: [[feedback-public-kb-only]], [[tech-forwardauth-preserve-status]].", "tech-hermes-steer-mode": "Steer mode: in-flight agent incorporates new user messages into the current task.\n\nRelated: [[tech-hermes-custom-provider]], [[tech-ai-agent-stack]].", "tech-llm-gateway-byok-sibling": "If user keys ride a platform backend path, add an explicit `-byok` (or equivalent) route before disabling that backend.\n\nLearned on multi-provider routers like [[project-anyrouter]]. Related: [[tech-llm-gateway-quota-as-retryable]].", "tech-llm-gateway-quota-as-retryable": "Some upstreams return `budget_exceeded` as HTTP 400. Classify as retryable/failover, not terminal client error.\n\nAlso: zero-byte full timeouts are terminal per backend per request \u2014 don't burn identical retries. See [[project-anyrouter]].", "tech-oma-bare-claude-gateway-rewrite": "On the OpenAI-compatible / AnyRouter env-fallback path, OMA rewrites bare `claude-*` model handles to `anthropic/claude-*` (hyphens kept). Prefixed ids and non-Claude handles are unchanged.\n\nAnyRouter aliases hyphenated `anthropic/claude-sonnet-4-6` onto dotted BYOK-only `anthropic/claude-sonnet-4.6`, which 404s `model_unavailable`. Env-fallback therefore sends the live non-BYOK catalog id `anyrouter/free` for those sonnet handles.\n\n`wireModelIdFor` remaps **both** `openai.chat(...)` and `anthropic(...)` when `baseURL` is AnyRouter (#455 covered OpenAI only; #457 closed the Anthropic `/messages` hole where SessionDO with `ANTHROPIC_API_KEY` still POSTed bare sonnet and would strip a mapped `anyrouter/free` to `free`). OpenRouter and direct Anthropic stay unchanged. After #457, spans and `[provider.fetch]` 4xx logs report the HTTP wire `model` (`LanguageModel.modelId` / `request_model=`), not only the agent handle.\n\n**Why:** Hyphen rewrite alone still hit BYOK-only dotted aliases; OpenAI-only remap left the default `ant` `/messages` path broken on live.\n\n**How to apply:** Prefer bare `claude-sonnet-4-6` (seeded General) or `anyrouter/free` on gateway fallback. Recert a new General session after agent-worker deploy: `span.model_request_start.model` and `request_model=` must be `anyrouter/free`, and AnyRouter must not 404 dotted 4.6.\n\nShipped in duyet/oma #439 + #453 + #455 + #457. Hub: [[project-open-managed-agents]].", "tech-oma-cf-two-segment-invoke-package": "On Cloudflare, a Hono mount under `/v1/<group>/<name>` (two segments after `/v1`) must route through `invokePackage` with the two-segment prefix. Nesting `inner.fetch` on `c.req.path` leaves the mount prefix on the URL, so handlers for `/status` or `/connect` never match and return 404 even when the outer auth middleware ran.\n\nSame class of bug for Telegram integrations and AnyRouter provider routes. Flat rewrite that drops only one segment also mis-routes.\n\nHub: [[project-open-managed-agents]].", "tech-oma-credentials-out-of-sandbox": "Invariant for managed agent runtimes: tool sandboxes must not see raw credentials; an outbound proxy injects them.\n\nProject: [[project-open-managed-agents]]. Git host alias: [[tech-gh-token-git-host-alias]]. Related: [[feedback-public-kb-only]].", "tech-prompt-cache-byte-sensitive": "Prompt caching keys on exact prefix bytes. Unstable timestamps, random IDs, or reordered system text kill hit rates.\n\nRelated: [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "tech-python-ast-docstring-markdown": "For a large Python app that is expensive or env-heavy to import, generate **markdown API pages from docstrings with the stdlib `ast` module** (parse files, skip private/`_` names, skip undocumented publics). Do not import the package.\n\n**Why:** Sphinx autodoc, pdoc, and mkdocstrings typically import the app. That needs secrets, settings, and optional deps. `ast` only needs source.\n\n**How to apply:**\n\n- Write one markdown file per module that has documented public classes or functions.\n- Commit the generated tree next to the rest of the docs site so a static `/docs` viewer can serve it with no Python at build time.\n- Keep HTTP OpenAPI as a separate generator. Do not mix route catalogs into the docstring tree.\n- Scope the walk (package prefixes). A whole-`src` dump makes the sidebar unusable.\n- Hand-editing generated pages is wrong; re-run the generator after docstring changes.\n\n[[feedback-docs-driven-development]]", "tech-rag-citation-guards": "Don't accept a citation because the URL exists. Require retrieved passage support for the claim.\n\nRelated: [[tech-rag-toc-pollution]], [[feedback-fail-loud]].", "tech-rag-metadata-key-drift": "If ingest writes `source_url` and query filters `url`, retrieval silently degrades.\n\nLock a schema; test filters. Related: [[tech-rag-toc-pollution]], [[tech-qdrant-config-at-create]].", "tech-rag-toc-pollution": "TOC/index pages often dominate vector search without answering the question.\n\nMitigate: exclude TOCs, chunk body-only, or metadata filters. Related: [[tech-rag-citation-guards]], [[tech-rag-metadata-key-drift]].", "tech-npx-scoped-package-bin": "`npx @scope/name` (and `npx --package @scope/name name`) looks up an executable named **`name`** \u2014 the unscoped last path segment. It does not automatically pick `anyr` just because that is the documented command.\n\nIf the package ships several bins (`anyr`, `anyrouter`, `ar`) and none is named `name`, some npx versions fail with `name: not found` (exit 127) or \"could not determine executable to run\". Newer npx may pick the first bin, so the bug can look machine-specific.\n\n**How to apply:** add a bin key that matches the last path segment, pointing at the same file as the documented command. Keep the documented aliases. Prove it with `npx --yes --package <tarball> <last-segment> --help`, not by reading `package.json` alone.", "tech-note-atomic": "Atomic = one concept per note, short body, dense wikilinks.\n\n**How to apply:** if >~25 lines or multiple independent claims, split. Index: MEMORY.md. See [[tech-note-frontmatter]], [[tech-okf-bundle]].", "tech-note-frontmatter": "Required: `name` (== filename), `description`, `type`, `tags`, `created`, `updated`, `timestamp` (ISO 8601).\n\nOptional: `title`, `category`, `aliases`, `related`, `sources`. No nested `metadata:`.\nLint: `kb lint`. Template: memory/_TEMPLATE.md. See [[tech-note-atomic]].", "tech-okf-bundle": "This repo follows an OKF-inspired layout: `memory/` concepts, generated `index.md`/`log.md`, required `timestamp`.\n\nTools: `kb gen` regenerates indexes + viz. Protocol: [[project-kb]], [[feedback-docs-kb-is-brain]].\nSpec pointer: https://github.com/GoogleCloudPlatform/knowledge-catalog", "tech-unit-suffix-vs-scale": "If a formatter shows `min`/`h`/`ms`, it must not convert magnitudes unless the multiplier is explicit.\n\nSmell: values that can never reach \"60 minutes\" if unit is wrong. Related: [[tech-flat-design-semantic-tokens]].", "tech-bun-mock-module-node-builtins": "On Bun 1.4.2, `mock.module(\"node:child_process\", \u2026)` does not change what `import { spawnSync } from \"node:child_process\"` returns in later importers \u2014 builtin modules bypass the module mock registry. Verified empirically; docs describe mock.module for user modules.\n\nProven substitutes:\n\n- **PATH shim**: create a fixture-local executable script (shebang `#!/path/to/bun`), set `mode: 0o755`, and prepend its directory to `PATH`. Capture argv/stdout to a JSON file; assert on the file. Works for real `spawnSync` and any child that resolves commands via PATH. Combine with `PATH=<shim-dir>` alone (no system dirs) to prove no other executable can run.\n- **`spyOn` before import**: for `process.*`/`globalThis` seams (`process.kill`, `fetch`, `Bun.serve`), `spyOn(...).mockImplementation(...)` placed before dynamically importing the module under test works.\n\n**Why:** teams burn time on the documented-looking `mock.module` path for builtins and silently get the real implementation (worse: real subprocesses).\n**How to apply:** in Bun CLI tests that must fake subprocesses, default to a PATH shim recorder; keep module mocks confined to a fresh child process so spy state never leaks across cases.", "tech-bun-test-home-isolation": "When a test sets `HOME` to a fixture dir and spawns `bun` (e.g. `bun --eval`,\n`bun run file.ts`, or importing modules in a child), Bun may create `<HOME>/.bun`\n\u2014 its install/cache directory \u2014 inside the fixture, even when nothing installs.\n\n**Consequence:** assertions like `readdirSync(fixtureHome)).toEqual([])` fail with\n`[\".bun\"]`, and before/after HOME snapshot comparisons are order-dependent (they\npass only if an earlier test already created `.bun`).\n\n**Fix the invariant, not the fixture:** the property under test is \"the app wrote\nno state\", not \"HOME stayed empty\". Assert the application-owned paths instead:\n\n- the app state dir under the fixture (`~/.local/state/<app>`) does **not** exist\n- the fixture cwd contains only the files the test wrote\n- pure-function paths: no draft/output JSON anywhere under the state dir\n\nNever special-case `.bun` in an allowlist \u2014 that re-couples the test to Bun's\ncache layout. Related: `bun test` does not typecheck; don't present it as a\ntypecheck gate.", "tech-flat-design-hairline": "Flat/hairline look: borders over drop shadows; lucide (or Phosphor) icons; dark mode supported.\n\nRelated: [[tech-flat-design-semantic-tokens]], [[project-monorepo]], [[project-llm-timeline]].", "tech-flat-design-semantic-tokens": "Prefer semantic tokens (`bg-card`, `text-muted-foreground`) so themes/dark mode stay coherent.\n\nRelated: [[tech-flat-design-hairline]], [[tech-shadcn-base]], [[tech-unit-suffix-vs-scale]].", "tech-kumo-rsc-createcontext": "If a UI kit uses `createContext` at import time, every importer may need `\"use client\"` (RSC).\n\nPrefer kits that stay server-safe or isolate client entrypoints. Related: [[tech-shadcn-base]].", "tech-og-images-build-time": "One registry feeds both image generation (e.g. Satori) and route head links. Avoid dual sources of truth.\n\nRelated: [[tech-og-meta-in-prerender]], [[tech-tanstack-start-ssg]].", "tech-og-meta-in-prerender": "Put OG/Twitter meta into prerendered HTML. Client-only `useEffect` head injection is invisible to most crawlers.\n\nRelated: [[tech-og-images-build-time]], [[tech-tanstack-start-ssg]].", "tech-rust-wasm-when": "Prefer TypeScript for most UI/data shaping. Use Rust\u2192WASM when profiling shows >~1ms hot paths.\n\nCI trap: [[tech-wasm-prerender-ci]]. Language context: [[user-duyet-lang-rust]].", "tech-shadcn-base": "Default component kit for public apps: shadcn/ui with CVA variants. Pair with [[tech-flat-design-semantic-tokens]].\n\nUsed in [[project-anyrouter]], [[project-monorepo]]. RSC pitfall: [[tech-kumo-rsc-createcontext]].", "tech-tanstack-stale-chunks": "After deploy, old tabs may request deleted lazy chunks \u2192 runtime error on `component`.\n\nMitigations: soft reload on chunk load failure; keep critical shells prerendered. See [[tech-tanstack-start-ssg]], [[project-anyrouter]].", "tech-tanstack-start-ssg": "Prerender routes to static HTML so crawlers and edge hosts see real content without relying on client JS alone.\n\nPairs with [[tech-og-meta-in-prerender]], [[tech-tanstack-stale-chunks]], [[tech-cloudflare-pages-deploy]].\nUsed by [[project-monorepo]], [[project-llm-timeline]].", "tech-wasm-prerender-ci": "SSG pipelines that import WASM must build release WASM in CI before prerender. Silent empty pages are worse than hard fail.\n\nRelated: [[tech-rust-wasm-when]], [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]].", "tech-agent-loop-cheap-subagents": "Mechanical PR fixes and checklist reviews \u2192 cheaper models. Hard architecture stays on the main/high tier.\n\nPolicy: [[feedback-cheap-models-subagents]]. Cycle: [[tech-agent-loop-cycle]].", "tech-agent-loop-cycle": "Pattern: recurring cycle scans open PRs/issues, classifies, dispatches workers, merges when safe.\n\nCost control: [[tech-agent-loop-cheap-subagents]]. Related: [[project-duyetbot]], [[feedback-never-auto-merge-release-please]].", "tech-codebase-maintenance-loop": "Priority order often: build > tests > lint > deploy > quality > features.\n\nSafe dead-code removal only with proof. Related: [[tech-improvement-loop]], [[feedback-logic-change-update-tests]], [[project-duyetbot]].", "tech-cron-as-code-install-script": "Durable host jobs belong in the repo: a `cron.lines` (or equivalent) file plus\nan installer that wraps the block in `BEGIN`/`END` markers, replaces any prior\nblock, and can `--remove`. Hand-editing `crontab -e` is not reproducible on the\nnext machine.\n\n**How to apply:** new machine runs the installer; do not copy crontab lines from\nchat. When substituting command strings into crontab, do not use `sed` `s|||`\nif the replacement contains `&` (`2>&1`) \u2014 `sed` treats `&` as the match.\n\n**Why:** a missing or corrupted redirect silently drops job logs.", "tech-daily-manager-leaves-worktrees": "A morning manager that fans GitHub issues into isolated git worktrees should\n**not** close those worktrees when a child finishes. Persist a dated folder\n(`SUMMARY.md`, issue picks, per-child status) in the repo so the next morning\nis a review, not an archaeology pass.\n\n**How to apply:** cron starts the manager; nightly cron only refreshes the\nsummary; humans close or merge after reading the summary.\n\n**Why:** transcripts disappear; filesystem state plus open panes are the review\nsurface.\n\n## The two rules that keep \"left open\" from becoming \"lost\"\n\nLeaving worktrees for review is only safe if a dirty worktree cannot lose work,\nand only tidy if a merged one can actually be identified.\n\n1. **Never leave a worktree dirty.** Commit to its own branch first \u2014 a local\n   `wip(...)` commit is fine and needs no push. Observed cost of the\n   alternative: 14 uncommitted files of real implementation parked in a worktree\n   for a day, one `rm` from gone.\n2. **Never trust `git branch --merged` after a squash merge.** Squash changes the\n   sha, so a fully merged branch still reports \"ahead 4, behind 9\" and looks\n   unmerged. Prove it by content instead:\n\n   ```sh\n   git diff <branch> origin/main -- $(git diff --name-only \\\n     $(git merge-base origin/main <branch>) <branch>)\n   ```\n\n   Empty output means every file it touched is byte-identical to `origin/main`.\n   `git cherry` is the cheap complement: `-` means the patch is already upstream.\n\nCorollary: `git status` reporting a branch as \"ahead N\" is not evidence of\nunmerged work. Check the content. See [[tech-silent-scheduler-failure]].", "tech-digest-local-date": "Key a once-per-local-day digest by the audience timezone date, not UTC. If the snapshot row uses UTC and the sender looks up local date, the lookup is null around midnight and the channel never posts.\n\nIf the LLM step that writes the snapshot fails, persist a non-invented fallback (e.g. existing titles) so the send path still has a row. Related: [[project-news]].", "tech-dotenv-unquoted-value-kills-source": "`set -a; source .env` is a common way to load config into a shell. It parses as\n**shell code**, not as a config format, so a value containing an unquoted\nmetacharacter (`<` `>` `|` `&` `;` `(` `)`) is a syntax error:\n\n```\nNAME=Some Product <noreply@example.com>\n    -> syntax error near unexpected token `newline'\n```\n\n**The damage is everything below it.** `source` aborts at that line, so every variable\ndefined *after* it is never set. There is no error at the point of use \u2014 the variable\nis simply empty, and a script continues with a blank URL, host, or password.\n\n**Why it survives for months:** dotenv-style loaders (Node, Python, Vite, wrangler)\ntokenize line-by-line and handle the same file without complaint. Only the shell path\nbreaks, so it fails for scripts and CI steps while the application works fine.\n\nDetect it \u2014 the error goes to stderr and is easy to swallow:\n\n```\nset -a; source .env            # do NOT redirect stderr away\ngrep -nE '^[A-Z_]+=[^\"'\"'\"']*[<>|&;()]' .env      # find unquoted offenders\n```\n\nFix by quoting the value. Prefer quoting **every** value in files that anything\nsources.\n\nTwo related traps:\n- `source` inside a pipeline (`source .env | head`) runs in a subshell, so the\n  variables vanish before the next command \u2014 a test harness bug that looks identical\n  to the real failure.\n- This is the same family as a database client accepting an empty connection string\n  and reporting success: the failure is the *absence* of a value, so nothing throws.", "tech-herdr-morning-issue-desk": "Unattended daily issue pass: a user-session terminal multiplexer (Herdr) is already running. Cron only talks to that socket.\n\n- Morning: start or nudge a **manager** agent on the `main` checkout. Manager does not implement on `main`.\n- Manager writes a **dated run folder** (queue, workers, summary) on disk; leave tabs/workspaces **open** for human review.\n- Children: one isolated git worktree + one agent each. Cap concurrency (default 3).\n- Nightly: if the manager is still live, ask it for a wrap file. Do not spawn a second evening manager.\n- Timers are **code in the repo** (crontab snippet + systemd user units + install script). Re-run install on a new machine.\n- If the multiplexer socket is missing, the cron job exits 0 and logs a skip.\n- Never auto-merge release-please PRs.\n\n**Why:** overnight GitHub triage without mixing work onto `main`.\n**How to apply:** install the repo's issue-desk script; review the latest run folder and open workspaces in the morning.", "tech-improvement-loop": "Loop: pick highest priority \u2192 implement \u2192 lint/test/build \u2192 commit \u2192 deploy \u2192 log.\n\nPersona: [[project-duyetbot]]. Deploy: [[tech-cloudflare-pages-deploy]]. Cheap fan-out: [[feedback-cheap-models-subagents]].", "tech-one-codebase-oss-saas": "Pattern: single high-level deployment mode (`oss|cloud`) that resolves auth/storage defaults. Unset/junk \u2192 OSS so open source never degrades.\n\nNever gate core product features behind cloud-only. Example product: [[project-clickhouse-monitoring]]. Env: [[tech-single-source-env]].", "tech-silent-scheduler-failure": "A cron/agent job that throws before it does its work produces **the same\nobservable state as a job with no work**: no output, no artifacts, no diff. The\nonly difference lives in a log nobody reads.\n\nObserved cost: 24 consecutive daily fires died on one `EISDIR` (a *directory*\nsitting where a `writeFileSync` expected to write a file). 35 of 40 run\ndirectories were empty. It recovered by accident, when an unrelated config edit\nplus a reinstall happened to clear the path. See [[tech-daily-manager-leaves-worktrees]].\n\n**Why:** `writeFileSync` on an existing directory throws \u2014 and because it\nhappens *before* the work starts, the failure is permanent rather than\ntransient, and self-inflicted rather than environmental.\n\n**How to apply:**\n\n- **Never** let a scheduled job's success be \"no error was raised\". Write a\n  heartbeat artifact (a `changes.md`, a state row with a real value) so \"did\n  nothing\" and \"could not start\" are distinguishable.\n- **Report consecutive failures, not the last status.** `Last: fail` is one red\n  word in a wide table; `Fails: 24 from <date>` is the number that gets read.\n  Replayed against a real ledger, that one column would have named the outage\n  on day two instead of day twenty-four.\n- **Make writes self-healing.** Clear the path before writing\n  (`rm -rf <pointer>` then write) so a stale file, dir, or symlink is a non-event.\n- **Make the health check the first finding** of any self-improvement loop \u2014 if\n  the scheduler is broken, every other automated job is silently a no-op too.\n- An **empty run directory** is the cheapest smell there is. Alert on the\n  directory existing with no files in it.", "tech-single-source-env": "Dual sources (hand-maintained wrangler vars vs Vite `VITE_*`) drift silently. Canonical names \u2192 derive client + deploy targets.\n\nSecrets never in committed env files. Related: [[tech-one-codebase-oss-saas]], [[feedback-public-kb-only]].", "tech-tmux-pane-labels": "Use tmux `pane-current-command` \u2192 icon mapping so multi-agent sessions are glanceable.\n\nGeneric DX only \u2014 no hostnames. Related: [[user-duyet-local-dev]], [[user-duyet-ai-claude-code]].", "user-duyet-active-projects": "Duyet builds **many products in parallel** (not single-app focus). Confirm repo before large edits ([[feedback-disambiguate-repo]]).\n\n| Area | Product | Public |\n|------|---------|--------|\n| ClickHouse | [[project-clickhouse-monitoring]] | chmonitor.dev \u00b7 dash.chmonitor.dev \u00b7 github.com/chmonitor/chmonitor |\n| LLM gateway | [[project-anyrouter]] | anyrouter.dev \u00b7 dash.anyrouter.dev \u00b7 docs.anyrouter.dev |\n| AnyRouter OS | [[project-anyrouter-os]] | os.anyrouter.dev |\n| Agent fleet state | [[project-agentstate]] | agentstate.app \u00b7 github.com/duyet/agentstate |\n| Local agent | [[project-anyworker]] | anyworker.dev \u00b7 github.com/duyet/anyworker |\n| Managed agents | [[project-open-managed-agents]] | public OSS |\n| Agent persona | [[project-duyetbot]] | agents.duyet.net |\n| Personal web | [[project-monorepo]] | duyet.net family |\n| Shared brain | [[project-kb]] | kb.duyet.net |\n| Timeline | [[project-llm-timeline]] | llm-timeline.duyet.net |\n| Homelab / charts | [[user-duyet-homelab]] \u00b7 [[project-charts]] | homelab.duyet.net |\n\nAlso: [[user-duyet-multi-project]], [[reference-duyet-github]], [[user-duyet-ai-stance]], [[user-duyet-web-presence]].", "user-duyet-ai-claude-code": "Claude Code is the daily driver after trying many tools. Tools remain disposable \u2014 [[user-duyet-ai-tools-disposable]]. Index: [[user-duyet-ai-stance]].", "user-duyet-ai-stance": "AI practice index:\n\n- [[user-duyet-ai-vibe-codes]] \u2014 agents drive production work\n- [[user-duyet-ai-claude-code]] \u2014 Claude Code as daily driver\n- [[user-duyet-ai-tools-disposable]] \u2014 tools change; don't lock dogma\n- [[tech-ai-agent-stack]] \u2014 SDK ecosystem\n- [[project-duyetbot]] \u2014 autonomous monorepo agent persona\n\nRelated: [[user-duyet-focus-llm-agents]], [[feedback-docs-driven-development]].", "user-duyet-ai-tools-disposable": "Do not enshrine one IDE/agent forever. Prefer portable patterns: [[feedback-docs-driven-development]], [[tech-ai-agent-stack]].", "user-duyet-ai-vibe-codes": "Public practice: vibe-codes for production; agents write more than hand-typed code. See [[user-duyet-ai-stance]], [[feedback-docs-driven-development]].", "user-duyet-data-clickhouse": "Primary analytics engine in public writing and tooling. Products: [[project-clickhouse-monitoring]]. Blog: [[reference-duyet-blog]].", "user-duyet-data-spark-airflow": "Public DE stack also includes Apache Spark and Apache Airflow (blog series). See [[user-duyet-focus-data-engineering]], [[reference-duyet-blog]].", "user-duyet-focus-clickhouse": "ClickHouse is a primary public specialty (blog volume + tooling). Flagship: [[project-clickhouse-monitoring]] / [[project-chmonitor-advisor]]. See [[reference-duyet-blog]], [[user-duyet-stack]], [[user-duyet-active-projects]].", "user-duyet-focus-data-engineering": "Public focus: large-scale data platforms, real-time analytics, Kafka/Spark/Airflow ecosystems.\n\nRelated: [[user-duyet-focus-clickhouse]], [[user-duyet-stack]], [[reference-duyet-blog]].", "user-duyet-focus-llm-agents": "Recurring public themes: coding agents, agent SDKs, RAG, self-improving loops, agent memory.\n\nProducts: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]]. Stance: [[user-duyet-ai-stance]]. Stack: [[tech-ai-agent-stack]]. Pattern: [[feedback-docs-driven-development]].", "user-duyet-github": "https://github.com/duyet \u2014 public repos. Catalog: [[reference-duyet-github]]. Notable: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-clickhouse-monitoring]], [[project-monorepo]], [[project-open-managed-agents]], [[project-kb]], [[project-homelab]].", "user-duyet-handle": "Public handle: **`@duyet`**. GitHub: https://github.com/duyet. Profile hub: [[user-duyet-profile]].", "user-duyet-homelab": "Duyet runs a **personal homelab** for self-host experiments and ops practice.\n\nPublic surface: [[project-homelab]] \u00b7 [[project-charts]] \u00b7 [[user-duyet-site-homelab]].\nStack overlap: [[user-duyet-infra-kubernetes]], [[user-duyet-data-clickhouse]].\n\n**Never store** hosts, IPs, VPN endpoints, or topology here ([[feedback-public-kb-only]]).", "user-duyet-infra-cloudflare": "Cloudflare Workers/Pages host many public apps. Patterns: [[tech-cloudflare-pages-deploy]], [[tech-workers-cache-enabled]], [[project-anyrouter]].", "user-duyet-infra-kubernetes": "Kubernetes appears in public blog series, Helm work, and personal lab practice. See [[project-charts]], [[project-homelab]], [[user-duyet-homelab]], [[user-duyet-stack]].", "user-duyet-lang-python": "Python is a core language for data engineering and agent tooling. See [[user-duyet-stack]], [[user-duyet-focus-data-engineering]].", "user-duyet-lang-rust": "Rust is a primary language on public GitHub (UDFs, data tools, WASM). See [[user-duyet-stack]], [[tech-rust-wasm-when]], [[reference-duyet-github]].", "user-duyet-lang-sql": "SQL is daily for analytics and ClickHouse. See [[user-duyet-focus-clickhouse]], [[user-duyet-data-clickhouse]].", "user-duyet-lang-typescript": "TypeScript/JS for public web apps and Cloudflare Workers. See [[user-duyet-stack]], [[project-monorepo]], [[project-anyrouter]].", "user-duyet-local-dev": "Local tools (public): macOS, Homebrew, `bun`, `uv`, neovim, Obsidian, tmux ([[tech-tmux-pane-labels]]). Prefers [[feedback-semantic-commits]] and [[feedback-concise-english]].", "user-duyet-multi-project": "Default assumption: Duyet is building **several products at once** (gateway, agent infra, ClickHouse tooling, personal sites, homelab).\n\n**How to apply:** disambiguate which repo/product a task is for; don't collapse everything into monorepo. Index: [[user-duyet-active-projects]]. Scope: [[feedback-public-kb-only]].", "user-duyet-profile": "**Duyet Le** (handle `@duyet`) \u2014 senior data engineer and open-source contributor.\n\nHandle: [[user-duyet-handle]]. Active portfolio: [[user-duyet-active-projects]]. Homelab: [[user-duyet-homelab]]. Focus areas: [[user-duyet-focus-data-engineering]], [[user-duyet-focus-clickhouse]], [[user-duyet-focus-llm-agents]].\nStack: [[user-duyet-stack]]. Presence: [[user-duyet-web-presence]]. Style: [[feedback-working-style]].", "user-duyet-site-blog": "https://blog.duyet.net \u2014 digital garden. Themes: [[reference-duyet-blog]]. Feed: https://blog.duyet.net/feed. Index: [[user-duyet-web-presence]].", "user-duyet-site-homelab": "https://homelab.duyet.net \u2014 public overview page for the personal lab.\n\nRelated: [[user-duyet-homelab]], [[user-duyet-web-presence]], [[project-homelab]].", "user-duyet-site-kb": "https://kb.duyet.net renders [[project-kb]]. Implements [[feedback-docs-driven-development]].", "user-duyet-stack": "Stack index (public blog/GitHub). Drill into atoms:\n\n- Languages: [[user-duyet-lang-rust]], [[user-duyet-lang-python]], [[user-duyet-lang-typescript]], [[user-duyet-lang-sql]]\n- Data: [[user-duyet-data-clickhouse]], [[user-duyet-data-spark-airflow]]\n- Infra: [[user-duyet-infra-kubernetes]], [[user-duyet-infra-cloudflare]]\n- AI: [[user-duyet-ai-stance]], [[tech-ai-agent-stack]]\n- Local: [[user-duyet-local-dev]]\n- Homelab: [[user-duyet-homelab]]\n- Products: [[user-duyet-active-projects]]", "user-duyet-web-presence": "Public sites (prefer `/llms.txt` when present):\n\n| Site | URL |\n|------|-----|\n| Profile / blog / CV | https://duyet.net \u00b7 https://blog.duyet.net \u00b7 https://cv.duyet.net (+ `/llms.txt`) |\n| GitHub / X | https://github.com/duyet \u00b7 https://x.com/_duyet |\n| Personal products | https://llm-timeline.duyet.net \u00b7 https://news.duyet.net \u00b7 https://agents.duyet.net \u00b7 https://kb.duyet.net \u00b7 https://homelab.duyet.net |\n| AnyRouter | https://anyrouter.dev \u00b7 https://os.anyrouter.dev \u00b7 https://docs.anyrouter.dev |\n| Agent / CH | https://agentstate.app \u00b7 https://anyworker.dev \u00b7 https://chmonitor.dev |\n\nAtoms: [[user-duyet-site-blog]], [[user-duyet-github]], [[user-duyet-site-kb]], [[user-duyet-site-homelab]]. Portfolio: [[user-duyet-active-projects]]. Profile: [[user-duyet-profile]]."}, "types": ["feedback", "project", "tech", "reference", "user"], "palette": {"feedback": "#ec4899", "project": "#3b82f6", "tech": "#f59e0b", "reference": "#10b981", "user": "#8b5cf6"}};
(function(){
  const b=window.BUNDLE, byId={}; b.nodes.forEach(n=>byId[n.data.id]=n.data);
  const back={}; b.edges.forEach(e=>{(back[e.data.target]=back[e.data.target]||[]).push(e.data.source)});
  const leg=document.getElementById("legend");
  b.types.forEach(t=>{const s=document.createElement("span");s.innerHTML='<i style="background:'+b.palette[t]+'"></i>'+t;leg.appendChild(s)});
  const cy=cytoscape({container:document.getElementById("graph"),elements:[...b.nodes,...b.edges],style:[
    {selector:"node",style:{"label":"data(label)","background-color":"data(color)","width":"data(size)","height":"data(size)","color":"#334155","font-size":10,"text-valign":"bottom","text-margin-y":4,"text-wrap":"wrap","text-max-width":80}},
    {selector:"node:selected",style:{"border-width":3,"border-color":"#0f172a"}},
    {selector:"edge",style:{"width":1,"line-color":"#cbd5e1","curve-style":"bezier","opacity":.55}}
  ],layout:{name:"cose",animate:false,idealEdgeLength:90,nodeRepulsion:9000,padding:20}});
  function select(id){
    cy.nodes().unselect(); const el=cy.getElementById(id); if(el&&el.length)el.select();
    const n=byId[id]; if(!n) return;
    const bodyMd=b.bodies[id]||"";
    const tags=(n.tags||[]).map(t=>'<span>'+t+'</span>').join("");
    const bl=(back[id]||[]).map(s=>'<li><a data-id="'+s+'">'+((byId[s]||{}).label||s)+'</a></li>').join("");
    document.getElementById("detail").innerHTML=
      '<h1>'+n.label+'</h1>'+
      '<span class="badge" style="background:'+(b.palette[n.type]||'#64748b')+'">'+n.type+'</span>'+
      (n.resource?' <a class="muted" href="'+n.resource+'" target="_blank" rel="noopener">source ↗</a>':'')+
      '<p class="desc">'+(n.description||'')+'</p>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<div class="body">'+marked.parse(bodyMd)+'</div>'+
      (bl?'<div id="backlinks"><h2>Linked from</h2><ul>'+bl+'</ul></div>':'');
    document.querySelectorAll('#backlinks a').forEach(a=>a.onclick=()=>select(a.dataset.id));
  }
  cy.on("tap","node",e=>select(e.target.id()));
  if(b.nodes.length) select(b.nodes[0].data.id);
})();
</script>
