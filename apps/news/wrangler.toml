name = "duyet-news"
main = "src/server.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[triggers]
crons = ["0 * * * *"]

[[workflows]]
name = "news-ingest"
binding = "NEWS_INGEST"
class_name = "NewsIngestWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "news"
database_id = "8e692ccf-ec38-4e41-b011-50adbc891322"

[vars]
ANYROUTER_BASE_URL = "https://anyrouter.dev/api/v1"
ANYROUTER_MODEL = "stepfun-ai/step-3.7-flash"

[observability]
enabled = true

[[routes]]
pattern = "news.duyet.net"
custom_domain = true
