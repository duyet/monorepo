name = "duyet-news"
main = "src/server.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
# Enable versioned preview URLs (<version>-duyet-news.<subdomain>.workers.dev)
# so `wrangler versions upload` yields a shareable preview before prod deploy.
preview_urls = true

[assets]
directory = "dist/client"
# `/` must hit the Worker so the homepage SSR's stories (the static
# index.html shell has no feed). Sitemap/robots are Worker-generated.
run_worker_first = ["/", "/sitemap.xml", "/robots.txt", "/api/*"]
not_found_handling = "single-page-application"

# Hourly ingest is GitHub Actions (`.github/workflows/news-ingest.yml`),
# not Worker `[triggers] crons` (Free 5-cron cap breaks deploy) and not
# Workflow `schedules` (paid Workers plan — wrangler deploy exits 1).
# Manual: Actions workflow_dispatch, admin POST /api/admin/ingest, or
# `wrangler workflows trigger news-ingest`.

[[workflows]]
name = "news-ingest"
binding = "NEWS_INGEST"
class_name = "NewsIngestWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "news"
database_id = "8e692ccf-ec38-4e41-b011-50adbc891322"

[vars]
ANYROUTER_BASE_URL = "https://anyrouter.dev/api/v1"
# Live model chains on stealth/ox-alpha (replaced every paid google/gemini-*
# id). Score/TL;DR lead with ox-alpha and fall back to the cheap native ids
# (non-BYOK); translate still leads with Gemma 4 (completes a 3-item JSON
# batch fast) and keeps ox-alpha as the final fallback. No BYOK-only ids
# (SEA-LION, gemini-3.6/3.7, qwen3.7) — a hang/401 on the first id used to
# eat the whole budget before reaching a model that can write title_vi.
ANYROUTER_MODEL = "stealth/ox-alpha,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash"
ANYROUTER_TRANSLATE_MODEL = "google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash,anyrouter/auto,google/gemma-4-31b,stealth/ox-alpha"
# Bilingual TL;DR used to fall through to a reasoning-first chain and time
# out both attempts, leaving English bullets on the VI homepage.
ANYROUTER_TLDR_MODEL = "stealth/ox-alpha,google/gemma-4-26b-a4b-it,z-ai/glm-4.7-flash,inclusionai/ling-3.0-flash"
# Derived from VITE_CLERK_PUBLISHABLE_KEY's base64 domain suffix (see
# apps/news/.env.production): pk_live_Y2xlcmsuZHV5ZXQubmV0JA -> clerk.duyet.net
CLERK_ISSUER = "https://clerk.duyet.net"
# @duyetbot posts top stories to this channel; TELEGRAM_BOT_TOKEN is a secret.
TELEGRAM_CHAT_ID = "-1004420104760"

[[send_email]]
name = "EMAIL"

# Workers Cache: safe for this surface — only responses with public
# Cache-Control headers (feed/story/system APIs, static shell) are cached;
# admin/subscribe/suggest/submit/mcp set no-store and Authorization-bearing
# requests auto-bypass.
[cache]
enabled = true

[observability]
enabled = true

[[routes]]
pattern = "news.duyet.net"
custom_domain = true
