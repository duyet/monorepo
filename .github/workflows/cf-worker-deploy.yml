name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/agent-api/**'
      - 'apps/api/**'
      - 'apps/news/**'
      # news build zips apps/news-tab into public/news-tab.zip (not a
      # separate Worker; news-tab has no wrangler.toml).
      - 'apps/news-tab/**'
      # news bundles @duyet/{components,libs,urls,config} into its client
      # build, so shared-package changes ship to it too.
      - 'packages/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy'
        required: false
        type: choice
        options:
          - agents-api
          - duyet-api
          - news
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

permissions:
  contents: read
  deployments: write

jobs:
  detect-changes:
    name: Detect changed workers
    runs-on: ubuntu-latest
    outputs:
      agents-api: ${{ steps.filter.outputs.agents-api }}
      duyet-api: ${{ steps.filter.outputs.duyet-api }}
      news: ${{ steps.filter.outputs.news }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            agents-api:
              - 'apps/agent-api/**'
            duyet-api:
              - 'apps/api/**'
            news:
              - 'apps/news/**'
              - 'apps/news-tab/**'
              - 'packages/**'

  deploy-agents-api:
    name: Deploy duyet-agents-api Worker
    needs: detect-changes
    if: |
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.worker == 'all' ||
         github.event.inputs.worker == 'agents-api')) ||
      (github.event_name != 'workflow_dispatch' &&
        needs.detect-changes.outputs.agents-api == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        run: |
          missing=0
          if [ -z "$AGENT_API_TOKEN" ]; then
            echo "::error::Required secret AGENT_API_TOKEN is not set"
            missing=1
          fi
          if [ -z "$CLERK_JWT_KEY" ] && [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Either CLERK_JWT_KEY or CLERK_SECRET_KEY must be set"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Required secret CLOUDFLARE_API_TOKEN is not set"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Required secret CLOUDFLARE_ACCOUNT_ID is not set"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more required secrets are missing. Failing deployment."
            exit 1
          fi
          echo "All required secrets are present"
        env:
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker to Cloudflare
        run: |
          cd apps/agent-api

          echo "Setting Worker secrets..."
          printf '%s' "$AGENT_API_TOKEN" | pnpm dlx wrangler@4.20.0 secret put AGENT_API_TOKEN
          if [ -n "$CLERK_JWT_KEY" ]; then
            printf '%s' "$CLERK_JWT_KEY" | pnpm dlx wrangler@4.20.0 secret put CLERK_JWT_KEY
          fi
          if [ -n "$CLERK_SECRET_KEY" ]; then
            printf '%s' "$CLERK_SECRET_KEY" | pnpm dlx wrangler@4.20.0 secret put CLERK_SECRET_KEY
          fi

          pnpm run deploy
        env:
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed Worker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: duyet-agents-api" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: apps/agent-api/" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets**: AGENT_API_TOKEN and Clerk verification configured" >> $GITHUB_STEP_SUMMARY

      - name: Health check
        run: |
          # Get worker URL from wrangler
          WORKER_URL=$(pnpm dlx wrangler@4.20.0 deployments list --name duyet-agents-api --json 2>/dev/null | jq -r '.[0].url // empty')

          if [ -n "$WORKER_URL" ]; then
            echo "Checking $WORKER_URL/health..."
            max_attempts=3
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              if curl -s -f -o /dev/null "${WORKER_URL}/health"; then
                echo "✅ Worker health check passed"
                exit 0
              fi
              echo "Attempt $attempt/$max_attempts failed, waiting 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "⚠️ Worker health check timed out"
          else
            echo "⚠️ Could not determine worker URL, skipping health check"
          fi
        working-directory: apps/agent-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-duyet-api:
    name: Deploy duyet-api Worker
    needs: detect-changes
    if: |
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.worker == 'all' ||
         github.event.inputs.worker == 'duyet-api')) ||
      (github.event_name != 'workflow_dispatch' &&
        needs.detect-changes.outputs.duyet-api == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker to Cloudflare
        run: |
          cd apps/api
          pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed Worker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: duyet-api" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: apps/api/" >> $GITHUB_STEP_SUMMARY

      - name: Health check
        run: |
          # Get worker URL from wrangler
          WORKER_URL=$(pnpm dlx wrangler@4.20.0 deployments list --name duyet-api --json 2>/dev/null | jq -r '.[0].url // empty')

          if [ -n "$WORKER_URL" ]; then
            echo "Checking $WORKER_URL..."
            max_attempts=3
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              if curl -s -f -o /dev/null "$WORKER_URL"; then
                echo "✅ Worker health check passed"
                exit 0
              fi
              echo "Attempt $attempt/$max_attempts failed, waiting 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "⚠️ Worker health check timed out"
          else
            echo "⚠️ Could not determine worker URL, skipping health check"
          fi
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-news:
    name: Deploy duyet-news Worker
    needs: detect-changes
    if: |
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.worker == 'all' ||
         github.event.inputs.worker == 'news')) ||
      (github.event_name != 'workflow_dispatch' &&
        needs.detect-changes.outputs.news == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7  # v3  # v1  # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker to Cloudflare
        run: |
          cd apps/news
          pnpm run deploy
        env:
          NODE_ENV: production
          # Baked into the client bundle at build time — without it the
          # header's sign-in button renders as unavailable.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed Worker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: duyet-news" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: apps/news/" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://news.duyet.net" >> $GITHUB_STEP_SUMMARY

      # The repo's own post-deploy checks: SSR shell, feed/story/system APIs,
      # every static route, and the admin/subscribe rejection paths.
      - name: Smoke test
        run: |
          cd apps/news
          pnpm run smoke
