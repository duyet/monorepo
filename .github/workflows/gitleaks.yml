name: Gitleaks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan working tree for secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_TARBALL: gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "/tmp/${GITLEAKS_TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_TARBALL}"
          echo "${GITLEAKS_SHA256}  /tmp/${GITLEAKS_TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${GITLEAKS_TARBALL}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current tree
        # Working-tree scan on purpose: do not walk git history. Historical
        # leaks remain until keys are rotated; this job only blocks new files.
        run: |
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
